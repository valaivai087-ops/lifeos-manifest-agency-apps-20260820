1", "text": "I was grateful"}, {"l": "Level 2", "text": "Gratitude warmed my heart"}, {"l": "Level 3", "text": "Deep appreciation filled my soul"}, {"l": "Level 4", "text": "Profound gratitude connected to something larger"}, {"l": "Level 5", "text": "Heart overflowed with thanksgiving"}, {"l": "Level 6", "text": "Gratitude is recognition we are woven together"}]}, {"emotion": "\u6211\u5f88\u5bb3\u6015", "levels": [{"l": "Level 1", "text": "I was scared"}, {"l": "Level 2", "text": "Fear knotted in my stomach"}, {"l": "Level 3", "text": "Dread settled like heavy blanket"}, {"l": "Level 4", "text": "Terror gripped as unknown loomed"}, {"l": "Level 5", "text": "Visceral fear awakened primal instincts"}, {"l": "Level 6", "text": "Courage is action despite fear"}]}], "secrets": [{"id": 1, "cat": "base", "title": "\u5207\u984c\u662f\u57fa\u790e", "desc": "\u4efb\u4f55\u9ad8\u5206\u5beb\u4f5c\u90fd\u5fc5\u9808\u5b8c\u5168\u5207\u984c\u3002\u5728\u958b\u59cb\u5beb\u4f5c\u524d\u82b12\u5206\u9418\u7406\u89e3\u984c\u610f\u3002", "examples": [{"bad": "Prompt: Write about your happiest memory. / My response: I like playing video games.", "good": "Prompt: Write about your happiest memory. / My response: The happiest memory of my life was graduating from high school with my best friends."}]}, {"id": 2, "cat": "base", "title": "\u4efb\u52d9\u62c6\u89e3", "desc": "\u628a\u984c\u76ee\u8981\u6c42\u62c6\u62103-4\u500b\u90e8\u5206\u3002\u4f8b\u5982'\u8ac7\u79d1\u6280\u5f71\u97ff'\u5305\u542b\uff1a\u80cc\u666f\u3001\u6b63\u9762\u3001\u8ca0\u9762\u3001\u500b\u4eba\u770b\u6cd5\u3002", "examples": [{"bad": "Technology is important.", "good": "Technology has revolutionized our daily lives. On one hand, it connects people globally. On the other hand, it creates addiction. In my view, balance is essential."}]}, {"id": 3, "cat": "base", "title": "\u5167\u5bb9\u751f\u6210", "desc": "\u7528\u8166\u5716\u6cd5\u751f\u6210\u60f3\u6cd5\u3002\u4e2d\u5fc3\u653e\u984c\u76ee\uff0c\u5206\u652f\u653e\u4e3b\u8981\u89c0\u9ede\uff0c\u518d\u5206\u652f\u653e\u5177\u9ad4\u4f8b\u5b50\u3002", "examples": [{"bad": "I think education is important because it's good.", "good": "Education develops critical thinking skills through problem-solving activities, enhances career opportunities via specialized knowledge, and builds confidence through achievement."}]}, {"id": 4, "cat": "base", "title": "\u908f\u8f2f\u512a\u5148", "desc": "\u908f\u8f2f\u6bd4\u8a5e\u5f59\u91cd\u8981\u3002\u53e5\u5b50\u7c21\u55ae\u4f46\u908f\u8f2f\u6e05\u6670\uff0c\u6bd4\u8a5e\u5f59\u8907\u96dc\u4f46\u908f\u8f2f\u6df7\u4e82\u66f4\u597d\u3002", "examples": [{"bad": "Because I studied hard, my score improved dramatically, which made me happy about my future.", "good": "I studied hard. My score improved. I felt confident about my future."}]}, {"id": 5, "cat": "base", "title": "\u500b\u6027\u5316\u8868\u9054", "desc": "\u5beb\u771f\u5be6\u7684\u81ea\u5df1\u3002\u865b\u5047\u7684\u5b8c\u7f8e\u5ba2\u5957\u8a71\u53cd\u800c\u6263\u5206\u3002", "examples": [{"bad": "I am an exemplary student who always excels in every subject.", "good": "I struggled with math initially, but through persistence, I finally understood calculus."}]}, {"id": 6, "cat": "base", "title": "\u5177\u9ad4\u5927\u65bc\u62bd\u8c61", "desc": "\u7528\u5177\u9ad4\u4f8b\u5b50\u8aaa\u8a71\u3002'I felt happy'\u4e0d\u5982'My heart soared'\u3002", "examples": [{"bad": "I was very happy when I passed the test.", "good": "When I saw my test score, my heart soared and I couldn't stop smiling for days."}]}, {"id": 7, "cat": "base", "title": "\u7d30\u7bc0\u662f\u9748\u9b42", "desc": "\u597d\u6587\u7ae0\u4f4f\u5728\u7d30\u7bc0\u88e1\u3002'My hands trembled'\u6bd4'I was nervous'\u9ad8\u7d1a10\u500d\u3002", "examples": [{"bad": "I was nervous about the presentation.", "good": "My hands trembled as I gripped the podium; my voice wavered on the first sentence; beads of sweat formed on my forehead."}]}, {"id": 8, "cat": "base", "title": "\u771f\u8aa0\u5373\u9ad8\u7d1a", "desc": "\u6700\u9ad8\u7d1a\u7684\u8868\u9054\u5c31\u662f\u771f\u8aa0\u3002\u8b80\u8005\u80fd\u611f\u53d7\u5230\u771f\u5be6\u7684\u60c5\u611f\u3002", "examples": [{"bad": "This experience profoundly transformed my existential perspective.", "good": "This experience taught me that vulnerability is not weakness, but the foundation of genuine connection."}]}, {"id": 9, "cat": "struct", "title": "\u4e94\u6bb5\u8ad6\u7d50\u69cb", "desc": "1.\u958b\u982d\uff08\u5f15\u5165+\u4e2d\u5fc3\u60f3\u6cd5\uff092.\u4f8b\u5b501 3.\u4f8b\u5b502 4.\u6df1\u5c64\u5206\u6790 5.\u7d50\u8ad6\u5347\u83ef", "examples": [{"bad": "First, then, after that, and in conclusion.", "good": "Introduction\u2192Example 1\u2192Example 2\u2192Analysis\u2192Conclusion. This creates a compelling narrative arc."}]}, {"id": 10, "cat": "struct", "title": "\u6bb5\u843d\u4e3b\u984c\u53e5", "desc": "\u6bcf\u6bb5\u958b\u982d\u7b2c\u4e00\u53e5\u5c31\u662f\u8a72\u6bb5\u4e3b\u8981\u60f3\u6cd5\u3002\u8b80\u8005\u4e0d\u7528\u731c\u4f60\u5728\u8aaa\u4ec0\u9ebc\u3002", "examples": [{"bad": "There are many benefits to reading books. Books provide information and entertainment...", "good": "Reading books develops critical thinking skills. When we engage with complex narratives, we learn to analyze, question, and form independent opinions."}]}, {"id": 11, "cat": "struct", "title": "\u8d77\u627f\u8f49\u5408", "desc": "\u958b\u982d\u5f15\u8d77\u8208\u8da3\u2192\u627f\u63a5\u5c55\u958b\u2192\u8f49\u6298\u63d0\u5347\u2192\u7d50\u5c3e\u5347\u83ef\u3002\u9019\u662f\u6587\u7ae0\u7684\u547c\u5438\u3002", "examples": [{"bad": "I failed. I studied. I passed. That's it.", "good": "I failed dramatically. However, instead of giving up, I analyzed my mistakes. This led to a breakthrough. Today, failure means opportunity to me."}]}, {"id": 12, "cat": "struct", "title": "\u907f\u514d\u6d41\u6c34\u5e33", "desc": "\u4e0d\u8981'\u7136\u5f8c...\u7136\u5f8c...\u7136\u5f8c'\u3002\u7528\u6642\u9593\u8a5e\u3001\u908f\u8f2f\u8a5e\u9023\u7d50\uff1a\u56e0\u6b64\u3001\u96a8\u5f8c\u3001\u4f46\u662f\u3002", "examples": [{"bad": "I woke up. I had breakfast. I went to school. I attended class. I returned home.", "good": "When I woke up, my mind was clouded with anxiety. After breakfast, I realized my fears were unfounded. Therefore, I approached school with renewed confidence."}]}, {"id": 13, "cat": "struct", "title": "\u5716\u7247\u63cf\u8ff0\u6cd5", "desc": "\u628a\u6587\u7ae0\u7576\u96fb\u5f71\u5834\u666f\u3002\u7b2c\u4e00\u6bb5\u662f\u958b\u5834\u93e1\u982d\uff0c\u6700\u5f8c\u6bb5\u662f\u7d50\u5c40\u3002", "examples": [{"bad": "The meeting was important.", "good": "Picture me sitting at the wooden table, morning sunlight streaming through the window. My mentor leans forward. Her words change everything."}]}, {"id": 14, "cat": "struct", "title": "\u6bb5\u843d\u9577\u5ea6", "desc": "\u6bcf\u6bb53-5\u53e5\u8a71\u3002\u592a\u9577\u8b80\u4e0d\u5b8c\uff0c\u592a\u77ed\u6c92\u5167\u5bb9\u3002", "examples": [{"bad": "Paragraph 1: One sentence. Paragraph 2: Twelve sentences of rambling.", "good": "Each paragraph contains 3-5 focused sentences that develop one central idea."}]}, {"id": 15, "cat": "struct", "title": "\u6bb5\u843d\u9023\u7d50", "desc": "\u6bb5\u5c3e\u6697\u793a\u4e0b\u6bb5\u4e3b\u984c\uff0c\u6bb5\u9996\u56de\u61c9\u4e0a\u6bb5\u60f3\u6cd5\u3002\u8b93\u6587\u7ae0\u6d41\u66a2\u9023\u8cab\u3002", "examples": [{"bad": "Paragraph 1 ends. Paragraph 2 starts with completely new idea.", "good": "Paragraph 1: ...this experience taught me humility. Paragraph 2: Through humility, I discovered..."}]}, {"id": 16, "cat": "struct", "title": "\u958b\u982d\u7684\u529b\u91cf", "desc": "\u597d\u7684\u958b\u982d\u8b93\u4eba\u60f3\u8b80\u4e0b\u53bb\u3002\u907f\u514d'Today I want to talk about...'\u9019\u7a2e\u6a21\u677f\u3002", "examples": [{"bad": "Today I want to talk about a time I failed. I think it's important.", "good": "The moment my exam paper was returned with a failing grade, I felt the ground disappear beneath my feet."}]}, {"id": 17, "cat": "struct", "title": "\u7d50\u5c3e\u5347\u83ef", "desc": "\u7d50\u5c3e\u61c9\u8a72\u6bd4\u958b\u982d\u66f4\u9ad8\u7d1a\u3002\u5f9e\u500b\u4eba\u7d93\u9a57\u5347\u83ef\u5230\u666e\u904d\u610f\u7fa9\u3002", "examples": [{"bad": "In conclusion, this experience was very important to me.", "good": "Today, I understand that every failure is an invitation to become stronger, to think deeper, and to love more courageously."}]}, {"id": 18, "cat": "struct", "title": "\u53cd\u8f49\u8207\u9a5a\u559c", "desc": "\u5728\u8b80\u8005\u9810\u6599\u4e4b\u5916\u7684\u5730\u65b9\u8a2d\u7f6e\u8f49\u6298\u3002\u9019\u6703\u8b93\u6587\u7ae0\u66f4\u6709\u529b\u3002", "examples": [{"bad": "I studied hard. I passed the test. Everyone was happy.", "good": "I studied hard, sacrificed sleep, and stressed for weeks. But when I passed, I realized the real reward wasn't the grade\u2014it was discovering my own resilience."}]}, {"id": 19, "cat": "lang", "title": "\u539f\u56e0\u53e5\u578b", "desc": "Because + S + V / As a result / Due to / Owing to / On account of", "examples": [{"bad": "Because I practiced every day, so my English improved a lot.", "good": "Because I practiced speaking daily, my confidence in conversations grew exponentially."}]}, {"id": 20, "cat": "lang", "title": "\u7d50\u679c\u53e5\u578b", "desc": "Therefore / Consequently / As a result / Thus / In consequence", "examples": [{"bad": "I worked hard and I succeeded.", "good": "I worked hard; consequently, success followed in ways I never anticipated."}]}, {"id": 21, "cat": "lang", "title": "\u5c0d\u6bd4\u53e5\u578b", "desc": "In contrast / On the other hand / Unlike / Similarly / Whereas", "examples": [{"bad": "Some people like coffee. Other people like tea.", "good": "Whereas coffee energizes me instantly, tea provides a calm, sustained focus."}]}, {"id": 22, "cat": "lang", "title": "\u8209\u4f8b\u53e5\u578b", "desc": "For example / Such as / For instance / To illustrate / A case in point", "examples": [{"bad": "Technology is important, like smartphones.", "good": "Technology has transformed communication; for instance, smartphones enable us to connect across continents instantaneously."}]}, {"id": 23, "cat": "lang", "title": "\u689d\u4ef6\u53e5\u578b", "desc": "If... then... / Unless / Provided that / In case / As long as", "examples": [{"bad": "If you study, you will pass.", "good": "Provided that you study systematically and seek help when confused, success will inevitably follow."}]}, {"id": 24, "cat": "lang", "title": "\u8b93\u6b65\u53e5\u578b", "desc": "Although / Even though / Despite / In spite of / Notwithstanding", "examples": [{"bad": "Although it was hard, I continued.", "good": "Despite the overwhelming challenges, I discovered an inner strength I didn't know I possessed."}]}, {"id": 25, "cat": "lang", "title": "\u95dc\u4fc2\u5b50\u53e5", "desc": "Who/Whom/Whose/Which/That - \u80fd\u628a\u7c21\u55ae\u53e5\u8b8a\u8907\u96dc\u53e5\u3002", "examples": [{"bad": "I met a teacher. She changed my perspective.", "good": "I met a teacher who fundamentally changed my perspective on learning and life."}]}, {"id": 26, "cat": "lang", "title": "\u5206\u8a5e\u7d50\u69cb", "desc": "V-ing\u548cV-ed\u958b\u982d\u7684\u77ed\u8a9e\u80fd\u8c50\u5bcc\u53e5\u578b\u3002'Realizing the mistake, I...'", "examples": [{"bad": "When I realized my mistake, I apologized immediately.", "good": "Realizing my grave mistake, I apologized with genuine remorse."}]}, {"id": 27, "cat": "lang", "title": "\u540d\u8a5e\u5b50\u53e5", "desc": "What I learned was... / The fact that... / Whether or not...", "examples": [{"bad": "I learned something important.", "good": "What I learned was that persistence matters more than innate talent."}]}, {"id": 28, "cat": "lang", "title": "\u7cbe\u6e96\u52d5\u8a5e", "desc": "\u7528\u7cbe\u6e96\u52d5\u8a5e\u4ee3\u66ff'go'\u3001'make'\u3002'stride'\u3001'wander'\u3001'dash'\u3002", "examples": [{"bad": "He went to the store and made some food.", "good": "He trudged to the market and meticulously crafted a traditional meal."}]}, {"id": 29, "cat": "lang", "title": "\u5f62\u5bb9\u8a5e\u5347\u7d1a", "desc": "\u4e0d\u7528'very happy'\uff0c\u7528'elated'\u3001'jubilant'\u3001'overjoyed'\u3002", "examples": [{"bad": "I was very happy and very sad.", "good": "I oscillated between euphoria and melancholy."}]}, {"id": 30, "cat": "lang", "title": "\u526f\u8a5e\u904b\u7528", "desc": "\u653e\u5728\u52d5\u8a5e\u524d\u6216\u53e5\u9996\u6539\u8b8a\u53e5\u5b50\u5473\u9053\u3002'Gradually, I realized...'", "examples": [{"bad": "I understood the lesson slowly.", "good": "Gradually, imperceptibly, the lesson dawned on me like sunrise breaking through fog."}]}, {"id": 31, "cat": "lang", "title": "\u8a5e\u5f59\u914d\u642d", "desc": "\u67d0\u4e9b\u8a5e\u559c\u6b61\u914d\u5728\u4e00\u8d77\uff1a'deep reflection'\u4e0d\u662f'dark reflection'\u3002", "examples": [{"bad": "I had a dark reflection about life.", "good": "I engaged in deep reflection about the meaning of existence."}]}, {"id": 32, "cat": "lang", "title": "\u4fee\u98fe\u9806\u5e8f", "desc": "\u591a\u500b\u5f62\u5bb9\u8a5e\u8981\u6309\u610f\u898b\u2192\u5927\u5c0f\u2192\u5e74\u9f61\u2192\u984f\u8272\u2192\u6750\u6599\u9806\u5e8f\u3002", "examples": [{"bad": "a beautiful small old blue wooden house.", "good": "a small, beautiful, old blue wooden house."}]}, {"id": 33, "cat": "lang", "title": "\u5e73\u884c\u7d50\u69cb", "desc": "\u5217\u8209\u6642\u4fdd\u6301\u7d50\u69cb\u4e00\u81f4\uff1a'reading books, watching films, and traveling'\u3002", "examples": [{"bad": "I enjoy reading, to watch movies, and travel.", "good": "I enjoy reading books, watching films, and traveling the world."}]}, {"id": 34, "cat": "lang", "title": "\u5f37\u8abf\u7d50\u69cb", "desc": "It is... that... \u7d50\u69cb\u5f37\u8abf\u91cd\u9ede\u3002'It was the failure that taught me.'", "examples": [{"bad": "The failure taught me something.", "good": "It was the failure that taught me resilience is my greatest strength."}]}, {"id": 35, "cat": "lang", "title": "\u88ab\u52d5\u8a9e\u614b", "desc": "\u4e3b\u8981\u7528\u65bc\u5f37\u8abf\u3002\u5927\u91cf\u88ab\u52d5\u8a9e\u614b\u8b80\u8d77\u4f86\u7121\u529b\u3002", "examples": [{"bad": "The project was completed by me in two days. The results were analyzed by my team.", "good": "I completed the project in two days. My team then analyzed the results and celebrated our success."}]}, {"id": 36, "cat": "lang", "title": "\u8f49\u79fb\u7126\u9ede", "desc": "\u7528Get\u3001Have\u7b49\u4f7f\u5f79\u52d5\u8a5e\u6539\u8b8a\u53e5\u5b50\u7126\u9ede\u3002'I had my dream shattered.'", "examples": [{"bad": "I broke my promise to myself.", "good": "I had my promise shattered by circumstances beyond my control."}]}, {"id": 37, "cat": "lang", "title": "\u60f3\u50cf\u529b\u8a5e\u5f59", "desc": "\u7528metaphor\u3001simile\u3001personification\u8b93\u5beb\u4f5c\u751f\u52d5\u3002'Hope is a flame.'", "examples": [{"bad": "I felt better.", "good": "Hope ignited within me like a flame in darkness, burning brighter with each passing day."}]}, {"id": 38, "cat": "lang", "title": "\u97f3\u6a02\u611f", "desc": "\u8b80\u51fa\u4f86\u6709\u7bc0\u594f\u611f\u3002\u7528\u4e0d\u540c\u9577\u5ea6\u7684\u53e5\u5b50\u88fd\u9020\u7bc0\u594f\u3002", "examples": [{"bad": "I walked to the store and I bought milk and I talked to my friend and I went home.", "good": "I walked to the store. Bought milk. Chatted with my friend. Each small moment held beauty."}]}, {"id": 39, "cat": "gram", "title": "\u4e3b\u8b02\u4e00\u81f4", "desc": "\u96c6\u5408\u540d\u8a5e\uff08group\u3001team\uff09\u914d\u8907\u6578\u52d5\u8a5e\u3002'The team are divided.'", "examples": [{"bad": "The team is divided on the decision.", "good": "The team are divided on whether to pursue this strategy."}]}, {"id": 40, "cat": "gram", "title": "\u6642\u614b\u908f\u8f2f", "desc": "\u904e\u53bb\u6558\u8ff0\u7528past tense\uff0c\u73fe\u5728\u60f3\u6cd5\u7528present tense\u3002\u4e0d\u8981\u6df7\u4e82\u3002", "examples": [{"bad": "Last year I fail the test. I realize it was important.", "good": "Last year I failed the test. Now I realize it was important."}]}, {"id": 41, "cat": "gram", "title": "\u53ef\u6578\u4e0d\u53ef\u6578", "desc": "\u53ef\u6578\u540d\u8a5e\u7528a/an/one\uff0c\u4e0d\u53ef\u6578\u7528some/much\u3002'informations'\u662f\u932f\u7684\u3002", "examples": [{"bad": "I gathered many informations for my research.", "good": "I gathered much information and many sources for my research."}]}, {"id": 42, "cat": "gram", "title": "\u51a0\u8a5e\u4f7f\u7528", "desc": "\u7b2c\u4e00\u6b21\u63d0\u53ca\u7528a\uff0c\u518d\u63d0\u53ca\u7528the\u3002\u65b0\u6982\u5ff5\u901a\u5e38\u7528a\u3002", "examples": [{"bad": "I met teacher. The teacher told me story about his life.", "good": "I met a teacher. The teacher told me a story about his life."}]}, {"id": 43, "cat": "gram", "title": "\u4ecb\u7cfb\u8a5e\u7cbe\u6e96", "desc": "in/on/at\u4f4d\u7f6e\u5f88\u91cd\u8981\u3002'at the airport'\u4e0d\u662f'in the airport'\u3002", "examples": [{"bad": "We waited in the airport for three hours.", "good": "We waited at the airport for three hours."}]}, {"id": 44, "cat": "gram", "title": "\u8a5e\u6027\u8f49\u63db", "desc": "know\u2192knowledge\u3001curious\u2192curiosity\u3002\u540d\u8a5e\u5316\u80fd\u8b93\u53e5\u5b50\u66f4formal\u3002", "examples": [{"bad": "I know many things, and my curiosity is great.", "good": "My extensive knowledge and intense curiosity drive my research."}]}, {"id": 45, "cat": "gram", "title": "\u53e5\u5b50\u5b8c\u6574", "desc": "\u6bcf\u53e5\u90fd\u8981\u6709\u4e3b\u8a9e\u548c\u52d5\u8a5e\u3002Fragment\u548cRun-on\u90fd\u662f\u932f\u8aa4\u3002", "examples": [{"bad": "Running toward the finish line. Exhausted but determined.", "good": "Running toward the finish line, I felt exhausted but determined."}]}, {"id": 46, "cat": "gram", "title": "\u4ee3\u8a5e\u6307\u4ee3", "desc": "\u4ee3\u8a5e\u8981\u6e05\u695a\u6307\u5411\u524d\u9762\u7684\u540d\u8a5e\u3002\u4e0d\u8981'They said it was good'\u8b80\u8005\u4e0d\u77e5\u9053\u8ab0", "examples": [{"bad": "The teachers told the students they would pass. They were happy.", "good": "The teachers told the students they would pass. The students were happy."}]}, {"id": 47, "cat": "error", "title": "\u907f\u514d\u4e2d\u5f0f\u82f1\u6587", "desc": "\u4e0d\u8981\u76f4\u8b6f\u4e2d\u6587\u908f\u8f2f\u3002'He very like it'\u662f\u4e2d\u5f0f\uff0c\u61c9\u662f'He really likes it'\u3002", "examples": [{"bad": "This book very good. I very like it.", "good": "This book is excellent. I genuinely enjoy reading it."}]}, {"id": 48, "cat": "error", "title": "\u9023\u63a5\u8a5e\u6feb\u7528", "desc": "\u5c11\u7528and\u548cbut\u9023\u63a5\u53e5\u5b50\u3002\u7528semicolon\u6216period\u958b\u65b0\u53e5\u3002", "examples": [{"bad": "I studied hard and I failed and I felt sad and I tried again.", "good": "I studied hard. I failed. In that moment of despair, I tried again. And this time, I succeeded."}]}, {"id": 49, "cat": "error", "title": "I think\u91cd\u8907", "desc": "\u4e0d\u7528\u4e00\u76f4\u8aaa'I think'\u3002\u96b1\u542b\u5c31\u53ef\u4ee5\u4e86\uff1a'Success requires persistence.'", "examples": [{"bad": "I think success is important. I think it requires hard work. I think dedication matters.", "good": "Success requires dedication. Hard work opens doors. Persistence builds character."}]}, {"id": 50, "cat": "error", "title": "very\u5f88\u7a7a\u865b", "desc": "\u4e0d\u7528'very good'\uff0c\u7528'excellent'\u3001'superb'\u3001'outstanding'\u3002", "examples": [{"bad": "The movie was very good and very interesting.", "good": "The film was captivating and intellectually stimulating."}]}, {"id": 51, "cat": "error", "title": "\u6210\u8a9e\u76f4\u8b6f", "desc": "\u4e0d\u8981\u628a\u4e2d\u6587\u6210\u8a9e\u76f4\u8b6f\u3002'It's raining cats and dogs'\u624d\u5c0d\uff0c\u4e0d\u662f'raining cats'\u3002", "examples": [{"bad": "This task is very difficult, like climbing a mountain.", "good": "This task is formidable, requiring determination and strategic thinking."}]}, {"id": 52, "cat": "error", "title": "\u7e2e\u5beb\u898f\u5247", "desc": "\u6b63\u5f0f\u5beb\u4f5c\u5c11\u7528shouldn't\u3002\u5beb\u6210'should not'\u66f4formal\u3002", "examples": [{"bad": "I shouldn't've made that mistake. You'd better think about it.", "good": "I should not have made that mistake. You should consider this carefully."}]}, {"id": 53, "cat": "error", "title": "\u5927\u5c0f\u5beb\u898f\u5247", "desc": "\u53e5\u9996\u3001\u5c08\u6709\u540d\u8a5e\u3001I\u8981\u5927\u5beb\u3002\u5b63\u7bc0\u3001\u6708\u4efd\u901a\u5e38\u5c0f\u5beb\u3002", "examples": [{"bad": "i visited paris in Summer. The weather was warm.", "good": "I visited Paris in summer. The weather was warm."}]}, {"id": 54, "cat": "error", "title": "\u6a19\u9ede\u898f\u5247", "desc": "comma\u5728\u5f15\u865f\u5167\uff0cperiod\u5728\u53e5\u672b\u3002\u9023\u63a5\u8a5e\u524d\u7528\u5206\u865f\u3002", "examples": [{"bad": "She said, \"I love this book\". He disagreed, however he respected her opinion.", "good": "She said, \"I love this book.\" He disagreed; however, he respected her opinion."}]}, {"id": 55, "cat": "error", "title": "\u5197\u4f59\u8868\u9054", "desc": "'very unique'\u3001'new innovation'\u662f\u5197\u4f59\u3002unique\u548cinnovation\u5df2\u7d93\u8868\u9054\u7d55\u5c0d\u3002", "examples": [{"bad": "This is a very unique opportunity and a brand new innovation.", "good": "This is a unique opportunity and a genuine innovation."}]}, {"id": 56, "cat": "train", "title": "Six Questions\u8a13\u7df4", "desc": "Who What When Where Why How - \u7528\u90196\u554f\u751f\u6210\u6545\u4e8b\u6846\u67b6\u3002", "examples": [{"bad": "I had an experience.", "good": "Who: me. What: failed an exam. When: last fall. Where: school. Why: didn't study properly. How: learned persistence."}]}, {"id": 57, "cat": "train", "title": "PREP\u6cd5\u5247", "desc": "Point(\u4e2d\u5fc3) Reason(\u539f\u56e0) Example(\u4f8b\u5b50) Point(\u91cd\u7533)\u3002", "examples": [{"bad": "Education is important because it helps people.", "good": "Point: Education shapes futures. Reason: It builds critical skills. Example: Through debate, I learned to think independently. Point: This is why education transforms lives."}]}, {"id": 58, "cat": "train", "title": "PEEL\u6cd5\u5247", "desc": "Point Example Explanation Link\u3002\u6bcf\u6bb5\u4e00\u500b\u4e3b\u8981\u8ad6\u9ede\u3002", "examples": [{"bad": "Point is good. Example shows it. End.", "good": "Point: Failure builds character. Evidence: Losing the competition devastated me. Explanation: Through this pain, I discovered resilience. Link: This resilience now defines who I am."}]}, {"id": 59, "cat": "train", "title": "\u53e5\u5b50\u5347\u7d1a", "desc": "\u628a\u7c21\u55ae\u53e5\u8b8a\u8907\u96dc\u53e5\u3002'I was sad'\u2192'Sadness gnawed at me like an unseen force'", "examples": [{"bad": "I was sad. I was alone. I was scared.", "good": "Sadness gnawed at me like an unseen force, intensified by isolation and haunted by unnamed fears."}]}, {"id": 60, "cat": "train", "title": "\u8a9e\u584a\u6a21\u7d44", "desc": "\u7d2f\u7a4d\u5e38\u7528\u77ed\u8a9e\u3002'be faced with'\u3001'make sense of'\u3001'come to terms with'\u3002", "examples": [{"bad": "When I faced problems, I tried to understand them.", "good": "When faced with adversity, I struggled to make sense of it; eventually, I came to terms with the reality."}]}, {"id": 61, "cat": "train", "title": "\u4e00\u984c\u591a\u5beb", "desc": "\u540c\u4e00\u984c\u76ee\u5beb5\u500b\u4e0d\u540c\u7248\u672c\u3002\u6bcf\u7248\u672c\u5617\u8a66\u4e0d\u540c\u7684\u89d2\u5ea6\u548c\u8a5e\u5f59\u3002", "examples": [{"bad": "Write the same way every time.", "good": "Topic: my biggest fear. Version 1: Vulnerability angle. Version 2: Growth angle. Version 3: Courage angle. Version 4: Connection angle. Version 5: Transformation angle."}]}, {"id": 62, "cat": "train", "title": "\u4eff\u5beb\u8a13\u7df4", "desc": "\u6a21\u4eff\u7bc4\u6587\u7d50\u69cb\u548c\u8868\u9054\u3002\u5148\u4eff\u5beb\uff0c\u518d\u5275\u65b0\u3002", "examples": [{"bad": "Write your own way from the start.", "good": "Model: 'The moment I realized X, my perspective shifted entirely.' Your turn: 'The moment I realized my potential, my limitations dissolved entirely.'"}]}, {"id": 63, "cat": "train", "title": "\u6539\u5beb\u8a13\u7df4", "desc": "\u628a\u7c21\u55ae\u53e5\u6539\u6210\u8907\u96dc\u53e5\u3002\u628a\u88ab\u52d5\u6539\u4e3b\u52d5\u3002", "examples": [{"bad": "I like reading. Books teach me. This is good.", "good": "Reading captivates me because books illuminate new worlds and expand my understanding of human nature."}]}, {"id": 64, "cat": "train", "title": "\u9650\u6642\u8f38\u51fa", "desc": "20\u5206\u9418\u5beb300\u5b57\u3002\u8a13\u7df4\u901f\u5ea6\u548c\u81ea\u4fe1\u3002", "examples": [{"bad": "Spend hours perfecting one essay.", "good": "Set timer for 20 minutes. Write 300 words without editing. Build fluency and confidence."}]}, {"id": 65, "cat": "train", "title": "\u7d20\u6750\u9280\u884c", "desc": "\u7a4d\u7d2f\u597d\u53e5\u5b50\u3001\u597d\u6545\u4e8b\u3001\u597d\u4f8b\u5b50\u3002\u5beb\u4f5c\u6642\u63d0\u53d6\u4f7f\u7528\u3002", "examples": [{"bad": "Create new content every time.", "good": "Bank: metaphors, historical examples, personal anecdotes, powerful phrases. During writing, retrieve relevant materials."}]}, {"id": 66, "cat": "train", "title": "\u807d\u5beb\u8a13\u7df4", "desc": "\u807d\u82f1\u6587podcast\u908a\u807d\u908a\u5beb\u3002\u63d0\u9ad8\u807d\u529b\u540c\u6642\u5b78\u53e5\u578b\u3002", "examples": [{"bad": "Only read practice materials.", "good": "Listen to TED Talks. Transcribe key sentences. Notice how native speakers structure ideas."}]}, {"id": 67, "cat": "train", "title": "\u4ea4\u53c9\u8a55\u6539", "desc": "\u540c\u5b78\u4e92\u6539\u4f5c\u6587\u3002\u8a55\u6539\u5225\u4eba\u4e5f\u662f\u5b78\u7fd2\u81ea\u5df1\u3002", "examples": [{"bad": "Only teacher provides feedback.", "good": "Peer A evaluates Peer B's essay. Provides specific, constructive criticism. Both learners grow."}]}, {"id": 68, "cat": "train", "title": "\u8a18\u9304\u932f\u8aa4", "desc": "\u628a\u5e38\u72af\u7684\u932f\u8aa4\u8a18\u4e0b\u4f86\u3002\u6539\u4e86\u7684\u932f\u8aa4\u624d\u4e0d\u6703\u518d\u72af\u3002", "examples": [{"bad": "Make same mistakes repeatedly.", "good": "Error log: misused 'however' three times. After recording, never repeated mistake again."}]}, {"id": 69, "cat": "train", "title": "\u8a5e\u5f59\u7b46\u8a18", "desc": "\u628a\u9047\u5230\u7684\u597d\u8a5e\u597d\u53e5\u8a18\u4e0b\u4f86\u3002\u5b9a\u671f\u8907\u7fd2\u3002", "examples": [{"bad": "Encounter new words but forget them.", "good": "Journal: 'ephemeral'=temporary. Example: 'Youth's ephemeral beauty demands we seize the moment.' Review weekly."}]}, {"id": 70, "cat": "exam", "title": "\u5148\u898f\u5283\u518d\u5beb", "desc": "\u82b13\u5206\u9418\u505a\u63d0\u7db1\u3002\u5beb\u4f5c\u7684\u6642\u5019\u6703\u5feb\u5f88\u591a\u3002", "examples": [{"bad": "Start writing immediately without planning.", "good": "Outline: Intro (hook) \u2192 Point 1 (2 sentences) \u2192 Point 2 (2 sentences) \u2192 Point 3 (2 sentences) \u2192 Conclusion (lift-off)."}]}, {"id": 71, "cat": "exam", "title": "\u8349\u7a3f\u5beb\u95dc\u9375\u5b57", "desc": "\u5728\u8349\u7a3f\u4e0a\u53ea\u5beb\u95dc\u9375\u5b57\u548c\u60f3\u6cd5\u3002\u4e0d\u8981\u5beb\u5b8c\u6574\u53e5\u5b50\u6d6a\u8cbb\u6642\u9593\u3002", "examples": [{"bad": "Write full draft of essay on scratch paper.", "good": "Scratch paper: failure \u2192 analyze \u2192 strategy \u2192 improvement \u2192 resilience. Use these anchors to build essay."}]}, {"id": 72, "cat": "exam", "title": "\u4fdd\u7559\u6aa2\u67e5\u6642\u9593", "desc": "\u6700\u5f8c\u75595\u5206\u9418\u6aa2\u67e5\u62fc\u5beb\u3001\u6587\u6cd5\u3001\u6642\u614b\u3002", "examples": [{"bad": "Write until time runs out.", "good": "Stop writing at 55 minutes. Spend final 5 minutes: spell-check, grammar verification, tense consistency."}]}, {"id": 73, "cat": "exam", "title": "\u5361\u4f4f\u63db\u8def\u5f91", "desc": "5\u5206\u9418\u60f3\u4e0d\u5230\u4f8b\u5b50\u5c31\u8df3\u904e\u3002\u505a\u5b8c\u5176\u4ed6\u90e8\u5206\u518d\u56de\u4f86\u3002", "examples": [{"bad": "Spend 15 minutes trying to perfect one sentence.", "good": "Example stuck? Skip. Move to next paragraph. Return after completing rest of essay with fresh perspective."}]}, {"id": 74, "cat": "exam", "title": "\u8b80\u984c\u4ed4\u7d30", "desc": "\u628a\u984c\u76ee\u95dc\u9375\u8a5e\u5708\u51fa\u4f86\u3002\u907f\u514d\u907a\u6f0f\u8981\u6c42\u3002", "examples": [{"bad": "Skim prompt and start writing.", "good": "Prompt: 'Describe a time you failed AND how you recovered.' Circle 'failed' and 'recovered.' Address both."}]}, {"id": 75, "cat": "exam", "title": "\u6aa2\u67e5\u9806\u5e8f", "desc": "\u5148\u6aa2\u67e5\u662f\u5426\u5207\u984c\uff0c\u518d\u6aa2\u67e5\u6587\u6cd5\uff0c\u6700\u5f8c\u6aa2\u67e5\u8a5e\u5f59\u3002", "examples": [{"bad": "Fix random errors without system.", "good": "Check 1: Does essay answer the prompt completely? Check 2: Grammar and tense correct? Check 3: Vocabulary precise and varied?"}]}]};

    // 页面导航
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const page = this.getAttribute('data-page');
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(page)?.classList.add('active');
        this.classList.add('active');
        window.scrollTo(0, 0);
      });
    });

    // 渲染42題
    function renderTopics(topics) {
      const container = document.getElementById('topicsContainer');
      if (!container) return;
      container.innerHTML = topics.map(t => `
        <div class="card" onclick="this.querySelector('.card-content').classList.toggle('active'); this.querySelector('.card-header span:last-child').textContent = this.querySelector('.card-content').classList.contains('active') ? '▲' : '▼'">
          <div class="card-header">
            <span><span class="card-number">${t.id}</span> ${t.title}</span>
            <span style="color: #0A7A72;">▼</span>
          </div>
          <div class="card-content">
            <h3>📝 說明</h3><p>${t.desc} | 字數${t.words}</p>
            <h3>📖 答案</h3><div class="example">${t.sample}</div>
            <h3>❌ 常見弱點</h3><div class="example bad-example">${t.bad}</div>
            <h3>📊 對比</h3>
            <table class="table-mini">
              <tr><th>維度</th><th>問題</th><th>改進</th><th>分</th></tr>
              ${t.comparison.map(c => `<tr><td>${c.aspect}</td><td>${c.bad}</td><td>${c.good}</td><td>${c.score}</td></tr>`).join('')}
            </table>
            <h3>🎯 公式</h3><div class="formula">${t.formula}</div>
            <h3>💡 訣竅</h3>${t.tips_list.map(tip => `<div class="tip">✓ ${tip}</div>`).join('')}
          </div>
        </div>
      `).join('');
    }

    // 渲染16法
    function renderMethods(methods) {
      const container = document.getElementById('methodsContainer');
      if (!container) return;
      container.innerHTML = methods.map(m => `
        <div class="card" onclick="this.querySelector('.card-content').classList.toggle('active'); this.querySelector('.card-header span:last-child').textContent = this.querySelector('.card-content').classList.contains('active') ? '▲' : '▼'">
          <div class="card-header">
            <span><span class="card-number">${m.id}</span> ${m.name}</span><span>▼</span>
          </div>
          <div class="card-content">
            <h3>原理</h3><p>${m.principle}</p>
            <h3>技巧</h3><div class="tip">${m.tips}</div>
          </div>
        </div>
      `).join('');
    }

          <div class="card-header"><span>${d.dim}</span></div>
          <div class="card-content active">
            <table class="table-mini">
              <tr><td><strong>Level 1</strong></td><td>${d.l1}</td></tr>
              <tr><td><strong>Level 2</strong></td><td>${d.l2}</td></tr>
              <tr><td><strong>Level 3</strong></td><td>${d.l3}</td></tr>
              <tr><td><strong>Level 4</strong></td><td>${d.l4}</td></tr>
              <tr><td><strong>Level 5</strong></td><td>${d.l5}</td></tr>
            </table>
          </div>
        </div>
      `).join('');
    }

    // 渲染句庫
    function renderEmotions(emotions) {
      const container = document.getElementById('sentenceContainer');
      if (!container) return;
      container.innerHTML = emotions.map(e => `
        <div class="card" onclick="this.querySelector('.card-content').classList.toggle('active'); this.querySelector('.card-header span:last-child').textContent = this.querySelector('.card-content').classList.contains('active') ? '▲' : '▼'">
          <div class="card-header">
            <span>${e.emotion}</span><span>▼</span>
          </div>
          <div class="card-content">
            ${e.levels.map(lv => `<div class="tip"><strong>${lv.l}:</strong> ${lv.text}</div>`).join('')}
          </div>
        </div>
      `).join('');
    }

    // 渲染75秘笈（帶英文例子）
    function renderSecrets(secrets) {
      const container = document.getElementById('secretsContainer');
      if (!container) return;
      container.innerHTML = secrets.map(s => `
        <div class="card" onclick="this.querySelector('.card-content').classList.toggle('active'); this.querySelector('.card-header span:last-child').textContent = this.querySelector('.card-content').classList.contains('active') ? '▲' : '▼'">
          <div class="card-header">
            <span><span class="card-number">${s.id}</span> ${s.title}</span><span>▼</span>
          </div>
          <div class="card-content">
            <p><strong>說明：</strong>${s.desc}</p>
            ${s.examples.map(ex => `
              <div style="margin: 8px 0;">
                <div class="example bad-example">
                  <div class="example-title">❌ 弱點例子：</div>
                  ${ex.bad}
                </div>
                <div class="example">
                  <div class="example-title">✅ 高分例子：</div>
                  ${ex.good}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    // 初始化
    renderTopics(allData.topics);
    renderMethods(allData.methods);
    renderDimensions(allData.dimensions);
    renderEmotions(allData.emotions);
    renderSecrets(allData.secrets);

    // 篩選
    document.querySelectorAll('.filter-btn[data-cat]').forEach(btn => {
      btn.addEventListener('click', function() {
        const cat = this.getAttribute('data-cat');
        document.querySelectorAll('.filter-btn[data-cat]').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const filtered = cat === 'all' ? allData.topics : allData.topics.filter(t => t.cat === cat);
        renderTopics(filtered);
      });
    });

    document.querySelectorAll('.filter-btn[data-sec]').forEach(btn => {
      btn.addEventListener('click', function() {
        const sec = this.getAttribute('data-sec');
        document.querySelectorAll('.filter-btn[data-sec]').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const filtered = sec === 'all' ? allData.secrets : allData.secrets.filter(s => s.cat === sec);
        renderSecrets(filtered);
      });
    });

    // 搜尋
    document.getElementById('searchTopics')?.addEventListener('keyup', function() {
      const filtered = allData.topics.filter(t => t.title.includes(this.value.toLowerCase()) || t.desc.includes(this.value.toLowerCase()));
      renderTopics(filtered);
    });

    document.getElementById('searchSecrets')?.addEventListener('keyup', function() {
      const filtered = allData.secrets.filter(s => s.title.includes(this.value.toLowerCase()) || s.desc.includes(this.value.toLowerCase()));
      renderSecrets(filtered);
    });
  </script>
</body>
</html>
