：當然，我在聽。\nTom: I feel nervous about tomorrow’s presentation.\n湯姆：我對明天的簡報感到很緊張。\nEmily: Presentations can be scary.\n艾蜜莉：簡報確實可能讓人害怕。\nTom: I’m worried I will forget my lines.\n湯姆：我擔心會忘記我要說的內容。\nEmily: Maybe you can practice with me.\n艾蜜莉：也許你可以跟我一起練習。\nTom: That would help a lot.\n湯姆：那會很有幫助。\nEmily: I’ll listen and give you feedback.\n艾蜜莉：我會聽並給你回饋。\nTom: Thank you for being a good listener.\n湯姆：謝謝你成為一個好的傾聽者。\nEmily: That’s what friends are for.\n艾蜜莉：朋友就是要互相支持。\nDialogue 13\nConstructive Communication\n（建設型溝通）\nBrian: Our homework seems very difficult.\n布萊恩：我們的作業看起來很難。\nSophia: Yes, but we can solve it step by step.\n蘇菲亞：是的，但我們可以一步一步解決。\nBrian: Maybe we should read the instructions again.\n布萊恩：也許我們應該再看一次說明。\nSophia: Good idea. Understanding the task is important.\n蘇菲亞：好主意，理解任務很重要。\nBrian: I can do the first question.\n布萊恩：我可以做第一題。\nSophia: Then I will try the second one.\n蘇菲亞：那我試試第二題。\nBrian: After that, we can check our answers.\n布萊恩：之後我們可以互相檢查答案。\nSophia: Working together makes learning easier.\n蘇菲亞：一起合作讓學習更容易。\nBrian: Yes, teamwork helps us improve.\n布萊恩：是的，合作能幫助我們進步。\nSophia: Let’s keep helping each other.\n蘇菲亞：我們繼續互相幫助吧。\nDialogue 14\nRespectful Communication\n（尊重型溝通）\nAnna: Excuse me, may I ask you a question?\n安娜：不好意思，我可以問你一個問題嗎？\nDavid: Sure, go ahead.\n大衛：當然，請說。\nAnna: I didn’t understand today’s lesson.\n安娜：我沒有理解今天的課。\nDavid: Which part was confusing?\n大衛：哪一部分讓你困惑？\nAnna: The grammar explanation.\n安娜：文法的解釋。\nDavid: I can try to explain it again.\n大衛：我可以再試著解釋一次。\nAnna: Thank you for being patient.\n安娜：謝謝你的耐心。\nDavid: No problem. Learning takes time.\n大衛：沒問題，學習需要時間。\nAnna: I appreciate your help.\n安娜：我很感謝你的幫助。\nDavid: We can all learn from each other.\n大衛：我們可以互相學習。\nDialogue 15\nRational Communication\n（理性型溝通）\nMark: I feel frustrated about our group work.\n馬克：我對我們的小組作業感到沮喪。\nSarah: What makes you feel that way?\n莎拉：是什麼讓你這樣感覺？\nMark: Some members didn’t finish their tasks.\n馬克：有些成員沒有完成任務。\nSarah: I understand your concern.\n莎拉：我理解你的擔心。\nMark: I don’t want to argue with them.\n馬克：我不想和他們爭吵。\nSarah: Maybe we can discuss the problem calmly.\n莎拉：也許我們可以冷靜地討論問題。\nMark: That sounds reasonable.\n馬克：聽起來很合理。\nSarah: We can ask everyone to share their ideas.\n莎拉：我們可以請大家分享想法。\nMark: Then we can find a better solution.\n馬克：這樣我們就能找到更好的解決方法。\nSarah: Calm communication helps solve problems.\n莎拉：冷靜的溝通能解決問題。\"", "chinese": "\"Dialogue 11\nUnderstanding Communication\n（理解型溝通）\nKevin: You seem quiet today.\n凱文：你今天看起來很安靜。\nLucy: I’m just a little tired.\n露西：我只是有點累。\nKevin: Did something happen?\n凱文：發生什麼事了嗎？\nLucy: I had a difficult test this morning.\n露西：我今天早上有一個很難的考試。\nKevin: That must be stressful.\n凱文：那一定很有壓力。\nLucy: Yes, I feel worried about my result.\n露西：是的，我很擔心成績。\nKevin: Don’t worry too much. You worked hard.\n凱文：不要太擔心，你已經很努力了。\nLucy: Thank you for understanding.\n露西：謝謝你的理解。\nKevin: Everyone has tough days.\n凱文：每個人都會有困難的日子。\nLucy: Your support means a lot to me.\n露西：你的支持對我很重要。\nDialogue 12\nListening Communication\n（傾聽型溝通）\nTom: Can I share something with you?\n湯姆：我可以和你分享一件事嗎？\nEmily: Of course, I’m listening.\n艾蜜莉：當然，我在聽。\nTom: I feel nervous about tomorrow’s presentation.\n湯姆：我對明天的簡報感到很緊張。\nEmily: Presentations can be scary.\n艾蜜莉：簡報確實可能讓人害怕。\nTom: I’m worried I will forget my lines.\n湯姆：我擔心會忘記我要說的內容。\nEmily: Maybe you can practice with me.\n艾蜜莉：也許你可以跟我一起練習。\nTom: That would help a lot.\n湯姆：那會很有幫助。\nEmily: I’ll listen and give you feedback.\n艾蜜莉：我會聽並給你回饋。\nTom: Thank you for being a good listener.\n湯姆：謝謝你成為一個好的傾聽者。\nEmily: That’s what friends are for.\n艾蜜莉：朋友就是要互相支持。\nDialogue 13\nConstructive Communication\n（建設型溝通）\nBrian: Our homework seems very difficult.\n布萊恩：我們的作業看起來很難。\nSophia: Yes, but we can solve it step by step.\n蘇菲亞：是的，但我們可以一步一步解決。\nBrian: Maybe we should read the instructions again.\n布萊恩：也許我們應該再看一次說明。\nSophia: Good idea. Understanding the task is important.\n蘇菲亞：好主意，理解任務很重要。\nBrian: I can do the first question.\n布萊恩：我可以做第一題。\nSophia: Then I will try the second one.\n蘇菲亞：那我試試第二題。\nBrian: After that, we can check our answers.\n布萊恩：之後我們可以互相檢查答案。\nSophia: Working together makes learning easier.\n蘇菲亞：一起合作讓學習更容易。\nBrian: Yes, teamwork helps us improve.\n布萊恩：是的，合作能幫助我們進步。\nSophia: Let’s keep helping each other.\n蘇菲亞：我們繼續互相幫助吧。\nDialogue 14\nRespectful Communication\n（尊重型溝通）\nAnna: Excuse me, may I ask you a question?\n安娜：不好意思，我可以問你一個問題嗎？\nDavid: Sure, go ahead.\n大衛：當然，請說。\nAnna: I didn’t understand today’s lesson.\n安娜：我沒有理解今天的課。\nDavid: Which part was confusing?\n大衛：哪一部分讓你困惑？\nAnna: The grammar explanation.\n安娜：文法的解釋。\nDavid: I can try to explain it again.\n大衛：我可以再試著解釋一次。\nAnna: Thank you for being patient.\n安娜：謝謝你的耐心。\nDavid: No problem. Learning takes time.\n大衛：沒問題，學習需要時間。\nAnna: I appreciate your help.\n安娜：我很感謝你的幫助。\nDavid: We can all learn from each other.\n大衛：我們可以互相學習。\nDialogue 15\nRational Communication\n（理性型溝通）\nMark: I feel frustrated about our group work.\n馬克：我對我們的小組作業感到沮喪。\nSarah: What makes you feel that way?\n莎拉：是什麼讓你這樣感覺？\nMark: Some members didn’t finish their tasks.\n馬克：有些成員沒有完成任務。\nSarah: I understand your concern.\n莎拉：我理解你的擔心。\nMark: I don’t want to argue with them.\n馬克：我不想和他們爭吵。\nSarah: Maybe we can discuss the problem calmly.\n莎拉：也許我們可以冷靜地討論問題。\nMark: That sounds reasonable.\n馬克：聽起來很合理。\nSarah: We can ask everyone to share their ideas.\n莎拉：我們可以請大家分享想法。\nMark: Then we can find a better solution.\n馬克：這樣我們就能找到更好的解決方法。\nSarah: Calm communication helps solve problems.\n莎拉：冷靜的溝通能解決問題。\""}, {"id": 15, "date": "2026/03/13", "title": "Dialogue 16", "category": "對話文本", "english": "\"Dialogue 16\nCooperative Communication\n（合作型溝通）\nEric: Our group needs to prepare a report.\n艾瑞克：我們小組需要準備一份報告。\nLinda: Yes, we should plan it together.\n琳達：是的，我們應該一起規劃。\nEric: What topic should we choose?\n艾瑞克：我們應該選什麼主題？\nLinda: Maybe something about environmental protection.\n琳達：也許可以做環境保護的主題。\nEric: That sounds meaningful.\n艾瑞克：聽起來很有意義。\nLinda: I can collect information online.\n琳達：我可以在網路上蒐集資料。\nEric: Then I will organize the main ideas.\n艾瑞克：那我來整理重點。\nLinda: Later we can prepare the presentation together.\n琳達：之後我們可以一起準備簡報。\nEric: Teamwork makes everything easier.\n艾瑞克：團隊合作讓事情更簡單。\nLinda: Yes, cooperation leads to success.\n琳達：是的，合作會帶來成功。\nDialogue 17\nProblem-Solving Communication\n（解決問題型溝通）\nJason: I can’t solve this math problem.\n傑森：我無法解這題數學。\nMegan: Let’s look at it together.\n梅根：我們一起看看吧。\nJason: I tried many times but failed.\n傑森：我試了很多次但還是失敗。\nMegan: That’s okay. Failure helps us learn.\n梅根：沒關係，失敗能幫助我們學習。\nJason: Do you have any ideas?\n傑森：你有什麼想法嗎？\nMegan: Maybe we should read the question carefully again.\n梅根：也許我們應該再仔細讀一次題目。\nJason: Oh, I see my mistake now.\n傑森：喔，我現在看到我的錯誤了。\nMegan: Great! Now try solving it again.\n梅根：很好！現在再試著解一次。\nJason: It works! Thank you.\n傑森：成功了！謝謝你。\nMegan: Solving problems together is always helpful.\n梅根：一起解決問題總是有幫助。\nDialogue 18\nMature Communication\n（成熟型溝通）\nChris: I think I made a mistake yesterday.\n克里斯：我覺得我昨天犯了一個錯。\nAmy: What happened?\n艾美：發生什麼事了？\nChris: I spoke too quickly during our discussion.\n克里斯：我在討論時說話太急了。\nAmy: It’s okay, everyone makes mistakes.\n艾美：沒關係，每個人都會犯錯。\nChris: I should have listened more carefully.\n克里斯：我應該更仔細地聽。\nAmy: Listening is an important part of communication.\n艾美：傾聽是溝通的重要部分。\nChris: Next time I will be more patient.\n克里斯：下次我會更有耐心。\nAmy: That’s a good attitude.\n艾美：那是很好的態度。\nChris: Thank you for understanding.\n克里斯：謝謝你的理解。\nAmy: Mature communication builds better relationships.\n艾美：成熟的溝通能建立更好的關係。\nDialogue 19\nWise Communication\n（智慧型溝通）\nPeter: I think our plan might not work.\n彼得：我覺得我們的計畫可能行不通。\nHelen: Why do you think so?\n海倫：你為什麼這麼覺得？\nPeter: It seems too complicated.\n彼得：它看起來太複雜了。\nHelen: Maybe we can simplify it.\n海倫：也許我們可以把它簡化。\nPeter: That could make it easier to follow.\n彼得：那可能會讓事情更容易執行。\nHelen: Let’s think of a simpler solution.\n海倫：我們來想一個更簡單的解決方案。\nPeter: I like your suggestion.\n彼得：我喜歡你的建議。\nHelen: Good ideas often come from discussion.\n海倫：好的想法通常來自討論。\nPeter: Talking calmly helps us think better.\n彼得：冷靜地討論能幫助我們思考。\nHelen: Wise communication leads to better decisions.\n海倫：智慧的溝通能帶來更好的決定。\nDialogue 20\nMaster Communication\n（高手型溝通）\nKevin: Our team did a great job today.\n凱文：我們的團隊今天表現得很好。\nLaura: Yes, everyone contributed.\n蘿拉：是的，每個人都有貢獻。\nKevin: I’m glad we supported each other.\n凱文：我很高興我們彼此支持。\nLaura: That created a positive atmosphere.\n蘿拉：那創造了正向的氛圍。\nKevin: Good communication builds trust.\n凱文：好的溝通能建立信任。\nLaura: And trust helps teamwork succeed.\n蘿拉：而信任能讓團隊合作成功。\nKevin: We should continue working this way.\n凱文：我們應該繼續用這種方式合作。\nLaura: Yes, respect and kindness matter.\n蘿拉：是的，尊重和善意很重要。\nKevin: Communication is a powerful skill.\n凱文：溝通是一種強大的能力。\nLaura: Mastering it can change our future.\n蘿拉：掌握它能改變我們的未來。\"", "chinese": "\"Dialogue 16\nCooperative Communication\n（合作型溝通）\nEric: Our group needs to prepare a report.\n艾瑞克：我們小組需要準備一份報告。\nLinda: Yes, we should plan it together.\n琳達：是的，我們應該一起規劃。\nEric: What topic should we choose?\n艾瑞克：我們應該選什麼主題？\nLinda: Maybe something about environmental protection.\n琳達：也許可以做環境保護的主題。\nEric: That sounds meaningful.\n艾瑞克：聽起來很有意義。\nLinda: I can collect information online.\n琳達：我可以在網路上蒐集資料。\nEric: Then I will organize the main ideas.\n艾瑞克：那我來整理重點。\nLinda: Later we can prepare the presentation together.\n琳達：之後我們可以一起準備簡報。\nEric: Teamwork makes everything easier.\n艾瑞克：團隊合作讓事情更簡單。\nLinda: Yes, cooperation leads to success.\n琳達：是的，合作會帶來成功。\nDialogue 17\nProblem-Solving Communication\n（解決問題型溝通）\nJason: I can’t solve this math problem.\n傑森：我無法解這題數學。\nMegan: Let’s look at it together.\n梅根：我們一起看看吧。\nJason: I tried many times but failed.\n傑森：我試了很多次但還是失敗。\nMegan: That’s okay. Failure helps us learn.\n梅根：沒關係，失敗能幫助我們學習。\nJason: Do you have any ideas?\n傑森：你有什麼想法嗎？\nMegan: Maybe we should read the question carefully again.\n梅根：也許我們應該再仔細讀一次題目。\nJason: Oh, I see my mistake now.\n傑森：喔，我現在看到我的錯誤了。\nMegan: Great! Now try solving it again.\n梅根：很好！現在再試著解一次。\nJason: It works! Thank you.\n傑森：成功了！謝謝你。\nMegan: Solving problems together is always helpful.\n梅根：一起解決問題總是有幫助。\nDialogue 18\nMature Communication\n（成熟型溝通）\nChris: I think I made a mistake yesterday.\n克里斯：我覺得我昨天犯了一個錯。\nAmy: What happened?\n艾美：發生什麼事了？\nChris: I spoke too quickly during our discussion.\n克里斯：我在討論時說話太急了。\nAmy: It’s okay, everyone makes mistakes.\n艾美：沒關係，每個人都會犯錯。\nChris: I should have listened more carefully.\n克里斯：我應該更仔細地聽。\nAmy: Listening is an important part of communication.\n艾美：傾聽是溝通的重要部分。\nChris: Next time I will be more patient.\n克里斯：下次我會更有耐心。\nAmy: That’s a good attitude.\n艾美：那是很好的態度。\nChris: Thank you for understanding.\n克里斯：謝謝你的理解。\nAmy: Mature communication builds better relationships.\n艾美：成熟的溝通能建立更好的關係。\nDialogue 19\nWise Communication\n（智慧型溝通）\nPeter: I think our plan might not work.\n彼得：我覺得我們的計畫可能行不通。\nHelen: Why do you think so?\n海倫：你為什麼這麼覺得？\nPeter: It seems too complicated.\n彼得：它看起來太複雜了。\nHelen: Maybe we can simplify it.\n海倫：也許我們可以把它簡化。\nPeter: That could make it easier to follow.\n彼得：那可能會讓事情更容易執行。\nHelen: Let’s think of a simpler solution.\n海倫：我們來想一個更簡單的解決方案。\nPeter: I like your suggestion.\n彼得：我喜歡你的建議。\nHelen: Good ideas often come from discussion.\n海倫：好的想法通常來自討論。\nPeter: Talking calmly helps us think better.\n彼得：冷靜地討論能幫助我們思考。\nHelen: Wise communication leads to better decisions.\n海倫：智慧的溝通能帶來更好的決定。\nDialogue 20\nMaster Communication\n（高手型溝通）\nKevin: Our team did a great job today.\n凱文：我們的團隊今天表現得很好。\nLaura: Yes, everyone contributed.\n蘿拉：是的，每個人都有貢獻。\nKevin: I’m glad we supported each other.\n凱文：我很高興我們彼此支持。\nLaura: That created a positive atmosphere.\n蘿拉：那創造了正向的氛圍。\nKevin: Good communication builds trust.\n凱文：好的溝通能建立信任。\nLaura: And trust helps teamwork succeed.\n蘿拉：而信任能讓團隊合作成功。\nKevin: We should continue working this way.\n凱文：我們應該繼續用這種方式合作。\nLaura: Yes, respect and kindness matter.\n蘿拉：是的，尊重和善意很重要。\nKevin: Communication is a powerful skill.\n凱文：溝通是一種強大的能力。\nLaura: Mastering it can change our future.\n蘿拉：掌握它能改變我們的未來。\""}, {"id": 16, "date": "2026/03/13", "title": "Dialogue 6", "category": "對話文本", "english": "[記事本] Dialogue 6\nCooperative Communication\n（合作型溝通）\nEmma: Our team needs to decide how to finish the proj", "chinese": " ifferent.\nBecause AI has changed the way we learn.\nNow, with AI,\nyou can:\nCheck your records\"", "chinese": "\"1️⃣ \"\"Why Teachers in the AI Era Don't Just Teach Textbooks\"\" (Student Version)\nMany students might think:\nIs the job of an English teacher simply to teach:\nTextbook content, vocabulary, grammar, and test-taking skills?\nJust to help everyone get high scores on English tests?\nThis idea was valid in the past.\nBecause in the past, information was not easily accessible.\nTeachers lecturing and students taking notes\nwas the most efficient way to learn.\nBut now, the world is completely different.\nBecause AI has changed the way we learn.\nNow, with AI,\nyou can:\nCheck your records\""}, {"id": 23, "date": "2026/03/16", "title": "字根\t核心義\t10個核心單字（英文＝中文）", "category": "單字素材", "english": "[記事本] 字根\t核心義\t10個核心單字（英文＝中文）\nspect\t看\tinspect檢查 / respect尊重 / aspect方面 / suspect懷疑 / spectator觀眾 / spectacle", "chinese": "[記事本] 字根\t核心義\t10個核心單字（英文＝中文）\nspect\t看\tinspect檢查 / respect尊重 / aspect方面 / suspect懷疑 / spectator觀眾 / spectacle"}, {"id": 24, "date": "2026/03/17", "title": "五種能力", "category": "教學資源", "english": "\"③ 《五種能力》60個 Pair Work 英文口說活動\nCompassion 對話\n1\nA: How can we show compassion in school?\nB: We can listen to friends and help them.\n2\nA: Why is empathy important?\nB: Because it builds trust.\n3\nA: What should we do when someone is sad?\nB: We should understand them first.\n4\nA: Can compassion reduce conflict?\nB: Yes, it helps people cooperate.\n5\nA: Have you helped someone recently?\nB: Yes, I helped my classmate study.\nWisdom 對話\n6\nA: What is wisdom?\nB: Wisdom means understanding truth.\n7\nA: How can students become wiser?\nB: By asking questions.\n8\nA: Why should we study history?\nB: To learn from past mistakes.\n9\nA: What is critical thinking?\nB: Thinking carefully before believing.\n10\nA: Why do wise people think long-term?\nB: Because decisions affect the future.\nKindness 對話\n11\nA: Why should we be kind?\nB: Because kindness connects people.\n12\nA: What is a simple act of kindness?\nB: Helping someone in need.\n13\nA: Does kindness improve society?\nB: Yes, it builds cooperation.\n14\nA: Can kindness make people happier?\nB: Yes, both sides feel happier.\n15\nA: How can schools encourage kindness?\nB: By teaching respect and gratitude.\nCreativity 對話\n16\nA: What is creativity?\nB: Creating new ideas.\n17\nA: How can we increase creativity?\nB: By staying curious.\n18\nA: Does failure help creativity?\nB: Yes, it teaches new solutions.\n19\nA: Why do artists think differently?\nB: They explore new possibilities.\n20\nA: Why is creativity important for society?\nB: Because it creates innovation.\nHumor 對話\n21\nA: Why is humor important in life?\nB: It helps reduce stress.\n22\nA: Can humor help friendships?\nB: Yes, it makes people closer.\n23\nA: What makes something funny?\nB: Unexpected ideas.\n24\nA: Can humor help during difficulties?\nB: Yes, it makes problems lighter.\n25\nA: Why do people like humorous teachers?\nB: Because learning becomes enjoyable.\"", "chinese": "\"③ 《五種能力》60個 Pair Work 英文口說活動\nCompassion 對話\n1\nA: How can we show compassion in school?\nB: We can listen to friends and help them.\n2\nA: Why is empathy important?\nB: Because it builds trust.\n3\nA: What should we do when someone is sad?\nB: We should understand them first.\n4\nA: Can compassion reduce conflict?\nB: Yes, it helps people cooperate.\n5\nA: Have you helped someone recently?\nB: Yes, I helped my classmate study.\nWisdom 對話\n6\nA: What is wisdom?\nB: Wisdom means understanding truth.\n7\nA: How can students become wiser?\nB: By asking questions.\n8\nA: Why should we study history?\nB: To learn from past mistakes.\n9\nA: What is critical thinking?\nB: Thinking carefully before believing.\n10\nA: Why do wise people think long-term?\nB: Because decisions affect the future.\nKindness 對話\n11\nA: Why should we be kind?\nB: Because kindness connects people.\n12\nA: What is a simple act of kindness?\nB: Helping someone in need.\n13\nA: Does kindness improve society?\nB: Yes, it builds cooperation.\n14\nA: Can kindness make people happier?\nB: Yes, both sides feel happier.\n15\nA: How can schools encourage kindness?\nB: By teaching respect and gratitude.\nCreativity 對話\n16\nA: What is creativity?\nB: Creating new ideas.\n17\nA: How can we increase creativity?\nB: By staying curious.\n18\nA: Does failure help creativity?\nB: Yes, it teaches new solutions.\n19\nA: Why do artists think differently?\nB: They explore new possibilities.\n20\nA: Why is creativity important for society?\nB: Because it creates innovation.\nHumor 對話\n21\nA: Why is humor important in life?\nB: It helps reduce stress.\n22\nA: Can humor help friendships?\nB: Yes, it makes people closer.\n23\nA: What makes something funny?\nB: Unexpected ideas.\n24\nA: Can humor help during difficulties?\nB: Yes, it makes problems lighter.\n25\nA: Why do people like humorous teachers?\nB: Because learning becomes enjoyable.\""}, {"id": 25, "date": "2026/03/17", "title": "反省 感恩 奉獻", "category": "教學資源", "english": "[記事本] 反省 感恩 奉獻\nDialogue 1\nReflection about Learning\nA: I feel stressed about my schoolwork these days.\nA：", "chinese": "[記事本] 反省 感恩 奉獻\nDialogue 1\nReflection about Learning\nA: I feel stressed about my schoolwork these days.\nA："}, {"id": 26, "date": "2026/03/17", "title": "Root IPA 中文 例句 Word family 同義詞 反義詞 連鎖單字 搭配詞 詞性變化 資料最大化一頁表格呈現", "category": "單字素材", "english": "Root IPA 中文 例句 Word family 同義詞 反義詞 連鎖單字 搭配詞 詞性變化 資料最大化一頁表格呈現（全部單字＝中英文＋IPA）》", "chinese": "Root IPA 中文 例句 Word family 同義詞 反義詞 連鎖單字 搭配詞 詞性變化 資料最大化一頁表格呈現（全部單字＝中英文＋IPA）》"}, {"id": 27, "date": "2026/03/17", "title": "Root IPA 中文 例句 Word family 同義詞 反義詞 連鎖單字 搭配詞 詞性變化 資料最大化一頁表格呈現（全部單字＝中英文＋IPA）》", "category": "單字素材", "english": "[記事本] Root IPA 中文 例句 Word family 同義詞 反義詞 連鎖單字 搭配詞 詞性變化 資料最大化一頁表格呈現（全部單字＝中英文＋IPA）》", "chinese": "[記事本] Root IPA 中文 例句 Word family 同義詞 反義詞 連鎖單字 搭配詞 詞性變化 資料最大化一頁表格呈現（全部單字＝中英文＋IPA）》"}, {"id": 28, "date": "2026/03/17", "title"  grades improved by 20%.\"", "chinese": "\"━━━━━━━━━━━━━━━━━━\n🔥《STAR×學測英文答題模板（高中版）》\n👉目的：讓作文「有邏輯＋有分數＋好背誦」\n📌核心結構（直接背）\n👉S：背景\n👉T：任務\n👉A：行動\n👉R：結果\n━━━━━━━━━━\n📘萬用英文模板（B3-B4）\n①S（Situation）\n👉As far as I can see, …\n👉In today’s society, …\n👉There is a problem that …\n②T（Task）\n👉My goal is to …\n👉I need to solve …\n👉The task is to …\n③A（Action）\n👉In the first place, I …\n👉In addition, I …\n👉Not only … but also …\n👉I try to … / I choose to …\n④R（Result）\n👉As a result, …\n👉Therefore, …\n👉I have learned that …\n👉To sum up, …\n━━━━━━━━━━\n🔥高分關鍵（直接用）\n👉每段＝1個STAR\n👉至少2個連接詞\n👉至少1個結果句\n👉避免空話（用例子）\n━━━━━━━━━━\n🔥範例（可直接改寫）\n👉As far as I can see, many students feel stressed about exams.\n👉My goal is to improve my study habits.\n👉In the first place, I made a daily plan. In addition, I reviewed my mistakes.\n👉As a result, my grades improved by 20%.\""}, {"id": 72, "date": "2026/04/22", "title": "🧠總核心 Core", "category": "教學資源", "english": "\"🧠總核心 Core\n👉逆向思維＝看終點\n👉Reverse thinking = Start with the end\n👉演繹思維＝看規律\n👉Deductive thinking = Follow patterns\n👉FABE＝你是產品\n👉FABE = You are the product\n👉PM系統＝做人＋做事\n👉PM system = People + Performance\n👉槓桿思維＝放大人生\n👉Leverage = Multiply your life\n👉高維利他＝長期最強利己\n👉Helping others = The highest long-term self-interest\n🔥一、逆向思維 × 學測\nReverse Thinking × Exams\n👉看終點＝先看學測要什麼\n👉Start with the goal: what the exam wants\n✔閱讀理解 Reading\n✔邏輯推論 Logic\n✔寫作表達 Writing\n👉策略 Strategies\n01👉先看範文→倒推句型\n→ Study model essays → reverse to patterns\n02👉先看題目→再讀文章\n→ Read questions first → then passage\n03👉單字放進句子\n→ Learn words in context\n04👉錯題＝弱點地圖\n→ Mistakes = weakness map\n05👉每週模考調整\n→ Weekly tests → adjust\n👉利他 Leverage Others\n👉教同學＝學最快\n→ Teaching others = fastest learning\n👉分享筆記＝理解更深\n→ Sharing notes = deeper understanding\n🔥二、演繹思維 × 學測\nDeductive Thinking × Exams\n👉看規律＝找出題邏輯\n👉Find patterns in questions\n👉閱讀規律 Reading Patterns\n01👉主旨＝開頭＋結尾\n→ Main idea = intro + ending\n02👉細節＝關鍵句\n→ Details = key lines\n03👉推論＝上下文\n→ Inference = context\n04👉單字＝語境\n→ Vocabulary = con 略（高維版）》\n🔴① 詞彙題（Vocabulary）30策略\n👉本質：語意邊界判斷（semantic boundary）\n1 看前後情緒（正/負）\n2", "chinese": "[記事本] 🔥《學測英文6大題型 × 180作答策略（高維版）》\n🔴① 詞彙題（Vocabulary）30策略\n👉本質：語意邊界判斷（semantic boundary）\n1 看前後情緒（正/負）\n2"}, {"id": 94, "date": "2026/05/06", "title": "🔥《第一堂課逐字稿（直接控班版）》", "category": "教學資源", "english": "[記事本] 🔥《第一堂課逐字稿（直接控班版）》\n同學先不用拿書，先看我。\n今天我不急著教英文。\n我先做一件更重要的事👇\n👉我會讓你變成「會學的人」。\n你們過去卡住，不是因為不努力。\n👉是沒有一套會", "chinese": "[記事本] 🔥《第一堂課逐字稿（直接控班版）》\n同學先不用拿書，先看我。\n今天我不急著教英文。\n我先做一件更重要的事👇\n👉我會讓你變成「會學的人」。\n你們過去卡住，不是因為不努力。\n👉是沒有一套會"}, {"id": 95, "date": "2026/05/06", "title": "具體策略🔥", "category": "教學資源", "english": "[記事本] 具體策略🔥\n1｜每做完題目問：\n這題真正考什麼規律？\n不是：\n這題答案是什麼。\n2｜把10題變1個規律\n例：\n英文閱讀：\n主旨題\n=\n看重複概念\n這就是：\n壓縮。\n3｜建立「母體題", "chinese": "[記事本] 具體策略🔥\n1｜每做完題目問：\n這題真正考什麼規律？\n不是：\n這題答案是什麼。\n2｜把10題變1個規律\n例：\n英文閱讀：\n主旨題\n=\n看重複概念\n這就是：\n壓縮。\n3｜建立「母體題"}, {"id": 96, "date": "2026/05/13", "title": "一句總結", "category": "教學資源", "english": "\"EV 是：\nExpected Value\n＝期望值。\n白話：\n「長期做下去，\n平均會不會越來越賺？」\n━━━━━━━━━━\n高EV（高期望值）：\n不是：\n一次賺很大。\n而是：\n長期重複後，\n整體結果持續向上。\n━━━━━━━━━━\n低維的人：\n只看：\n眼前爽不爽。\n高維的人：\n看：\n長期期望值。\n━━━━━━━━━━\n本體層\n人生其實是：\n概率遊戲。\n不是：\n單次輸贏遊戲。\n━━━━━━━━━━\n例如：\n一次運動\n沒差很多。\n但：\n每天運動10年。\nEV極高。\n━━━━━━━━━━\n一次閱讀\n看不到成果。\n但：\n每天閱讀10年。\n認知複利巨大。\n━━━━━━━━━━\n一次情緒失控\n可能沒事。\n但：\n長期高警報。\nEV極低。\n━━━━━━━━━━\n機制層\n高EV行為：\n會形成：\n正向複利。\n低EV行為：\n會形成：\n慢性熵增。\n━━━━━━━━━━\n高EV通常具備：\n①長期複利\n②可持續\n③低副作用\n④提高能力\n⑤提高自由度\n⑥提高選擇權\n⑦降低未來風險\n━━━━━━━━━━\n高EV例子：\n早睡\n閱讀\n運動\n深度學習\n建立技能\n存信用\n建立品牌\n長期關係\n穩定情緒\n建立系統\n━━━━━━━━━━\n低EV例子：\n短影音成癮\n情緒暴衝\n衝動消費\n熬夜\n賭博式人生\n高刺激快感\n無效社交\n一直換目標\n討好型人格\n━━━━━━━━━━\n數學上：\n高EV＝\n勝率×報酬\n－風險×損失\n━━━━━━━━━━\n例如：\n每天學英文1小時。\n短期：\n沒感覺。\n長期：\n語言能力、\n工作機會、\n收入、\n認知全部提升。\n所以：\nEV超高。\n━━━━━━━━━━\n真正厲害的人：\n不是每次都贏。\n而是：\n持續做高EV決策。\n━━━━━━━━━━\n《一句總結》\n低維：\n追求立即爽感。\n高維：\n追求長期期望值。\"\n2026/05/16（六）", "chinese": "\"EV 是：\nExpected Value\n＝期望值。\n白話：\n「長期做下去，\n平均會不會越來越賺？」\n━━━━━━━━━━\n高EV（高期望值）：\n不是：\n一次賺很大。\n而是：\n長期重複後，\n整體結果持續向上。\n━━━━━━━━━━\n低維的人：\n只看：\n眼前爽不爽。\n高維的人：\n看：\n長期期望值。\n━━━━━━━━━━\n本體層\n人生其實是：\n概率遊戲。\n不是：\n單次輸贏遊戲。\n━━━━━━━━━━\n例如：\n一次運動\n沒差很多。\n但：\n每天運動10年。\nEV極高。\n━━━━━━━━━━\n一次閱讀\n看不到成果。\n但：\n每天閱讀10年。\n認知複利巨大。\n━━━━━━━━━━\n一次情緒失控\n可能沒事。\n但：\n長期高警報。\nEV極低。\n━━━━━━━━━━\n機制層\n高EV行為：\n會形成：\n正向複利。\n低EV行為：\n會形成：\n慢性熵增。\n━━━━━━━━━━\n高EV通常具備：\n①長期複利\n②可持續\n③低副作用\n④提高能力\n⑤提高自由度\n⑥提高選擇權\n⑦降低未來風險\n━━━━━━━━━━\n高EV例子：\n早睡\n閱讀\n運動\n深度學習\n建立技能\n存信用\n建立品牌\n長期關係\n穩定情緒\n建立系統\n━━━━━━━━━━\n低EV例子：\n短影音成癮\n情緒暴衝\n衝動消費\n熬夜\n賭博式人生\n高刺激快感\n無效社交\n一直換目標\n討好型人格\n━━━━━━━━━━\n數學上：\n高EV＝\n勝率×報酬\n－風險×損失\n━━━━━━━━━━\n例如：\n每天學英文1小時。\n短期：\n沒感覺。\n長期：\n語言能力、\n工作機會、\n收入、\n認知全部提升。\n所以：\nEV超高。\n━━━━━━━━━━\n真正厲害的人：\n不是每次都贏。\n而是：\n持續做高EV決策。\n━━━━━━━━━━\n《一句總結》\n低維：\n追求立即爽感。\n高維：\n追求長期期望值。\"\n2026/05/16（六）"}, {"id": 97, "date": "2026/05/27", "title": "| 學習閉環節點 | 高中英文學測低維學習 | 高中英文學測高維學習              | 真正生成能力", "category": "教學資源", "english": "\"| 學習閉環節點 | 高中英文學測低維學習 | 高中英文學測高維學習              | 真正生成能力   |\n| ------ | ---------- | ----------------------- | -------- |\n| 知識輸入   | 死背單字文法     | 建立單字→語塊→句型→篇章→語境連結      | 形成英文世界模型 |\n| 結構拆解   | 逐字翻譯       | 拆解句型、語意、語氣、邏輯、篇章結構      | 形成閱讀解析力  |\n| 問題診斷   | 考差只覺得自己笨   | 辨識：單字問題？句型問題？推論問題？專注問題？ | 形成問題拆解能力 |\n| 壓力測試   | 考前狂刷題      | 限時閱讀＋模擬考場＋長文耐受訓練        | 形成考場穩定性  |\n| 誤差辨識   | 錯題只看答案     | 辨識：卡字彙？卡語法？卡推論？卡情緒？     | 形成誤差修正能力 |\n| 節點補強   | 重複背同樣內容    | 針對薄弱節點補強語感、閱讀、推論        | 形成穩定能力節點 |\n| 模型更新   | 一直用舊讀法     | 更新閱讀模型、語感模型、解題模型        | 形成動態學習能力 |\n| 能力生成   | 考完很快忘記     | 形成閱讀預測、英文直覺、生成式輸出       | 形成真正英文能力 |\n| 智慧湧現   | 英文知識碎片化    | 開始整合：單字＋文法＋語境＋推論＋情境     | 形成高維語言理解 |\n━━━━━━━━━━\n#真正英文高分\n不是背更多單字\n而是：\n建立英文預測模型\n━━━━━━━━━━\n#真正英文閱讀\n不是逐字翻譯\n而是：\n直接理解結構與語意流\n━━━━━━━━━━\n| 低維英文學習 | 高維英文學習      |\n| ------ | ----------- |\n| 背單字    | 建立語塊 chunks |\n| 逐字翻譯   | 直接理解語意      |\n| 死背文法   | 理解句型結構      |\n| 狂刷題    | 建立閱讀模型      |\n| 只求答案   | 理解推理過程      |\n| 短期記憶   | 形成語感複利      |\n| 看到長文就怕 | 建立長文耐受度     |\n| 只會選答案  | 能推論作者意圖     |\n| 學完很快忘  | 形成長期語言網路    |\n| 情緒化學習  | 系統化學習       |\n━━━━━━━━━━\n#真正高維英文能力\n不是知道文法規則\n而是：\n能快速預測語言結構\n━━━━━━━━━━\n#高中     </script>
    
    <script>
        const rawData = JSON.parse(document.getElementById('resourcesData').textContent);
        const resources = rawData.resources;
        
        let state = {
            search: '',
            category: 'all',
            expanded: new Set()
        };
        
        // 初始化分類
        function initCategories() {
            const cats = new Set(resources.map(r => r.category));
            const container = document.getElementById('categoryFilter');
            
            const allBtn = document.createElement('button');
            allBtn.className = 'category-btn active';
            allBtn.textContent = '📌 全部';
            allBtn.onclick = () => setCategory('all');
            container.appendChild(allBtn);
            
            Array.from(cats).sort().forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.textContent = cat;
                btn.onclick = () => setCategory(cat);
                container.appendChild(btn);
            });
        }
        
        function setCategory(cat) {
            state.category = cat;
            state.expanded.clear();
            document.querySelectorAll('.category-btn').forEach((btn, idx) => {
                btn.classList.remove('active');
                if ((cat === 'all' && idx === 0) || btn.textContent === cat) {
                    btn.classList.add('active');
                }
            });
            render();
        }
        
        document.getElementById('searchInput').addEventListener('input', (e) => {
            state.search = e.target.value.toLowerCase();
            state.expanded.clear();
            render();
        });
        
        function getFiltered() {
            return resources.filter(r => {
                const matchCat = state.category === 'all' || r.category === state.category;
                const matchSearch = !state.search || 
                    r.title.toLowerCase().includes(state.search) ||
                    r.english.toLowerCase().includes(state.search);
                return matchCat && matchSearch;
            });
        }
        
        function speakEnglish(text, btn) {
            if (window.currentUtterance) speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            btn.classList.add('playing');
            utterance.onend = () => btn.classList.remove('playing');
            speechSynthesis.speak(utterance);
        }
        
        function toggleCard(id) {
            if (state.expanded.has(id)) {
                state.expanded.delete(id);
            } else {
                state.expanded.add(id);
            }
            render();
        }
        
        function render() {
            const filtered = getFiltered();
            const container = document.getElementById('cardsContainer');
            
            if (!filtered.length) {
                container.innerHTML = '';
                document.getElementById('noResults').style.display = 'block';
                return;
            }
            
            document.getElementById('noResults').style.display = 'none';
            container.innerHTML = '';
            
            filtered.forEach(res => {
                const expanded = state.expanded.has(res.id);
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <div class="card-header" data-toggle="${res.id}">
                        <div>
                            <div class="card-title">${res.title}</div>
                            <div class="card-date">📅 ${res.date}</div>
                        </div>
                        <div class="toggle-icon ${expanded ? 'open' : ''}">▼</div>
                    </div>
                    <div class="card-content ${expanded ? 'active' : ''}">
                        <div class="badge">${res.category}</div>
                        <div class="bilingual">
                            <div class="lang-label">
                                🇬🇧 English
                                <button class="tts-btn" data-speak="${res.id}">🔊 Read</button>
                            </div>
                            <div class="text-box">${res.english}</div>
                        </div>
                        <div class="bilingual">
                            <div class="lang-label">🇹🇼 中文</div>
                            <div class="text-box">${res.chinese}</div>
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
                card.querySelector('.card-header').onclick = () => toggleCard(res.id);
                card.querySelector('[data-speak]').onclick = (e) => speakEnglish(res.english, e.target);
            });
        }
        
        initCategories();
        render();
    </script>
</body>
</html>
