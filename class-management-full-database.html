管理\nSpread + influence + manage\n🟨 底層（執行者）\n34️⃣ 出力＋消費＋被影響\nWork + consume + influenced\n🔥【二｜High Agency升級】\n35️⃣ 不當底層，要學結構\nDon’t stay low, learn structure\n36️⃣ 不只執行，要會設計\nNot just do, design\n37️⃣ 不只努力，要放大\nNot just work, scale\n⚙️【三｜升級路徑】\n38️⃣ 看懂規則\nUnderstand rules\n39️⃣ 利用系統\nUse systems\n40️⃣ 創造影響\nCreate influence\n🧩【四｜最終狀態】\n41️⃣ 從被影響 → 變影響者\nFrom influenced → influencer\n42️⃣ 從消費者 → 變創造者\nFrom consumer → creator\n🔥《最強總結（洗腦版）》\n43️⃣ 班級：控制節奏＝控制人\nControl pace, control class\n44️⃣ 團購：控制認知＝控制成交\nControl perception, control sales\n45️⃣ 人生：看懂結構＝提升層級\nUnderstand structure, level up\n🧩 最終一句（你整套核心）\n👉 懂人性的人，才有影響力\n👉 Those who understand people, lead people\"\n\n──────────────────────────────────────────────────", "length": 920}, {"id": 92, "date": "2026/03/22（日） 05:24", "author": "欣蓉", "title": "二、班級教學版（可帶班）", "category": "班導班務", "content": "2026/03/22（日） 05:24 - 欣蓉\n\n\"👉一句話：\n👉你不是想太多，是你講不清楚\n1️⃣ 覺得煩\n👉不是煩\n👉是不知道問題在哪\n2️⃣ 覺得累\n👉不是累\n👉是事情太亂\n3️⃣ 覺得壓力大\n👉不是壓力\n👉是沒有方法\n4️⃣ 覺得卡住\n👉不是卡\n👉是你用錯方法\n5️⃣ 覺得自己很爛\n👉不是你爛\n👉是你還沒找到方法\n👉最重要3件事：\n6️⃣ 把問題講清楚\n7️⃣ 把情緒拆開\n8️⃣ 把事情變成方法\n👉例：\n我很煩\n→功課太多＋時間不夠\n我很爛\n→這題我不會\n我不想讀\n→太難＋沒有開始\n🔥結論\n👉\n👉講清楚＝變簡單\n講不清＝一直煩\n🧑‍🏫《二、班級教學版（可帶班）》\n👉老師用語（直接帶）\n❌你很懶\n✅你現在沒有開始\n❌你很混\n✅你沒有在任務上\n❌你不認真\n✅你方法還沒對\n❌你很差\n✅這個方法沒用\n❌你態度不好\n✅你沒有對齊目標\n👉教學流程（超好用）\n1️⃣ 問：你卡在哪？\n2️⃣ 說：講清楚\n3️⃣ 拆：變小問題\n4️⃣ 給：方法\n5️⃣ 做：立即執行\n👉班級核心訓練：\n6️⃣ 不講情緒\n7️⃣ 講原因\n8️⃣ 講方法\n🔥老師一句話\n👉\n👉我不是在罵你\n我在幫你找方法\"\n\n──────────────────────────────────────────────────", "length": 547}, {"id": 93, "date": "2026/03/23（一） 03:51", "author": "欣蓉", "title": "2026/03/23（一） 03:51 - 欣蓉", "category": "學習策略", "content": "2026/03/23（一） 03:51 - 欣蓉\n\n\"🧠🔥一｜高中英文學測系統（閱讀＋單字＋文法）\n🎯目標\n👉 學測英文15級分\n👉 閱讀速度＋準確率提升\n🔄流程（每天）\n1️⃣ 單字20個（字根＋例句）\n2️⃣ 閱讀1篇（限時）\n3️⃣ 錯題分析（分類原因）\n4️⃣ 文法整理（一個重點）\n5️⃣ 輸出（講給別人或寫摘要）\n🔁迭代（每週）\n✔ 統計錯題類型（單字/推論/粗心）\n✔ 強化弱點（例如推論題）\n✔ 調整策略（先看題目再讀）\n🗣️🔥二｜英文口說＋作文系統\n🎯目標\n👉 口說流利＋作文高分\n🔄流程（每天）\n1️⃣ Shadowing 10分鐘（模仿）\n2️⃣ 句型輸出（5句）\n3️⃣ 主題口說（1題1分鐘）\n4️⃣ 作文1段（50–100字）\n5️⃣ AI或老師修正\n🔁迭代（每週）\n✔ 找常犯錯（時態/句型）\n✔ 建立句型庫（萬用句）\n✔ 重寫舊作文\"\n\n──────────────────────────────────────────────────", "length": 435}, {"id": 94, "date": "2026/03/23（一） 10:40", "author": "欣蓉", "title": "AI時代 × 被駕馭 → 駕馭者（40句）", "category": "行為指南", "content": "2026/03/23（一） 10:40 - 欣蓉\n\n\"《AI時代 × 被駕馭 → 駕馭者（40句）》\n👉 結構：❌舊語法 → ✔新語法（身份升級）\n🟦 一｜工具人思維 → 升級（班導20句）\n1️⃣ 我完成任務 → 我負責結果 I finish tasks → I own outcomes\n2️⃣ 我等指令 → 我定方向 I wait orders → I set direction\n3️⃣ 我照流程 → 我理解全局 I follow steps → I see the big picture\n4️⃣ 我只做事 → 我判斷對錯 I just do → I judge right/wrong\n5️⃣ 我怕出錯 → 我敢承擔 I fear mistakes → I take responsibility\n6️⃣ 我被需要就好 → 我創造價值 I want to be needed → I create value\n7️⃣ 我只求穩定 → 我追求主導 I want stability → I seek control\n8️⃣ 我只會做 → 我會思考 I can do → I can think\n9️⃣ 我依賴安排 → 我設計路徑 I rely on plans → I design paths\n🔟 我避免風險 → 我管理風險 I avoid risks → I manage risks\n11️⃣ 我是工具 → 我是決策者 I’m a tool → I’m a decision-maker\n12️⃣ 我做局部 → 我看整體 I see parts → I see systems\n13️⃣ 我執行 → 我負責 I execute → I take ownership\n14️⃣ 我怕被取代 → 我升級自己 I fear replacement → I upgrade myself\n15️⃣ 我只會努力 → 我懂結構 I work hard → I understand structure\n16️⃣ 我跟著做 → 我帶著做 I follow → I lead\n17️⃣ 我只會用工具 → 我駕馭工具 I use tools → I command tools\n18️⃣ 我完成今天 → 我布局未來 I finish today → I plan future\n19️⃣ 我怕失去工作 → 我創造位置 I fear job loss → I create roles\n20️⃣ 我被使用 → 我主導使用 I’m used → I lead usage\n🟨 二｜AI使用者 → 升級（英文老師20句）\n1️⃣ 我用AI加快 → 我用AI放大 I use AI faster → I scale with AI\n2️⃣ 我問問題 → 我設計問題 I ask → I design questions\n3️⃣ 我拿答案 → 我定標準 I take answers → I set standards\n4️⃣ 我用AI做事 → 我用AI做決策 I use AI to do → I use AI to decide\n5️⃣ 我讓AI幫我 → 我指揮AI運作 AI helps me → I direct AI\n6️⃣ 我跟AI互動 → 我建立系統 I interact → I build systems\n7️⃣ 我用提示詞 → 我設計架構 I use prompts → I design frameworks\n8️⃣ 我只求快 → 我求準＋價值 I want speed → I want value\n9️⃣ 我怕被AI取代 → 我用AI取代別人 I fear AI → I leverage AI\n🔟 我只會用 → 我會整合 I use → I integrate\n11️⃣ 我解題 → 我定義問題 I solve → I define problems\n12️⃣ 我做內容 → 我做影響 I create content → I create impact\n13️⃣ 我用工具 → 我建工具 I use tools → I build tools\n14️⃣ 我學功能 → 我學邏輯 I learn features → I learn logic\n15️⃣ 我單點操作 → 我系統操作 I act locally → I act systemically\n16️⃣ 我靠技能 → 我靠結構 I rely on skills → I rely on systems\n17️⃣ 我接任務 → 我創機會 I take tasks → I create opportunities\n18️⃣ 我被市場選 → 我選市場 I’m chosen → I choose\n19️⃣ 我跟AI競爭 → 我與AI合作 I compete → I collaborate\n20️⃣ 我用AI → 我駕馭AI I use AI → I command AI\n🧠《一行洗腦總結》\n1️⃣ 被需要 ≠ 有價值 Being needed ≠ being valuable\n2️⃣ 流程會被取代 Process gets replaced\n3️⃣ 結構不會被取代 Structure stays\n4️⃣ 駕馭者永遠在上層 The driver stays on top\n🎯《帶班用提問（直接問）》\n👉 你是在用AI，還是被AI放大原本的位置？\nAre you using AI, or staying in the same role?\n👉 你是工具人，還是駕馭工具的人？\nAre you a tool, or the one who controls tools?\"\n\n──────────────────────────────────────────────────", "length": 2426}, {"id": 95, "date": "2026/03/24（二） 08:43", "author": "欣蓉", "title": "High Agency × 靈商SQ × 中英文課程重要性", "category": "英文應用", "content": "2026/03/24（二） 08:43 - 欣蓉\n\n\"《High Agency × 靈商SQ × 中英文課程重要性》\nHigh Agency＋SQ＝未來不可被取代的人\nHigh Agency + SQ = irreplaceable human\n👉不是教英文\n👉是打造「會活的人」\nNot teaching English, but building a human\n🔥《為什麼這門課重要（AI時代）》\nAI會取代：\n記憶／翻譯／寫作\nAI replaces memory, translation, writing\n但不會取代：\n覺察／同理／意義／選擇\nNot awareness, compassion, purpose, choice\n👉這門課在教「不能被AI取代的能力」\nThis course teaches irreplaceable skills\n🧠《High Agency 是什麼》\n👉High Agency＝主動掌控人生能力\nTake control of life\n✔ 不等環境\nDon’t wait\n✔ 不怪別人\nDon’t blame\n✔ 主動創造\nCreate actively\n👉語言＋思維＋行動整合\nLanguage + thinking + action\n🔥《這門課的真正功能》\n不是學英文\nNot learning English\n是：\n✔ 用英文重構思維\nRebuild thinking in English\n✔ 用語氣改變人生\nChange life by tone\n✔ 用句型建立行動力\nBuild action through language\n🧠《SQ五大能力如何融入課程》\n1️⃣ 覺察 Awareness\n學生學到：\n我不是不會\n→我還沒學會\nNot yet\n👉語言＝覺察工具\nLanguage = awareness tool\n2️⃣ 同理 Compassion\n透過對話練習\nThrough dialogue\n👉學會理解他人\nUnderstand others\n👉提升人際能力\nBetter relationships\n3️⃣ 直覺 Intuition\n不翻中文\nThink directly\n👉直接用英文思考\nThink in English\n👉提升直覺反應\nFaster response\n4️⃣ 意義 Purpose\n不只是考試\nNot just exams\n👉讓學生知道為什麼學\nKnow why\n👉建立人生方向\nBuild direction\n5️⃣ 連結 Connection\n👉語言＝連結工具\nLanguage = connection\n✔ 連結自己\nConnect self\n✔ 連結他人\nConnect others\n✔ 連結世界\nConnect world\n🔥《為什麼用「英文」做這件事》\n👉因為英文＝新語言系統\nEnglish = new system\n👉可以重寫舊思維\nRewrite old thinking\n👉建立新身份\nBuild new identity\n🧠《課程三大轉變（最重要）》\n❌ 傳統英文\n背單字\nMemorize\n考試\nTest\n被動\nPassive\n✔ High Agency 英文\n說句子\nSpeak\n做選擇\nChoose\n主動\nActive\n🔥《學生會變成什麼樣》\n不再說：\n我不會\nI can’t\n變成：\n我還沒學會\nNot yet\n不再說：\n我很爛\nI’m bad\n變成：\n我在進步\nI’m improving\n不再說：\n我沒辦法\nNo way\n變成：\n我可以試\nI can try\n👉這就是「命運改寫」\nThis is life rewrite\n🧠《課程底層模型》\n語言 → 思考 → 情緒 → 行動 → 人生\nLanguage → thought → emotion → action → life\n👉改語言＝改人生\nChange language = change life\n🔥《老師（你）的價值》\n你不是在教英文\nYou are not teaching English\n你在做：\n✔ 重建學生思維\nRebuild thinking\n✔ 提升自我效能\nBuild self-efficacy\n✔ 建立High Agency人格\nBuild agency\"\n\n──────────────────────────────────────────────────", "length": 1837}, {"id": 96, "date": "2026/03/24（二） 09:29", "author": "欣蓉", "title": "2026/03/24（二） 09:29 - 欣蓉", "category": "學習策略", "content": "2026/03/24（二） 09:29 - 欣蓉\n\n\"17️⃣ 這個班，不玩比較\n18️⃣ 這個班，不玩嘲笑\n19️⃣ 這個班，只看進步\n20️⃣ 這個班，允許犯錯\n21️⃣ 這個班，重視行動\n22️⃣ 這個班，尊重努力\n23️⃣ 這個班，說真話\n24️⃣ 這個班，不內耗\n25️⃣ 這個班，會變強\n——————————\n🔥最後給你一個「導師最強一句話」\n👉你們不是來當乖學生\n👉是來練「掌控人生能力的人」\"\n\n──────────────────────────────────────────────────", "length": 256}, {"id": 97, "date": "2026/03/24（二） 11:37", "author": "欣蓉", "title": "5遍學習法｜第一遍：快速通讀", "category": "學習方法", "content": "2026/03/24（二） 11:37 - 欣蓉\n\n\"🔥《5遍學習法｜第一遍：快速通讀》\n🎯一、核心目的\n快速通讀知識框架\n👉 不抓細節\n👉 搞懂「是什麼」\n🧠二、快速通讀3步驟\n① 先看目錄\n👉 抓整體結構脈絡\n👉 知道在講什麼範圍\n② 看開頭段\n👉 抓核心概念\n👉 作者想說什麼\n③ 跳讀＋掃讀\n👉 跳過細枝末節\n👉 不陷入細節\n🧩三、對應理解層\n① 整體邏輯脈絡\n② 核心結論\n③ 忽略細節枝葉\n🛠️四、技巧（重點）\n① 紙＋筆\n👉 邊讀邊畫「思維導圖（簡易版）」\n② AI輔助\n👉 AI拆解知識\n👉 幫助理解\n🔥《5遍學習法｜完整結構》\n① 快速通讀（10%）\n👉 問：是什麼\n② 放慢重讀（30%）\n👉 問：為什麼\n③ 找邏輯（50%）\n👉 問：為什麼成立\n④ 形成網（70%）\n👉 建構知識連結\n👉 舉一反三\n👉 問：能不能聯想其他\n⑤ 應用輸出（精通）\n👉 用出來才算會\n👉 問：怎麼用\n🧠五、白話總結（超重要）\n👉 第1遍＝看地圖（不要走路）\n👉 第2遍＝慢慢看細節\n👉 第3遍＝搞懂因果\n👉 第4遍＝串成系統\n👉 第5遍＝拿去用\n🔥六、超壓縮一句話版本（給學生）\n讀書不是讀一次\n👉 是「看→懂→通→連→用」\"\n\n──────────────────────────────────────────────────", "length": 566}, {"id": 98, "date": "2026/03/24（二） 11:44", "author": "欣蓉", "title": "2026/03/24（二） 11:44 - 欣蓉", "category": "學習策略", "content": "2026/03/24（二） 11:44 - 欣蓉\n\n\"語言重構自動洗腦版（學生用）》\n（中英逐行｜超短句｜可直接貼LINE）\n① 我不會 → 我還沒會\nI can’t → Not yet\n② 我很爛 → 我在進步\nI suck → I’m improving\n③ 我做不到 → 我還沒做到\nI can’t do it → Not yet\n④ 我很笨 → 我在學\nI’m stupid → I’m learning\n⑤ 我考不好 → 我策略錯\nI failed → Strategy wrong\n⑥ 我忘了 → 還不熟\nI forgot → Not familiar\n⑦ 我沒時間 → 我沒安排\nNo time → Not scheduled\n⑧ 我很累 → 我調整\nTired → Adjust\n⑨ 我壓力大 → 我在成長\nStress → Growth\n🔟 我害怕 → 我在練勇氣\nAfraid → Training courage\n11️⃣ 我不敢說 → 我在練\nDon’t dare → Practicing\n12️⃣ 我不想做 → 我先做5分\nDon’t want → 5 mins first\n13️⃣ 太難 → 拆小\nToo hard → Break down\n14️⃣ 卡住 → 換方法\nStuck → Try another\n15️⃣ 不會背 → 方法錯\nCan’t memorize → Wrong method\n16️⃣ 沒動力 → 先行動\nNo motivation → Act first\n17️⃣ 很亂 → 先整理\nMessy → Organize\n18️⃣ 失敗 → 回饋\nFail → Feedback\n19️⃣ 被拒 → 篩選\nRejected → Filtering\n20️⃣ 很慢 → 累積\nSlow → Accumulating\n21️⃣ 很弱 → 變強中\nWeak → Getting stronger\n22️⃣ 做不好 → 再優化\nBad → Improve\n23️⃣ 倒楣 → 在學習\nUnlucky → Learning\n24️⃣ 完蛋 → 重來\nDoomed → Restart\n25️⃣ 沒天分 → 多練\nNo talent → Practice\n26️⃣ 拖延 → 先開始\nProcrastinate → Start\n27️⃣ 很痛苦 → 在轉化\nPain → Transform\n28️⃣ 想放棄 → 再撐一下\nGive up → Hold\n29️⃣ 沒希望 → 找機會\nNo hope → Find chance\n30️⃣ 沒未來 → 我在創造\nNo future → Creating\"\n\n──────────────────────────────────────────────────", "length": 1174}, {"id": 99, "date": "2026/03/24（二） 01:40", "author": "欣蓉", "title": "班導可用20條", "category": "學習策略", "content": "2026/03/24（二） 01:40 - 欣蓉\n\n\"《班導可用20條》\nClass advisor version: 20 usable lines\n1️⃣ 不要只看學生表面行為\nDo not only look at students’ surface behavior\n要看他背後的需求與狀態\nLook at the needs and states behind it\n2️⃣ 問題學生常不是故意找麻煩\nA “problem student” is often not trying to cause trouble\n而是內在卡住了\nThey are often stuck inside\n3️⃣ 一直違規的學生\nA student who keeps breaking rules\n可能是在求關注、求理解、求界限\nMay be seeking attention, understanding, or boundaries\n4️⃣ 學生若只剩追分數\nIf a student only chases grades\n很容易停在欲望層\nThey easily stay at the desire level\n5️⃣ 班導要做的不只是管秩序\nA homeroom teacher does more than manage order\n還要帶學生往精神層走\nThey also guide students toward the mental level\n6️⃣ 精神層的班級\nA class at the mental level\n重視真誠、尊重、信任、連結\nValues sincerity, respect, trust, and connection\n7️⃣ 靈性層不是神秘\nThe spiritual level is not mysterious\n而是學生越來越穩、越來越清楚自己\nIt means students become steadier and clearer about themselves\n8️⃣ 有主體性的學生\nA student with subjectivity\n不容易被同儕帶著跑\nIs not easily dragged by peers\n9️⃣ 班導要教學生\nA homeroom teacher should teach students\n不是討好全世界\nNot to please everyone\n而是站穩自己\nBut to stand firm in themselves\n🔟 真正成熟的學生\nA truly mature student\n能尊重強者，也尊重弱者\nRespects both the strong and the weak\n11️⃣ 不看人下菜碟\nNot changing attitude based on status\n就是平等感的開始\nIs the beginning of equality\n12️⃣ 班級衝突很多時候\nMany class conflicts\n不是事情太大\nAre not because the issue is huge\n而是心太亂\nBut because the mind is unsettled\n13️⃣ 無為不是不管\nWu wei is not doing nothing\n而是不亂反應\nIt means not reacting blindly\n14️⃣ 班導處理事情\nWhen a homeroom teacher handles problems\n先穩住自己，再穩住學生\nStabilize yourself first, then stabilize the students\n15️⃣ 學生的小我很常見\nStudents’ ego is common\n愛比較、愛面子、愛計較\nThey compare, save face, and keep score\n16️⃣ 班導不能只壓小我\nA homeroom teacher should not only suppress the ego\n要教學生看見小我\nBut help students notice it\n17️⃣ 創造性思維的學生\nA student with creative thinking\n不會只會照抄照做\nWill not only copy and follow\n18️⃣ 班導要鼓勵學生\nA homeroom teacher should encourage students\n從標準答案走向獨立思考\nTo move from model answers to independent thinking\n19️⃣ 不亂貼標籤\nDo not label carelessly\n是班級關係變好的關鍵\nThis is key to better class relationships\n20️⃣ 最好的班級經營\nThe best class management\n不是把學生壓安靜\nIs not suppressing students into silence\n而是讓學生穩定、尊重、自主、有界限\nIt is helping students become stable, respectful, self-directed, and boundaried\n—\n【班導可直接對學生說的20句】\n20 lines a homeroom teacher can directly say\n你現在不是壞，只是亂。\nYou are not bad right now, just unsettled.\n先穩住，再處理。\nStabilize first, then solve.\n情緒可以有，傷人不可以。\nEmotions are allowed; hurting others is not.\n不要急著證明自己，先做好自己。\nDo not rush to prove yourself; first become your best self.\n別人怎麼看你，不等於你是誰。\nHow others see you is not who you are.\n先把心站穩，路才走得穩。\nStand firm inside, and your path will become steady.\n成熟不是贏別人，是管住自己。\nMaturity is not beating others; it is managing yourself.\n看見情緒，不等於跟著情緒跑。\nSeeing emotion does not mean following it.\n不比較，你才會長得快。\nWhen you stop comparing, you grow faster.\n有界限，才有真正的自由。\nReal freedom needs boundaries.\n安靜不是壓抑，是清楚。\nCalmness is not suppression; it is clarity.\n你不是標籤，你比標籤大。\nYou are not a label; you are bigger than any label.\n別急著反應，先想清楚。\nDo not react too fast; think first.\n先尊重人，再談對錯。\nRespect people first, then discuss right and wrong.\n你不是來討好別人的。\nYou are not here to please everyone.\n你要學的是做自己，不是演自己。\nYou need to learn to be yourself, not perform yourself.\n情緒是訊號，不是命令。\nEmotion is a signal, not a command.\n不要讓小我決定你今天。\nDo not let the ego decide your day.\n你可以敏感，但不要被拉走。\nYou can be sensitive, but do not be dragged away.\n穩定，就是一種力量。\nStability is a kind of strength.\n—\n====================\n🔥《英文老師可用20條》\nEnglish teacher version: 20 usable lines\n1️⃣ 英文學不好\nPoor English performance\n很多時候不是智力問題\nIs often not an intelligence problem\n而是情緒、信心、比較心太重\nBut too much emotion, low confidence, and comparison\n2️⃣ 欲望層學生\nStudents at the desire level\n只想快點拿分\nOnly want quick scores\n3️⃣ 精神層學生\nStudents at the mental level\n會開始重視理解、表達、溝通\nBegin to value understanding, expression, and communication\n4️⃣ 靈性層學生\nStudents at the spiritual level\n會把英文當成認識世界與表達自我的工具\nSee English as a tool to know the world and express themselves\n5️⃣ 英文老師不能只教答案\nAn English teacher should not only teach answers\n還要教學生建立內在穩定\nBut also help students build inner stability\n6️⃣ 主體性覺醒放在英文課\nSubjectivity in English class\n就是敢開口、敢表達、敢犯錯\nMeans daring to speak, express, and make mistakes\n7️⃣ 很多學生怕講英文\nMany students are afraid to speak English\n其實不是不會\nIt is often not because they cannot\n而是太怕丟臉\nBut because they fear embarrassment\n8️⃣ 英文老師要幫學生\nAn English teacher should help students\n從討好答案轉向真實表達\nMove from pleasing the answer to real expression\n9️⃣ 平等感放在英文課\nEquality in English class\n就是口說不嘲笑\nMeans no mocking during speaking practice\n作文不羞辱\nNo humiliation in writing correction\n回答不貼標籤\nNo labeling based on responses\n🔟 心不妄動放在學習上\nA steady mind in learning\n就是不因一次考差就全盤否定自己\nMeans not denying yourself because of one bad test\n11️⃣ 英文學習最怕小我\nThe biggest enemy in English learning is the ego\n怕錯、怕輸、怕慢、怕比較\nFear of mistakes, losing, being slow, and comparison\n12️⃣ 英文老師要教學生\nAn English teacher should teach students\n錯誤不是羞恥\nMistakes are not shameful\n錯誤是資料\nMistakes are data\n13️⃣ 創造性思維放在英文課\nCreative thinking in English class\n就是能改寫句子、延伸例句、活用語言\nMeans rewriting, extending, and using language flexibly\n14️⃣ 敏感但不執著\nSensitive but not attached\n就是知道自己哪裡弱\nMeans knowing your weak points\n但不被弱點定義\nWithout being defined by them\n15️⃣ 不貼標籤很重要\nNo labeling is important\n不要說自己英文爛\nDo not say your English is terrible\n要說自己還在學\nSay you are still learning\n16️⃣ 英文老師帶班\nAn English teacher managing class\n要讓學生感到安全\nShould make students feel safe\n才敢開口\nSo they dare to speak\n17️⃣ 安全感先於表現\nSafety comes before performance\n被笑的人不會想學\nA laughed-at student will not want to learn\n18️⃣ 真正強的英文課\nA truly strong English class\n不是老師一直講\nIs not nonstop teacher talk\n而是學生一直在用\nBut students keep using the language\n19️⃣ 英文老師要從知識傳遞者\nAn English teacher should move from knowledge deliverer\n升級成表達教練\nTo expression coach\n20️⃣ 最好的英文學習狀態\nThe best English learning state\n不是完美\nIs not perfection\n而是穩定、敢說、肯修正、持續進步\nBut stability, courage to speak, willingness to revise, and steady progress\n—\n【英文老師可直接對學生說的20句】\n20 lines an English teacher can directly say\n英文不是拿來證明你厲不厲害，是拿來表達。\nEnglish is not for proving how good you are; it is for expression.\n說錯沒關係，不說才可惜。\nMistakes are fine; silence is the real loss.\n你現在不是不會，是還不熟。\nYou do not “cannot”; you are just not familiar yet.\n一次考差，不代表你差。\nOne bad test does not mean you are bad.\n英文進步靠開口，不靠想像。\nEnglish improves through speaking, not imagining.\n不要怕慢，怕停就好。\nDo not fear slowness; fear stopping.\n每個錯誤都在幫你修正路線。\nEvery mistake helps correct your route.\n先敢講，再講好。\nSpeak first, improve later.\n英文不是背給老師看，是學給自己用。\nEnglish is not for performing to the teacher; it is for your own use.\n不比較，你才敢進步。\nWhen you stop comparing, you dare to improve.\n你不是英文差，你是在建英文系統。\nYou are not bad at English; you are building your English system.\n每天進步一點，比一天完美更重要。\nA little progress every day matters more than one perfect day.\n英文口說先求真，再求美。\nIn speaking, aim for truth before beauty.\n不要讓怕丟臉，偷走你的進步。\nDo not let fear of embarrassment steal your progress.\n會修正的人，比一次答對的人更強。\nA student who can revise is stronger than one who only gets it right once.\n英文作文不是一次寫好，是一版一版變好。\nEnglish writing is not written perfectly once; it improves draft by draft.\n先理解，再記憶。\nUnderstand first, then memorize.\n你可以敏感，但不要因一個錯就放棄。\nYou can be sensitive, but do not give up over one mistake.\n英文課最重要的不是面子，是使用。\nThe most important thing in English class is not face, but use.\n穩穩學，慢慢強。\nLearn steadily, grow strongly.\"\n\n──────────────────────────────────────────────────", "length": 7355}, {"id": 100, "date": "2026/03/24（二） 01:57", "author": "欣蓉", "title": "英文老師可用20條", "category": "學習策略", "content": "2026/03/24（二） 01:57 - 欣蓉\n\n\"《英文老師可用20條》\nEnglish teacher version: 20 usable lines\n1️⃣ 英文學不好\nPoor English performance\n很多時候不是智力問題\nIs often not an intelligence problem\n而是情緒、信心、比較心太重\nBut too much emotion, low confidence, and comparison\n2️⃣ 欲望層學生\nStudents at the desire level\n只想快點拿分\nOnly want quick scores\n3️⃣ 精神層學生\nStudents at the mental level\n會開始重視理解、表達、溝通\nBegin to value understanding, expression, and communication\n4️⃣ 靈性層學生\nStudents at the spiritual level\n會把英文當成認識世界與表達自我的工具\nSee English as a tool to know the world and express themselves\n5️⃣ 英文老師不能只教答案\nAn English teacher should not only teach answers\n還要教學生建立內在穩定\nBut also help students build inner stability\n6️⃣ 主體性覺醒放在英文課\nSubjectivity in English class\n就是敢開口、敢表達、敢犯錯\nMeans daring to speak, express, and make mistakes\n7️⃣ 很多學生怕講英文\nMany students are afraid to speak English\n其實不是不會\nIt is often not because they cannot\n而是太怕丟臉\nBut because they fear embarrassment\n8️⃣ 英文老師要幫學生\nAn English teacher should help students\n從討好答案轉向真實表達\nMove from pleasing the answer to real expression\n9️⃣ 平等感放在英文課\nEquality in English class\n就是口說不嘲笑\nMeans no mocking during speaking practice\n作文不羞辱\nNo humiliation in writing correction\n回答不貼標籤\nNo labeling based on responses\n🔟 心不妄動放在學習上\nA steady mind in learning\n就是不因一次考差就全盤否定自己\nMeans not denying yourself because of one bad test\n11️⃣ 英文學習最怕小我\nThe biggest enemy in English learning is the ego\n怕錯、怕輸、怕慢、怕比較\nFear of mistakes, losing, being slow, and comparison\n12️⃣ 英文老師要教學生\nAn English teacher should teach students\n錯誤不是羞恥\nMistakes are not shameful\n錯誤是資料\nMistakes are data\n13️⃣ 創造性思維放在英文課\nCreative thinking in English class\n就是能改寫句子、延伸例句、活用語言\nMeans rewriting, extending, and using language flexibly\n14️⃣ 敏感但不執著\nSensitive but not attached\n就是知道自己哪裡弱\nMeans knowing your weak points\n但不被弱點定義\nWithout being defined by them\n15️⃣ 不貼標籤很重要\nNo labeling is important\n不要說自己英文爛\nDo not say your English is terrible\n要說自己還在學\nSay you are still learning\n16️⃣ 英文老師帶班\nAn English teacher managing class\n要讓學生感到安全\nShould make students feel safe\n才敢開口\nSo they dare to speak\n17️⃣ 安全感先於表現\nSafety comes before performance\n被笑的人不會想學\nA laughed-at student will not want to learn\n18️⃣ 真正強的英文課\nA truly strong English class\n不是老師一直講\nIs not nonstop teacher talk\n而是學生一直在用\nBut students keep using the language\n19️⃣ 英文老師要從知識傳遞者\nAn English teacher should move from knowledge deliverer\n升級成表達教練\nTo expression coach\n20️⃣ 最好的英文學習狀態\nThe best English learning state\n不是完美\nIs not perfection\n而是穩定、敢說、肯修正、持續進步\nBut stability, courage to speak, willingness to revise, and steady progress\n—\n【英文老師可直接對學生說的20句】\n20 lines an English teacher can directly say\n英文不是拿來證明你厲不厲害，是拿來表達。\nEnglish is not for proving how good you are; it is for expression.\n說錯沒關係，不說才可惜。\nMistakes are fine; silence is the real loss.\n你現在不是不會，是還不熟。\nYou do not “cannot”; you are just not familiar yet.\n一次考差，不代表你差。\nOne bad test does not mean you are bad.\n英文進步靠開口，不靠想像。\nEnglish improves through speaking, not imagining.\n不要怕慢，怕停就好。\nDo not fear slowness; fear stopping.\n每個錯誤都在幫你修正路線。\nEvery mistake helps correct your route.\n先敢講，再講好。\nSpeak first, improve later.\n英文不是背給老師看，是學給自己用。\nEnglish is not for performing to the teacher; it is for your own use.\n不比較，你才敢進步。\nWhen you stop comparing, you dare to improve.\n你不是英文差，你是在建英文系統。\nYou are not bad at English; you are building your English system.\n每天進步一點，比一天完美更重要。\nA little progress every day matters more than one perfect day.\n英文口說先求真，再求美。\nIn speaking, aim for truth before beauty.\n不要讓怕丟臉，偷走你的進步。\nDo not let fear of embarrassment steal your progress.\n會修正的人，比一次答對的人更強。\nA student who can revise is stronger than one who only gets it right once.\n英文作文不是一次寫好，是一版一版變好。\nEnglish writing is not written perfectly once; it improves draft by draft.\n先理解，再記憶。\nUnderstand first, then memorize.\n你可以敏感，但不要因一個錯就放棄。\nYou can be sensitive, but do not give up over one mistake.\n英文課最重要的不是面子，是使用。\nThe most important thing in English class is not face, but use.\n穩穩學，慢慢強。\nLearn steadily, grow strongly.\n—\n【四｜超好背總結版】\n欲望層：一直追\nDesire level: always chasing\n精神層：開始懂\nMental level: begin to understand\n靈性層：真正穩\nSpiritual level: truly stable\n—\n高維智慧不是神祕\nHigher wisdom is not mystical\n是：\nIt is:\n有主體\nhaving selfhood\n有平等\nhaving equality\n有定力\nhaving steadiness\n有覺察\nhaving awareness\n有創造\nhaving creativity\n不執著\nnot clinging\n不亂貼標籤\nnot labeling carelessly\n—\n【五｜班級／英文課共用金句10句】\n1️⃣ 穩定，比厲害更重要。\nStability matters more than impressiveness.\n2️⃣ 情緒是訊號，不是命令。\nEmotion is a signal, not a command.\n3️⃣ 你不是標籤，你比標籤大。\nYou are not a label; you are bigger than any label.\n4️⃣ 不比較，才長得快。\nStop comparing, and you will grow faster.\n5️⃣ 有界限，才有自由。\nFreedom needs boundaries.\ king space\"\n\n──────────────────────────────────────────────────", "length": 463}, {"id": 104, "date": "2026/03/24（二） 05:15", "author": "欣蓉", "title": "2026/03/24（二） 05:15 - 欣蓉", "category": "學習策略", "content": "2026/03/24（二） 05:15 - 欣蓉\n\n\"英文老師可直接對學生說的20句】\n20 lines an English teacher can directly say\n英文不是拿來證明你厲不厲害，是拿來表達。\nEnglish is not for proving how good you are; it is for expression.\n說錯沒關係，不說才可惜。\nMistakes are fine; silence is the real loss.\n你現在不是不會，是還不熟。\nYou do not “cannot”; you are just not familiar yet.\n一次考差，不代表你差。\nOne bad test does not mean you are bad.\n英文進步靠開口，不靠想像。\nEnglish improves through speaking, not imagining.\n不要怕慢，怕停就好。\nDo not fear slowness; fear stopping.\n每個錯誤都在幫你修正路線。\nEvery mistake helps correct your route.\n先敢講，再講好。\nSpeak first, improve later.\n英文不是背給老師看，是學給自己用。\nEnglish is not for performing to the teacher; it is for your own use.\n不比較，你才敢進步。\nWhen you stop comparing, you dare to improve.\n你不是英文差，你是在建英文系統。\nYou are not bad at English; you are building your English system.\n每天進步一點，比一天完美更重要。\nA little progress every day matters more than one perfect day.\n英文口說先求真，再求美。\nIn speaking, aim for truth before beauty.\n不要讓怕丟臉，偷走你的進步。\nDo not let fear of embarrassment steal your progress.\n會修正的人，比一次答對的人更強。\nA student who can revise is stronger than one who only gets it right once.\n英文作文不是一次寫好，是一版一版變好。\nEnglish writing is not written perfectly once; it improves draft by draft.\n先理解，再記憶。\nUnderstand first, then memorize.\n你可以敏感，但不要因一個錯就放棄。\nYou can be sensitive, but do not give up over one mistake.\n英文課最重要的不是面子，是使用。\nThe most important thing in English class is not face, but use.\n穩穩學，慢慢強。\nLearn steadily, grow strongly.\n—\"\n\n──────────────────────────────────────────────────", "length": 1469}, {"id": 105, "date": "2026/03/25（三） 08:04", "author": "欣蓉", "title": "職場核心能力 × 高中生學習版（中英逐行）", "category": "心理人格", "content": "2026/03/25（三） 08:04 - 欣蓉\n\n\"好，直接幫你升級成👇\n✅「A4可貼教室版＋高中生轉換版＋中英逐行」\n✅「LINE超緊湊＋最好背＋可直接帶班用」\n🔥《職場核心能力 × 高中生學習版（中英逐行）》\n🔥《核心一句（先背） work\n👉 不回報\n👉 No communication\n👉 不思考\n👉 No thinking\n👉 不合作\n👉 No teamwork\n👉 結果\n👉 Result\n👉 很努力但沒成長\n👉 Hardworking but no progress\n🔥《最強總結（直接貼牆）》》\n👉 初階：會做事\n👉 Beginner: execute\n👉 中階：會回報\n👉 Intermediate: report\n👉 高階：會分析\n👉 Advanced: think\n👉 頂階：會合作\n👉 Master: collaborate\n👉 學習不是比誰用功\n👉 Learning is not about effort\n👉 是比誰「讓結果更好」\n👉 It’s about who gets better results\"\n\n──────────────────────────────────────────────────", "length": 2390}, {"id": 106, "date": "2026/03/25（三） 08:11", "author": "欣蓉", "title": "A4一頁視覺化心智圖｜職場核心能力 × 高中生版", "category": "心理人格", "content": "2026/03/25（三） 08:11 - 欣蓉\n\n\"《A4一頁視覺化心智圖｜職場核心能力 × 高中生版》\n（👉可直接貼教室）\n🔥【核心中心】\n👉 學習＝做事＋回報＋分析＋連結\n👉 Learning = Execute + Report + Think + Collaborate\n🟦【第一層：做事（Execution）】\n👉 把事情做對\n✔ 拆任務 → 大變小\n✔ 排順序 → 先重要\n✔ 訂流程 → 一步一步\n✔ 做檢查 → 修正錯誤\n👉 核心\n會做事＝有邏輯\n🟩【第二層：回報（Reporting）】\n👉 讓老師放心\n✔ 主動說進度\n✔ 問題先想解法\n✔ 說清楚下一步\n👉 回報公式\n狀況＋問題＋方法＋下一步\n👉 核心\n會回報＝被信任\n🟨【第三層：分析（Thinking）】\n👉 看懂題目\n✔ 為什麼錯\n✔ 哪裡不懂\n✔ 有沒有規則\n✔ 如何改進\n👉 四連問\n為什麼 → 重不重要 → 可以怎樣 → 下一步\n👉 核心\n會分析＝有價值\n🟥【第四層：連結（Collaboration）】\n👉 放大成果\n✔ 找會的人\n✔ 一起完成\n✔ 分享資源\n✔ 建立信任\n👉 核心\n會連結＝有影響力\n🔥【升級路徑（橫向箭頭）】\n做事 → 回報 → 分析 → 連結\n👉 做事 → 成績穩\n👉 回報 → 老師信任\n👉 分析 → 成績變強\n👉 連結 → 全面領先\n⚠️【最大錯誤（右下角）】\n❌ 只做事\n❌ 不回報\n❌ 不思考\n❌ 不合作\n👉 結果：很努力但沒用\n🧩【最強總結（底部）】\n👉 初階：做事\n👉 中階：回報\n👉 高階：分析\n👉 頂階：連結\n👉 學習不是比努力\n👉 是比「讓結果更好」\n你未來不管做什麼工作\n👉 都只看四件事\n👉 第一：你會不會做事\n👉 第二：你會不會回報\n👉 第三：你會不會思考\n👉 第四：你會不會合作\n所以這堂課\n👉 不是只有英文\n👉 是在訓練你的「能力系統」\n我先講清楚\n👉 我不在意你現在程度\n👉 我只在意你會不會進步\n在我這堂課\n👉 不允許三種人\n❌ 不動腦的人\n❌ 不開口的人\n❌ 不合作的人\n但你做到這四件事\n👉 我一定讓你變強\n✔ 會做事（作業做好）\n✔ 會回報（主動講）\n✔ 會思考（問為什麼）\n✔ 會合作（一起完成）\n我告訴你一個現實\n👉 成績好的人\n不是最聰明\n👉 是最會用方法\n所以你現在要做一件事\n👉 把自己從「學生」\n👉 升級成「會做事的人」\n接下來這學期\n👉 我會一直要求你\n說清楚\n做完整\n想明白\n一起做\n你只要跟上\n👉 這堂課結束\n👉 你不只是英文變好\n👉 你是整個人變強\n最後一句話記住\n👉 你不是來上課\n👉 你是來升級\"\n\n──────────────────────────────────────────────────", "length": 1135}, {"id": 107, "date": "2026/03/25（三） 08:35", "author": "欣蓉", "title": "情商實戰×班導版＋英文老師版", "category": "班導班務", "content": "2026/03/25（三） 08:35 - 欣蓉\n\n\"🔥《情商實戰×班導版＋英文老 ills are not everything\n👉 連結才是力量\n👉 Connections are power\n🔥《四大應用 Applications》\n1️⃣ 人脈 Connections\n👉 認識更多對的人\n👉 Connect with the right people\n👉 機會是連出來的\n👉 Opportunities come from connections\n2️⃣ 知識 Knowledge\n👉 不要只背\n👉 Don’t just memorize\n👉 要把知識連起來\n👉 Connect knowledge together\n👉 連結 = 理解\n👉 Connection = understanding\n3️⃣ 興趣圈 Communities\n👉 找同類的人\n👉 Find your people\n👉 一群人會更強\n👉 A group is stronger than one\n4️⃣ 情緒連結 Emotion\n👉 不要孤立\n👉 Don’t isolate yourself\n👉 要建立連結\n👉 Build connections\n👉 連結帶來安全感\n👉 Connection brings security\n🔥《三大問題解法 Solutions》\n🧩 職場 Career\n👉 沒機會 → 擴大人脈\n👉 No opportunities → expand your network\n📚 學習 Learning\n👉 卡住 → 連結知識\n👉 Stuck → connect knowledge\n😶 孤單 Loneliness\n👉 沒人懂 → 進入圈子\n👉 No one understands → join a community\n🔥《最大誤區 Warning》\n👉 不是越多越好\n👉 More is not always better\n👉 是要高品質連結\n👉 Quality connections matter\n🔥《進階理解 Advanced》\n👉 三種連結\n👉 Three types of connections\n1️⃣ 人與人\n1️⃣ People to people\n2️⃣ 知識與知識\n2️⃣ Knowledge to knowledge\n3️⃣ 自己與世界\n3️⃣ Self to the world\n🔥《最強記憶版 Memory Lines》\n👉 一個人很弱\n👉 One person is weak\n👉 一張網很強\n👉 A network is powerful\n👉 機會不是等來\n👉 Opportunities are not waited for\n👉 是連出來\n👉 They are created through connections\n👉 學習不是背\n👉 Learning is not memorizing\n👉 是連\n👉 It is connecting\n👉 價值不是你\n👉 Value is not you\n👉 是你連到誰\n👉 It is who you connect with\n🔥《老師版應用 Teacher Use》\n👉 班級強不強\n👉 A class is strong or not\n👉 看連結\n👉 Depends on connections\n👉 Pair Work = 放大器\n👉 Pair work is a multiplier\n🔥《終極一句 Final Line》\n👉 你的人生高度\n👉 Your life level\n👉 取決於你連出去的範圍\n👉 Depends on how far you connect\"\n\n──────────────────────────────────────────────────", "length": 2177}, {"id": 117, "date": "2026/03/26（四） 06:15", "author": "欣蓉", "title": "三、老師教學模型（超重要）", "category": "教學轉型", "content": "2026/03/26（四） 06:15 - 欣蓉\n\n\"《三、老師教學模型（超重要）》\n🔹① 不教答案 → 教結構\n👉 例\n❌ 背單字\n✔ 字根＋搭配詞\n👉 teach structure, not answers\n🔹② 不講太多 → 讓學生說\n👉 每節課必做👇\n✔ Pair Work\n👉 Students speak, not teacher\n🔹③ 不一次教多 → 重複循環\n👉 同一結構\n👉 不同情境練\n👉 Repeat with variation\n🔹④ 不只教 → 要回饋\n👉 立即修正\n👉 Immediate feedback\n🔹⑤ 不靠努力 → 靠系統\n👉 固定流程👇\n👉 Pair Work → 教學 → 練習 → 回饋\"\n\n──────────────────────────────────────────────────", "length": 370}, {"id": 118, "date": "2026/03/26（四） 08:14", "author": "欣蓉", "title": "你的專業 → AI分身（高中英文老師版）", "category": "英文應用", "content": "2026/03/26（四） 08:14 - 欣蓉\n\n\"《你的專業 → AI分身（高中英文老師版）》\n🧠 核心一句（先背）\n👉 你不是教英文\n👉 You are not just teaching English\n👉 你在做一個「會教英文的AI系統」\n👉 You are building an AI teaching system\n🔥《一、AI分身本質（最重要）》\n👉 AI不是工具\n👉 AI is not a tool\n👉 是你的「複製版老師」\n👉 It is your cloned teacher\n👉 目標👇\n👉 讓AI做到：\n👉 Explain（講解）\n👉 Ask（提問）\n👉 Correct（修正）\n👉 Guide（引導）\n🔥《二、建立AI分身3步驟（直接做）》\n🔹STEP 1｜設定角色（人格設計）\n👉 貼進AI👇\n你是一位高中英文老師（有20年以上經驗）\n風格：嚴格但支持學生\n任務：幫學生用簡單英文學會表達\n禁止：不要直接給答案\n👉 You are a senior high school English teacher\n👉 Strict but supportive\n👉 Help students express in simple English\n👉 Do NOT give answers directly\n🔹STEP 2｜設定教學邏輯（最關鍵）\n當學生問問題時：\n1. 先用簡單英文回答\n2. 再用中文解釋\n3. 再問3個問題引導學生思考\n4. 最後讓學生自己說一句英文\n👉 Answer → Explain → Ask → Practice\n🔹STEP 3｜輸入你的「獨門經驗」\n👉 把你最強的教學方法餵給AI👇\n例如：\n學生最常問題：\n1. 不敢開口\n2. 背單字但不會用\n3. 文法會但不會講\n我的解法：\n1. Pair Work強制開口\n2. 句型代替單字\n3. 先講再修正\n👉 Feed your real experience into AI\n🔥《三、直接可用AI Prompt（複製貼上）》\n🎯日常對話練習\n你是我的英文教練\n請用B1程度英文跟我對話\n每句話後面給中文\n如果我錯，請幫我修正並解釋\n🎯句型訓練\n請給我5個常用英文句型\n每個句型附中文\n並給我練習機會\n🎯學測訓練\n你是學測英文老師\n請出一題閱讀或克漏字\n並一步步引導我解題\n不要直接給答案\"\n2026/03/27（五）\n\n──────────────────────────────────────────────────", "length": 1064}, {"id": 119, "date": "2026/03/27（五） 04:10", "author": "欣蓉", "title": "查理芒格5個逆向思維｜極限壓縮LINE版", "category": "心理人格", "content": "2026/03/27（五） 04:10 - 欣蓉\n\n\"《查理芒格5個逆向思維｜極限壓縮LINE版》\n👉核心\n不是比努力\n是比「選擇＋判斷」\n👉聰明人\n不是多做\n是少做錯\n①機會成本\n👉做一件事\n＝放棄其他事\n👉滑手機10分\n＝少進步10分\n👉重點\n不是浪費時間\n是錯過更好的事\n👉一句\n選擇＝放棄\n②賽馬思維\n👉好東西\n不一定值得\n👉大家都說好\n通常很貴\n👉重點\n不是選最好\n是選「被低估」\n👉一句\n好≠值得\n③適者生存\n👉不要一直比最強\n👉找自己的位置\n👉重點\n在對的地方\n才容易贏\n👉一句\n適合＞厲害\n④安全邊際\n👉不要剛剛好\n👉要多準備\n👉60分不夠\n要準備80分\n👉重點\n預防出錯\n👉一句\n多留空間＝更安全\n⑤激勵機制\n👉人是被「好處」推動\n👉有獎勵\n就會更努力\n👉重點\n看人要看利益\n👉一句\n行為＝利益\n🔥總結（必背）\n👉不重要  it｜Vocab/grammar/meaning\n05判斷＝看依據｜列證據｜不是我覺得，是有根據\nJudgment = evidence-based｜List evidence｜Not feeling, but proof\n06選擇＝比權重｜列標準｜時間/難度/回報比較\nChoice = weighting｜Set criteria｜Time/difficulty/return\n07理解＝建連結｜連舊知｜這和上次學的哪裡像\nUnderstanding = connect｜Link prior knowledge｜What is similar?\n08記憶＝靠結構｜用圖表｜心智圖整理\nMemory = structure｜Use charts｜Mind map it\n09推理＝看因果｜找前後｜因為A所以B\nReasoning = causality｜Trace links｜Because A, so B\n10表達＝用模板｜固定句型｜先總後分再舉例\nExpression = templates｜Use patterns｜Point→detail→example\n11閱讀＝抓骨架｜先看主旨｜先找topic sentence\nReading = find structure｜Get main idea first｜Find topic sentence\n12寫作＝先搭架｜列提綱｜先寫三點再展開\nWriting = scaffold first｜Outline first｜3 points then expand\n13口說＝先建句框｜套句型｜I think… because…\nSpeaking = sentence frames｜Use patterns｜I think… because…\n14錯誤＝資料不是失敗｜記錄再修｜錯題本整理\nError = data, not failure｜Track and fix｜Error log\n15比較＝用同標準｜一致評估｜兩篇作文都看內容/結構/語言\nComparison = same criteria｜Evaluate consistently｜Same rubric for both\n16抽象＝變具體｜舉例化｜自由＝能負責自己的選擇\nAbstract = make concrete｜Use examples｜Freedom = responsible choice\n17情緒＝先分離｜情緒後判斷｜先冷靜再決定\nEmotion = separate first｜Feel later, judge after｜Calm before deciding\n18偏誤＝主動校正｜問反例｜有沒有相反證據\nBias = correct on purpose｜Ask for counterexample｜Any opposite evidence?\n19未知＝先假設｜做小測試｜先試一題看看\nUnknown = hypothesize｜Run a small test｜Try one first\n20學習＝反覆建模｜同題多解｜同一題用不同方法\nLearning = repeated modeling｜Solve multiple ways｜Different methods\n21時間＝也是模型｜分配資源｜25分鐘專注＋5分鐘休息\nTime = a model too｜Allocate resources｜25/5 focus cycle\n22注意力＝有限資源｜先排干擾｜手機先收起\nAttention = limited resource｜Remove distractions｜Put phone away\n23目標＝方向模型｜先定終點｜這堂課要會3句\nGoal = direction model｜Set endpoint｜Learn 3 sentences today\n24回饋＝修模機制｜立刻調整｜老師一改我就重說\nFeedback = model correction｜Adjust immediately｜Fix and repeat now\n25系統＝重複可用｜建立流程｜看題→拆題→作答→檢查\nSystem = reusable model｜Build a process｜Read→analyze→answer→check\n26高分＝模型熟練｜反覆套用｜閱讀題先看題幹再找文\nHigh score = fluent modeling｜Apply repeatedly｜Questions first, then text\n27創意＝重組模型｜舊元素新排列｜舊單字組成新句\nCreativity = recombine models｜Rearrange old parts｜Old words, new sentence\n28成長＝持續更新｜不要固著｜昨天的方法今天可再優化\nGrowth = updating｜Don’t stay fixed｜Improve yesterday’s method\n29主控＝自己建模｜不只聽答案｜我自己畫出解題路徑\nAgency = self-modeling｜Don’t just receive answers｜Map solution yourself\n30思考＝可訓練技能｜每天刻意練｜每天問：這件事的模型是什麼\nThinking = trainable skill｜Practice daily｜Ask: what model fits this?\n———核心壓縮———\n思考不是亂想👉是用「分類×結構×因果×權重」建立模型\nThinking isn’t random → it is building models through classification, structure, causality, and weighting\n———一句話超濃縮———\n不會思考的人看表面\n會思考的人看模型\nPeople who don’t think see events\nPeople who think see models\"\n\n──────────────────────────────────────────────────", "length": 3004}, {"id": 158, "date": "2026/03/31（二） 10:56", "author": "欣蓉", "title": "更新系統×智慧模型（中英逐行×帶班版）", "category": "學習策略", "content": "2026/03/31（二） 10:56 - 欣蓉\n\n\"🔥《更新系統×智慧模型（中英逐行×帶班版）》🔥\n🧠【核心概念20句｜班導可用】\n1️⃣世界不是因果，是更新系統；The world is not cause-effect, it is an updating system;\n2️⃣熵增代表不確定性上升；Entropy means uncertainty increases;\n3️⃣誤差不是問題，是訊號；Error is not a problem, it is a signal;\n4️⃣更新不是修正，是進化；Updating is not fixing, it is evolving;\n5️⃣結構不是固定，是暫時穩定；Structure is not fixed, it is temporary stability;\n6️⃣智慧來自預測能力提升；Wisdom comes from better prediction;\n7️⃣世界在變，是因為一直修正；The world changes because it keeps updating;\n8️⃣不是邏輯主導，而是動態調整；Not logic-driven, but dynamic adjustment;\n9️⃣沒有誤差，就沒有學習；No error, no learning;\n🔟沒有更新，就沒有進化；No update, no evolution;\n1️⃣1️⃣人卡住，是因為抗拒誤差；People get stuck because they resist errors;\n1️⃣2️⃣情緒常掩蓋錯誤訊號；Emotions often hide error signals;\n1️⃣3️⃣合理化會阻斷成長；Rationalizing blocks growth;\n1️⃣4️⃣接受錯誤，才開始升級；Accept errors to start upgrading;\n1️⃣5️⃣系統比努力更重要；Systems matter more than effort;\n1️⃣6️⃣持續修正，比一次做對重要；Continuous correction beats perfection;\n1️⃣7️⃣學習是動態更新，不是記憶；Learning is updating, not memorizing;\n1️⃣8️⃣未來屬於會調整的人；The future belongs to adaptors;\n1️⃣9️⃣穩定來自調整，不是控制；Stability comes from adaptation, not control;\n2️⃣0️⃣進化是反覆試錯的結果；Evolution comes from trial and error;\n🚀【AI思維20句｜英文老師可用】\n1️⃣AI不是聰明，是持續修正；AI is not smart, it keeps updating;\n2️⃣AI靠誤差學習；AI learns from error;\n3️⃣loss代表預測錯誤；Loss means prediction error;\n4️⃣feedback讓模型修正；Feedback helps adjust models;\n5️⃣training讓系統進化；Training evolves the system;\n6️⃣AI越錯越準；The more errors, the more accurate;\n7️⃣AI不逃避錯誤；AI does not avoid mistakes;\n8️⃣AI不合理化錯誤；AI does not justify errors;\n9️⃣AI直接修正；AI directly updates;\n🔟人類卻常逃避錯誤；Humans often avoid mistakes;\n1️⃣1️⃣人類用情緒蓋錯誤；Humans hide errors with emotions;\n1️⃣2️⃣人類怕犯錯；Humans fear mistakes;\n1️⃣3️⃣但錯誤才是資料；Errors are data;\n1️⃣4️⃣資料才會產生智慧；Data creates intelligence;\n1️⃣5️⃣沒有數據就沒有成長；No data, no growth;\n1️⃣6️⃣AI思維是反覆修正；AI thinking is iterative updating;\n1️⃣7️⃣不是追求完美；Not perfection seeking;\n1️⃣8️⃣是降低誤差；It is reducing error;\n1️⃣9️⃣人若學會更新，就像AI；If humans update, they become like AI;\n2️⃣0️⃣不更新的人才會被取代；Those who don’t update get replaced;\n🔍【表象 vs 本質20句｜可帶班】\n1️⃣表象層用故事解釋；Surface explains with stories;\n2️⃣本質層用結構理解；Essence understands with structure;\n3️⃣表象靠情緒決策；Surface uses emotion;\n4️⃣本質靠模型預測；Essence uses models;\n5️⃣表象看過去；Surface looks backward;\n6️⃣本質看未來；Essence predicts forward;\n7️⃣表象會重複錯誤；Surface repeats mistakes;\n8️⃣本質會修正錯誤；Essence corrects errors;\n9️⃣表象慢一步；Surface is reactive;\n🔟本質提前一步；Essence is proactive;\n1️⃣1️⃣表象在解釋世界；Surface explains the world;\n1️⃣2️⃣本質在生成世界；Essence generates the world;\n1️⃣3️⃣表象找答案；Surface seeks answers;\n1️⃣4️⃣本質建模型；Essence builds models;\n1️⃣5️⃣表象怕錯；Surface fears mistakes;\n1️⃣6️⃣本質用錯；Essence uses mistakes;\n1️⃣7️⃣表象依賴經驗；Surface relies on experience;\n1️⃣8️⃣本質依賴更新；Essence relies on updates;\n1️⃣9️⃣表象停在結果；Surface stops at results;\n2️⃣0️⃣本質進入機制；Essence enters mechanisms;\n🧨【最終總結（貼牆用）】\n👉看見誤差＝開始成長；See error = start growing;\n👉接受錯誤＝開始升級；Accept mistakes = upgrade;\n👉建立系統＝開始進化；Build systems = evolve;\n👉停止找答案＝開始理解世界；Stop seeking answers = understand reality;\"\n\n──────────────────────────────────────────────────", "length": 3005}, {"id": 159, "date": "2026/03/31（二） 11:26", "author": "欣蓉", "title": "學習不是輸入👉是轉化｜Learning isn’t input; it’s transfor ule）\n📌 Q5：你學習時的狀態？\nYour learning condition:\n☐ 容易分心（Distracted）\n☐ 時間不足（No time）\n☐ 沒動力（Low motivation）\n☐ 壓力大（High stress）\n☐ 精力不足（Low energy）\n🧩 第五部分：策略診斷（核心）\n📌 Q6：請選出最符合你的情況\nSelect what fits you:\n☐ 我背很多但不會用（Memorize but can’t use）\n☐ 我知道但說不出來（Know but can’t speak）\n☐ 我練很多但沒進步（Practice but no progress）\n☐ 我不確定怎麼學（Don’t know how to learn）\n☐ 我容易卡住（Often stuck）\n🎯 第六部分：目標與動機\n📌 Q7：你學英文的目的\nWhy do you learn English?\n☐ 考試（Exams）\n☐ 溝通（Communication）\n☐ 升學（School）\n☐ 未來工作（Career）\n☐ 不確定（Not sure）\n🚀 第七部分：行動承諾（最重要）\n📌 Q8：你願意做哪一個改變？\nWhat change will you start?\n🔘 每天10句\n🔘 每天開口說\n🔘 記錄錯誤\n🔘 固定時間讀書\n🔥 表單結尾（直接貼）\n👉你不是學不好\n👉你只是還沒對齊\n👉You are not bad\n👉You are just not aligned yet\n⚡ 給你帶班小技巧（超關鍵）\n👉收完表單後你可以這樣用👇\n① 按成績分層（高／中／低）\n② 按困難分類（5類型）\n③ 直接分組教學\n👉這一份＝你的「班級數據儀表板」\"\n\n──────────────────────────────────────────────────", "length": 2078}, {"id": 167, "date": "2026/03/31（二） 08:53", "author": "欣蓉", "title": "學習不是輸入👉是轉化 Google表單（高中英文）", "category": "英文應用", "content": "2026/03/31（二） 08:53 - 欣蓉\n\n\"《學習不是輸入👉是轉化 Google表單（高中英文）》\n🧠 表單標題\n高中英文學習轉化診斷（Learning Transformation Diagnosis）\n📝 表單說明（直接貼）\n👉請依照你的實際情況作答（可複選）\n👉This form helps you transform knowledge into usable ability\n👉核心觀念：\n學習不是輸入👉是轉化\nLearning isn’t input → it’s transformation\n👤 第一部分：基本資料（必填）\n📌 Q0-1 姓名 Name（簡答）\n📌 Q0-2 班級 Class（簡答）\n📌 Q0-3 座號 Seat Number（簡答）\n📌 Q0-4 最近英文成績 English Score（簡答）\n🔍 第二部分：轉化能力診斷（可複選）\n📌 Q1：你目前最卡的地方是？\nWhere are you stuck?\n☐ 背單字但不會用（Word→no sentence）\n☐ 看得懂但說不出（Understand→can’t speak）\n☐ 學過但不會寫（Know→can’t write）\n☐ 做題但不會解釋（Do→can’t explain）\n☐ 文法懂但不會用（Grammar→no usage）\n☐ 常犯一樣錯（Repeat errors）\n☐ 不會整理重點（No summarizing）\n☐ 不知道怎麼學（No method）\n⚙️ 第三部分：轉化行為檢測\n📌 Q2：你有做到哪些「轉化行為」？\nWhat transformation actions do you do?\n☐ 會用單字造句（Word→sentence）\n☐ 會把句子變段落（Sentence→paragraph）\n☐ 會用學過句型說話（Pattern→speaking）\n☐ 會教同學（Explain to others）\n☐ 會整理重點（Summarize）\n☐ 會改錯誤（Correct errors）\n☐ 會重複使用學過內容（Reuse）\n📌 Q3：你學習時的習慣？\nYour learning habits:\n☐ 只看不說（Input only）\n☐ 很少輸出（Low output）\n☐ 沒有固定流程（No system）\n☐ 沒有記錯誤（No error log）\n☐ 沒有回顧（No review）\n🔄 第四部分：轉化系統診斷\n📌 Q4：你目前的學習比較像哪種？\nYour learning style:\n🔘 只輸入（Input only）\n🔘 有輸出但不穩（Some output）\n🔘 有轉化（Transformation happening）\n📌 Q5：你是否有以下問題？\nDo you experience:\n☐ 學很多但用不到（Learn but useless）\n☐ 很努力但沒進步（Work hard but no result）\n☐ 忘很快（Forget quickly）\n☐ 不知道重點（No focus）\n🧩 第五部分：關鍵轉化能力（核心）\n📌 Q6：你缺少哪一個能力？\nWhich ability do you lack?\n☐ 把單字變句子（Word→sentence）\n☐ 把理解變表達（Understanding→expression）\n☐ 把知識變行動（Knowledge→action）\n☐ 把錯誤變進步（Error→improvement）\n☐ 把學習變習慣（Learning→habit）\n🎯 第六部分：動機與內在轉化\n📌 Q7：你的學習狀態\nYour state:\n☐ 沒動力（Low motivation）\n☐ 壓力很大（High stress）\n☐ 容易比較（Compare others）\n☐ 容易放棄（Give up easily）\n🚀 第七部分：行動轉化（最重要）\n📌 Q8：你願意開始哪個行動？\nWhat will you start?\n🔘 每天說3句英文（Speak 3 sentences）\n🔘 每天造句（Make sentences）\n🔘 記錄錯誤（Error log）\n🔘 每天固定時間學（Fixed schedule）\n📊 結果分析（老師用）\n🔴 類型1：輸入型學生（Input only）\n👉特徵：背很多但不會用\n👉對策：\n輸入→輸出\n👉每天造句＋開口\n🟡 類型2：卡關型學生（Stuck）\n👉特徵：懂但說不出\n👉對策：\n理解→表達\n👉教同學\n🔵 類型3：無系統型（No system）\n👉特徵：亂學\n👉對策：\n建立流程\n👉固定SOP\n🟢 類型4：錯誤未利用（No optimization）\n👉特徵：一直犯錯\n👉對策：\n錯誤→資料\n👉錯題本\n🟣 類型5：轉化高手（High Agency）\n👉特徵：會用會講\n👉對策：\n提升難度\n👉寫作＋教學\n🔥 表單結尾（直接貼）\n👉你不是學不會\n👉你只是還沒轉化\n👉You don’t lack ability\n👉You lack transformation\n⚡ 帶班關鍵（超重要）\n👉你這份表單＝直接做到👇\n✔ 分出「會背但不會用」\n✔ 分出「會用但不穩」\n✔ 分出「已轉化」\n👉然後直接分三層教學\n🚀 一句話貼牆\n👉學習不是吸收\n👉是把知識變成能力\nhttps://forms.gle/x1bktusbTnAHA2DV9\"\n\n──────────────────────────────────────────────────", "length": 2284}, {"id": 168, "date": "2026/03/31（二） 08:59", "author": "欣蓉", "title": "意義不是給👉是創造 Google表單（高中雙語）", "category": "診斷工具", "content": "2026/03/31（二） 08:59 - 欣蓉\n\n\"🔥《意義不是給👉是創造 Google表單（高中雙語）》\n🧠 表單標題\n高中學習意義建構診斷（Meaning Creation Diagnosis）\n📝 表單說明（直接貼）\n👉請依照你的真實狀況作答（可複選）\n👉This form helps you understand how you create meaning in learning\n👉核心觀念：\n意義不是被給👉是你創造的\nMeaning isn’t given → it’s created\n👤 第一部分：基本資料（必填）\n📌 Q0-1 姓名 Name（簡答）\n📌 Q0-2 班級 Class（簡答）\n📌 Q0-3 座號 Seat Number（簡答）\n📌 Q0-4 最近英文成績 English Score（簡答）\n🔍 第二部分：意義建構診斷（可複選）\n📌 Q1：當你遇到困難時，你通常怎麼想？\nWhen facing difficulty, what do you think? ords, but sentences\n不是翻譯👉是表達 → Not translate, but express\n程度不是問題👉使用才是 → Level is not the problem, usage is\n不會用👉等於不會 → If you don’t use it, you don’t know it\n聽不是輸入👉是訓練 → Listening is training\n說不是能力👉是習慣 → Speaking is a habit\n寫不是作業👉是輸出 → Writing is output\n錯不是問題👉不改才是 → Mistakes are fine, not fixing is not\n每天一句👉建立語感 → One sentence builds intuition\n每天輸出👉建立能力 → Daily output builds ability\n文法不是規則👉是功能 → Grammar is function\n句型不是記👉是用 → Patterns are for use\n英文不是記住👉是自動 → English should be automatic\n練習不是一次👉是每天 → Practice is daily\n學習不是努力👉是設計 → Learning is design\n系統對了👉自然進步 → Right system leads to progress\n🔥《LINE極限壓縮版（最強貼牆）》\n人生不是努力👉是系統 → Life is system\n英文不是學👉是用 → English is use\n問題不是錯👉是訊號 → Problems are signals\n卡住不是爛👉是流程錯 → Stuck means wrong system\n成長不是一次👉是每天優化 → Growth is daily improvement\n🔥《一句話控班核心🔥》\n你不是做不到 → You are not incapable\n你只是還沒設計好系統 → You just lack a system\"\n\n──────────────────────────────────────────────────", "length": 1773}, {"id": 171, "date": "2026/04/01（三） 09:34", "author": "欣蓉", "title": "最強收尾（貼牆用）", "category": "班級海報", "content": "2026/04/01（三） 09:34 - 欣蓉\n\n\"班級洗腦牆120句（中英逐行）》\n🟢第一區｜身份重建（1–40）\n我不是來考試👉我是來成長 → I am not here to test, I am here to grow\n我不是來聽課👉我是來訓練 → I am not here to listen, I am here to train\n我不是被教👉我是主動學 → I am not taught, I take action\n我不是怕錯👉我是用錯學 → I am not afraid of mistakes, I learn from them\n錯不是問題👉不改才是 → Mistakes are fine, not fixing is not\n我不完美👉但我會優化 → I am not perfect, but I improve\n我不是沒能力👉是還沒練 → I am not incapable, I just haven’t trained\n我不是不會👉是還沒用 → I don’t know because I don’t use\n我不是卡住👉是系統錯 → I am not stuck, the system is wrong\n我不是懶👉是沒動力設計 → I am not lazy, I lack system design\n我不是差👉是方法錯 → I am not bad, my method is wrong\n我不是慢👉是節奏錯 → I am not slow, my pace is wrong\n我不等準備好👉我先做 → I don’t wait, I start\n我不等完美👉我先行動 → I don’t wait for perfect, I act\n我不等動力👉我先開始 → I don’t wait for motivation, I start\n我不是被動👉我是主控 → I am not passive, I take control\n我不是依賴👉我是負責 → I am not dependent, I take responsibility\n我不是逃避 hey are only passively listening, not truly learning\n不是有效學習 → This is not an effective way to learn\n學很多不代表會 → Learning a lot does not mean real mastery\n關鍵是決策更準 → The key is making more accurate decisions\n英文不是記更多 → English is not about memorizing more\n是用得更精準 → It is about using language more precisely\n傳統教學重輸入 → Traditional teaching focuses on input\n但缺少系統更新 → But it lacks system-level updating\n學生常聽很多課 → Students attend many lessons\n但能力沒有升級 → Yet their ability does not improve\n因為只是被教 → Because they are only being taught\n沒有自己運作 → Instead of actively operating themselves\n沒有錯誤修正 → There is no correction of mistakes\n沒有即時回饋 → And no immediate feedback\n所以學習停在表面 → So learning remains superficial\n我選擇用AI → I choose to use AI\n因為AI會回饋 → Because AI provides feedback\n做錯馬上修正 → Mistakes are corrected immediately\n練習可以調整 → Practice can be adjusted in real time\n這才是真正學習 → This is what real learning looks like\nAI不是取代老師 → AI does not replace teachers\n是放大學習效率 → It amplifies learning efficiency\n老師不再一直講 → Teachers no longer lecture all the time\n而是設計系統 → Instead, they design learning systems\n設計任務與練習 → They design tasks and practice\n也設計回饋機制 → And also design feedback systems\n學生不是聽課 → Students are not just listening\n而是自己運作 → They actively operate their learning\n自己練自己錯 → They practice and make mistakes\n再自己修正 → Then they correct themselves\n這才會真正進步 → That is how real progress happens\n🔥可直接講（學生版）\n你不是來聽英文 → You are not here just to listen to English\n你是來變強 → You are here to become stronger\n🔥可對家長講\n我不是少教 → I am not teaching less\n我是讓學生真的會 → I am helping students truly master it\"\n\n──────────────────────────────────────────────────", "length": 1735}, {"id": 184, "date": "2026/04/03（五） 06:03", "author": "欣蓉", "title": "傳統教學 vs AI自主學習｜60差異（中英）", "category": "學習策略", "content": "2026/04/03（五） 06:03 - 欣蓉\n\n\"🔥《傳統教學 vs AI自主學習｜60差異（中英）》\n01老師一直講 → Teacher talks all the time\n學生被動聽 → Students passively listen\n02同一速度教 → One fixed pace\n每人不同步 → No personalization\n03重內容輸入 → Focus on input\n忽略實際輸出 → Ignore output practice\n04記憶為主 → Memorization-based\n應用能力弱 → Weak application\n05錯誤延後改 → Delayed correction\n錯誤即時改 → Immediate correction\n06沒有回饋 → No feedback\n即時回饋 → Instant feedback\n07老師主導 → Teacher-centered\n學生主導 → Student-centered\n08全班一起走 → One-size-fits-all\n個別進度 → Individual pacing\n09錯了沒發現 → Errors unnoticed\n錯了立即知道 → Errors detected instantly\n10只考試驗收 → Test-only evaluation\n過程持續追蹤 → Continuous tracking\n11學習慢累積 → Slow accumulation\n快速迭代 → Fast iteration\n12只聽不做 → Listen only\n邊做邊學 → Learn by doing\n13重感覺理解 → Feel understanding\n重精準操作 → Precise execution\n14老師解題 → Teacher explains\n學生解題 → Students solve\n15課堂為主 → Class-dependent\n隨時可學 → Learn anytime\n16學習被動 → Passive learning\n主動探索 → Active exploration\n17忽略差異 → Ignore differences\n強化個別 → Personalization\n18只講知識 → Teach knowledge\n訓練能力 → Train ability\n19錯誤被避免 → Avoid mistakes\n錯誤被利用 → Use mistakes\n20學習斷裂 → Fragmented learning\n系統連結 → Systematic learning\n21重筆記 → Focus on notes\n重練習 → Focus on practice\n22時間固定 → Fixed time\n彈性時間 → Flexible time\n23壓力來自考試 → Exam pressure\n動機來自進步 → Growth motivation\n24老師判斷 → Teacher judges\n數據判斷 → Data-driven\n25無法重播 → Cannot repeat\n可反覆練習 → Repeatable practice\n26忽略弱點 → Ignore weaknesses\n精準補強 → Target weaknesses\n27同題反覆 → Repeat same type\n多樣變化 → Diverse variations\n28單向教學 → One-way teaching\n雙向互動 → Interactive learning\n29情緒主導 → Emotion-driven\n數據修正 → Data correction\n30教完就結束 → Ends after class\n持續優化 → Continuous improvement\n31學生依賴老師 → Depend on teacher\n學生自主學習 → Independent learning\n32老師給答案 → Teacher gives answers\n學生找答案 → Students find answers\n33怕犯錯 → Fear mistakes\n允許犯錯 → Accept mistakes\n34學習慢熱 → Slow engagement\n快速進入狀態 → Fast engagement\n35學習低頻 → Low frequency\n高頻練習 → High frequency\n36重一次學會 → One-shot learning\n反覆優化 → Iterative learning\n37缺乏回顧 → No reflection\n持續反思 → Continuous reflection\n38學習外控 → External control\n學習內控 → Self-regulation\n39老師是中心 → Teacher is center\n系統是中心 → System is center\n40學習不透明 → Invisible progress\n學習可視化 → Visible progress\n41結果導向 → Result only\n過程＋結果 → Process + result\n42學習壓抑 → Suppressed learning\n學習釋放 → Liberated learning\n43缺乏成就感 → Low achievement\n即時成就感 → Instant achievement\n44只會應付考試 → Test-oriented\n應對真實問題 → Real-world ability\n45學習孤立 → Isolated learning\n連結系統 → Connected learning\n46依賴記憶 → Memory-dependent\n依賴理解 → Understanding-based\n47進步看不到 → Invisible progress\n進步可追蹤 → Trackable progress\n48老師負責 → Teacher responsible\n學生負責 → Student responsible\n49沒有模型 → No framework\n有學習模型 → Structured model\n50容易放棄 → Easy to quit\n持續動機 → Sustained motivation\n51重複錯誤 → Repeat mistakes\n持續修正 → Continuous correction\n52學習低效率 → Low efficiency\n高效率學習 → High efficiency\n53耗時間多 → Time-consuming\n節省時間 → Time-efficient\n54輸入過多 → Too much input\n輸出導向 → Output-driven\n55缺乏精準 → Lack precision\n精準提升 → Precision growth\n56只會聽懂 → Understand only\n能夠運用 → Apply effectively\n57學習停滯 → Learning stagnates\n持續進化 → Continuous evolution\n58情緒安慰多 → Emotional comfort\n能力提升多 → Skill improvement\n59學習假成長 → Illusion of growth\n真實成長 → Real growth\n60只是上課 → Just attending class\n真正變強 → Becoming stronger\n🔥收尾一句（超關鍵）\n👉傳統是「教過就算」\n👉AI是「學會才算」\nTraditional: taught = done\nAI learning: mastered = done\"\n\n──────────────────────────────────────────────────", "length": 3296}, {"id": 185, "date": "2026/04/03（五） 06:05", "author": "欣蓉", "title": "老師一直講＝好老師？其實是學習迷思", "category": "升學迷思", "content": "2026/04/03（五） 06:05 - 欣蓉\n\n\"🔥《老師一直講＝好老師？其實是學習迷思》\n你以為老師一直講\n→ 就是認真負責\nYou think constant lecturing\n→ means responsibility\n其實那只是輸出\n→ 不是有效學習\nIn fact, it is only output\n→ not effective learning\n老師講很多\n→ 不代表學生會\nA teacher talks a lot\n→ does not mean students learn\n學生安靜聽\n→ 不代表理解\nStudents sit quietly\n→ does not mean understanding\n真正的學習\n→ 是學生在運作\nReal learning\n→ happens when students act\n不是老師講得多\n→ 是學生做得多\nIt is not about teacher talk\n→ but student practice\n如果學生沒有練\n→ 能力不會提升\nWithout practice\n→ ability does not improve\n如果沒有犯錯\n→ 就沒有修正\nWithout mistakes\n→ there is no correction\n如果沒有回饋\n→ 就沒有進步\nWithout feedback\n→ there is no progress\n很多人把「被教」\n→ 當成「有學到」\nMany people confuse being taught\n→ with actually learning\n但那只是感覺好\n→ 不是真正變強\nThat only feels good\n→ but does not build strength\n這就是學習的陷阱\n→ 安慰取代成長\nThis is the learning trap\n→ comfort replaces growth\n真正好的老師\n→ 不只是講課\nA great teacher\n→ does not only lecture\n而是設計系統\n→ 讓學生會學\nThey design systems\n→ so students can learn\n設計課程結構\n→ 引導學習路徑\nThey design structure\n→ and guide learning paths\n設計任務與練習\n→ 讓學生動起來\nThey design tasks\n→ so students take action\n設計回饋機制\n→ 讓學生修正\nThey design feedback\n→ so students improve\nAI讓學習改變\n→ 從講課到訓練\nAI changes learning\n→ from lecturing to training\n老師角色改變\n→ 從講者到教練\nTeachers shift roles\n→ from speaker to coach\n學生角色改變\n→ 從聽者到操作者\nStudents shift roles\n→ from listener to operator\n有些人還停在舊思維\n→ 只看老師講多少\nSome still use old thinking\n→ judging by lecture time\n卻錯過真正重要的\n→ 學習是否升級\nThey miss what matters\n→ whether learning improves\n也錯過更好的老師\n→ 設計系統的老師\nThey miss better teachers\n→ those who design systems\n真正值得感恩的老師\n→ 不是講最多\nThe teacher worth appreciating\n→ is not the one who talks most\n而是讓你變強最多\n→ 能自己學的人\nBut the one who makes you stronger\n→ and able to learn independently\n🔥一句話總結（可直接講）\n👉一直講課的老師\n👉只是很努力\n👉會設計學習的老師\n👉才是真的有效\nA teacher who lectures a lot\n→ is working hard\nA teacher who builds learning systems\n→ is truly effective\"\n\n──────────────────────────────────────────────────", "length": 1913}, {"id": 186, "date": "2026/04/03（五） 06:31", "author": "欣蓉", "title": "2026/04/03（五） 06:31 - 欣蓉", "category": "學習策略", "content": "2026/04/03（五） 06:31 - 欣蓉\n\n\"很多家長會覺得\n→ 老師講越多越好\nMany parents believe\n→ more teaching is better\n但真正關鍵不是講多少\n→ 是學生會不會\nThe key is not how much is taught\n→ but whether students learn\n傳統教學的問題\n→ 低效率\nTraditional teaching\n→ is low efficiency\n👉一對多講課\n→ 無法符合每個學生\nOne-to-many teaching\n→ cannot fit every student\n👉沒有即時回饋\n→ 錯誤無法修正\nNo instant feedback\n→ mistakes are not corrected\n👉學生只是聽\n→ 不是真正學\nStudents only listen\n→ not truly learn\n所以很多孩子\n👉上很多課\n👉卻不會用英文\nSo many students\n👉take many classes\n👉but cannot use English\n我們的做法不同\n👉用AI學習系統\n→ 即時回饋\nWe use AI systems\n→ instant feedback\n👉學生大量練習\n→ 快速修正\nStudents practice a lot\n→ correct quickly\n👉每人不同進度\n→ 個別優化\nEach student learns differently\n→ personalized learning\n老師的角色改變\n👉不是一直講\n→ 是設計學習\nTeacher does not just talk\n→ but designs learning\n👉不是給答案\n→ 是引導思考\nNot giving answers\n→ but guiding thinking\n👉最重要的是\n→ 建立孩子的內驅力\nMost importantly\n→ build inner motivation\n🔥關鍵一句（家長版）\n👉我不是少教\n👉我是讓孩子真正會\nI am not teaching less\nI am helping your child truly learn\"\n\n──────────────────────────────────────────────────", "length": 1015}, {"id": 187, "date": "2026/04/03（五） 11:42", "author": "欣蓉", "title": "2026/04/03（五） 11:42 - 欣蓉", "category": "學習策略", "content": "2026/04/03（五） 11:42 - 欣蓉\n\n\"老師一旦代勞，學習就變成了單向的「輸入」；\n只有讓學生自己思考，那才叫「內化」。\n⭐作文實作：把「主動權」還給孩子\n以作文為例，我強調的是「精煉」。\n一次不塞太多，「一小節一小節來」更能紮實做好。\n例如這週的重點是：分享經驗（說故事）。\n我配合 113 年第四次模考作文試題，\n👉引導學生快速說明故事背景。\n1️⃣首先，我會幫圖片定義題目，\n也就是「用一句話說明這張圖」。\n定義題目： 上課玩手機被老師抓到。\n2️⃣接著，利用「人事時地物」交代背景：\n背景範例：\n上週（時）英文課時（地），\n我覺得無聊便偷偷拿手機看訊息（人/事/物）。\n突然間，Line 訊息發出聲音，\n老師生氣地瞪著我，要求我交出手機並到教室門口罰站（轉折）。\n這些內容，是我拋出問題、引導他們思考後，\n由他們自己腦力激盪出來的，而不是我寫好讓他們背的。\n3️⃣再把這些背景概念，只用 3 到 5 句 內的英文句子寫完\n不用太管文法句型，只要緊緊抓住主題即可。\n📌為什麼堅持 3–5 句就結束？\n① 不偏題：集中火力說完重點，避免贅述。\n② 心理減壓：學生覺得才幾句話，更願意動筆挑戰。\n而且要讓他們算字數\n其實光這幾句，就已經達到約 45 到 60 個單字。\n看著他們寫完，算完字數的表情，\n眼睛嘴巴都呈現O型的驚訝跟快樂~\n4️⃣時間控制，刻意讓他們對寫作的時間「有感」\n這過程也會控制他們的時間，\n例如：如果3-5句能以一句1min的節奏，\n大約一段10句就能超過100字，且能在10mins 完成\n👉「6 週有感計畫」 \n1️⃣前 3 週：練習 9 篇背景交代\n  （1 篇課堂 + 2 篇作業），建立手感。\n2️⃣後 3 週：補上開頭、情緒與結尾。\n3️⃣搭配工具輔助：\n利用設定好的 AI Prompt 批改，並修正 2 個句構。\n只要 6 週，孩子就能在低壓力的狀態下，\n完成一個完整的段落練習。\"\n\n──────────────────────────────────────────────────", "length": 870}, {"id": 188, "date": "2026/04/03（五） 11:51", "author": "欣蓉", "title": "AI英文學習最大化系統（單字×句子×閱讀）", "category": "英文詞彙文法", "content": "2026/04/03（五） 11:51 - 欣蓉\n\n\"🔥《AI英文學習最大化系統（單字×句子×閱讀）》\n🟥一、單字系統（記憶×延伸×輸出）\n👉核心\n不是背單字\n是建立「使用網」\nNot memorize\nBuild usage network\n01造句→理解\nMake sentences → under 核心一句（打破迷思）真正讓英文進步的教學", "category": "教學轉型", "content": "2026/04/10（五） 06:11 - 欣蓉\n\n\"《核心一句（打破迷思）真正讓英文進步的教學》\n👉不是老師講很多\n👉學生就會進步\nIt is not about teachers talking more\nStudents will not improve just by listening\n👉是學生做很多\n👉能力才會長出來\nStudents must do more\nThat is how ability grows\n———\n🧠《用利己說服（關鍵轉折）》\n👉每個人本能都利己\nStudents are naturally self-focused\n👉學生最想要的是什麼？\nWhat do students really want?\n👉最少努力，最高分\nMinimum effort, maximum score\n👉如果課堂是👇\nIf class is like this:\n老師一直講\nTeacher keeps talking\n學生一直聽\nStudents keep listening\n👉學生會怎麼做？\nWhat will students do?\n👉放空、依賴、被動\nZone out, depend, stay passive\n👉看起來有在上課\n👉其實沒有成長\nLooks like learning\nBut no real growth\n———\n🔥《關鍵翻轉一句》\n👉好課不是讓學生輕鬆\nA good class is not easy\n👉是讓學生變強\nA good class makes you stronger\n———\n🧠《制度設計（蛋糕理論）》\n👉如果課堂是👇\nIf class is like this:\n老師講＝學生拿\nTeacher gives, students receive\n👉學生不用負責\nStudents take no responsibility\n👉就會選擇不學\nSo they choose not to learn\n（因為利己）\n(Because people follow self-interest)\n———\n👉但如果課堂是👇\nBut if class is like this:\n學生要輸出\nStudents must produce\n學生要完成任務\nStudents must complete tasks\n學生要用英文解決問題\nStudents must use English to solve problems\n👉為了成績\n👉就會被迫學會\nTo protect their grades\nThey are forced to learn\n———\n🔥《一句話打破家長迷思》\n👉不是老師講得多\nIt is not about teaching more\n👉是學生用得多\nIt is about students using more\n———\n🧠《三種課堂比較》\n❌傳統課\nTraditional class\n老師講80%\nTeacher talks 80%\n學生聽20%\nStudents listen 20%\n👉短期懂，長期不會\nShort-term understanding, long-term failure\n———\n⭕有效課\nEffective class\n老師設計\nTeacher designs\n學生練習＋輸出\nStudents practice and produce\n👉慢一點，但會用\nSlower, but usable\n———\n🔥高效課\nHigh-performance class\n老師給工具＋系統\nTeacher provides tools and systems\n學生自己運轉\nStudents run themselves\n👉最強複利\nStrongest long-term growth\n———\n💥《為什麼講很多反而害學生》\n1️⃣降低思考\nLess thinking\n👉學生不用想\nStudents do not think\n2️⃣降低責任\nLess responsibility\n👉學生不用負責\nStudents take no ownership\n3️⃣產生依賴\nCreate dependence\n👉永遠等老師\nAlways wait for teacher\n4️⃣錯覺學會\nFake learning\n👉聽懂不等於會\nUnderstanding ≠ ability\n5️⃣無法轉移\nNo transfer\n👉考試會，現實不會\nWorks in tests, fails in real life\n———\n🔥《真正利己＝這樣設計》\n👉讓學生\n👉為了自己好，不得不學\nMake students learn\nBecause it benefits them\n———\n🚀《你的課在做什麼》\n你不是少教\nYou are not teaching less\n你是在👇\nYou are actually:\n👉設計環境\nDesigning environment\n👉給工具\nGiving tools\n👉逼輸出\nForcing output\n👉養能力\nBuilding ability\n———\n🧠《學生版白話》\n👉你以為老師講越多\n👉你越輕鬆\nYou think more teaching = easier for you\n👉但真相是👇\nBut the truth is:\n👉你越依賴\n👉你越弱\nThe more you depend\nThe weaker you become\n👉你現在覺得難\n👉代表你在成長\nIf it feels hard\nIt means you are growing\n———\"\n\n──────────────────────────────────────────────────", "length": 2401}, {"id": 197, "date": "2026/04/10（五） 06:13", "author": "欣蓉", "title": "核心引導一句（先穩住）", "category": "班導用語", "content": "2026/04/10（五） 06:13 - 欣蓉\n\n\"🔥《核心引導一句（先穩住）》\n👉不是你不會\n👉也不是老師不好\nIt is not that you cannot learn\nAnd it is not just the teacher’s problem\n👉是方法還沒對\n👉還沒有開始練\nIt means the method is not right yet\nAnd you have not practiced enough yet\n———\n🧠《先同理，再翻轉》\n👉我懂你覺得難\nI understand you feel it is hard\n👉我也知道你會想\n👉是不是老師教不好\nI know you may think\nMaybe the teacher is not good\n👉這個想法很正常\nThat feeling is normal\n———\n👉但我要告訴你一個真相👇\nBut here is the truth:\n👉如果「聽懂」就會\n👉那每個人都會英文\nIf listening was enough\nEveryone would be good at English\n———\n🔥《關鍵翻轉》\n👉英文不是「聽會」\n👉是「用會」\nEnglish is not about understanding\nIt is about using\n👉你沒有變強\n👉不是因為老師講不夠\nYou are not improving\nNot because I did not teach enough\n👉是因為你用得不夠\nIt is because you did not use it enough\n———\n💥《直接點醒（不攻擊版）》\n👉如果老師一直講\n👉你會怎樣？\nIf I keep talking\nWhat will you do?\n👉更輕鬆\n👉但更依賴\nYou feel easier\nBut you depend more\n👉短期舒服\n👉長期更弱\nShort-term comfort\nLong-term weakness\n———\n🧠《讓學生看到選擇》\n👉你有兩條路👇\nYou have two choices:\n1️⃣繼續聽\n👉覺得自己懂\n👉但不會用\nKeep listening\nYou feel you understand\nBut you cannot use it\n2️⃣開始做\n👉會卡\n👉但會變強\nStart doing\nIt feels hard\nBut you get stronger\n———\n🔥《利己切入（最關鍵）》\n👉你現在努力\n👉不是為老師\nYou work hard now\nNot for the teacher\n👉是為你自己\n👉未來可以更輕鬆\nIt is for yourself\nSo y owth\n———\n9️⃣不做輸出（寫/說）\nNo output (write/speak)\n👉結果：學不起來\nResult: cannot learn deeply\n———\n🔟依賴翻譯\nDepend on translation\n👉結果：不會思考\nResult: cannot think in English\n———\n11️⃣臨時抱佛腳\nCram before exams\n👉結果：短期記憶\nResult: short-term memory\n———\n12️⃣不上課也不補\nSkip class, no review\n👉結果：差距變大\nResult: gap increases\n———\n13️⃣不問問題\nDon’t ask questions\n👉結果：卡住\nResult: stay stuck\n———\n14️⃣只看不做\nOnly watch, no practice\n👉結果：假會\nResult: illusion of learning\n———\n15️⃣不用老師給的工具\nDon’t use tools\n👉結果：浪費資源\nResult: waste resources\n———\n16️⃣不跟同學合作\nDon’t work with others\n👉結果：少機會\nResult: fewer chances\n———\n17️⃣只想拿分數\nOnly want scores\n👉結果：沒有能力\nResult: no real skill\n———\n18️⃣逃避困難任務\nAvoid hard tasks\n👉結果：永遠弱\nResult: stay weak\n———\n19️⃣不做複習\nNo review\n👉結果：忘光\nResult: forget everything\n———\n20️⃣沒有固定學習習慣\nNo routine\n👉結果：不穩定\nResult: unstable learning\n———\n🔥《總結三句（直接洗）》\n1️⃣你現在偷的懶\nThe laziness you choose now\n👉未來都要還\nyou will pay later\n———\n2️⃣學英文不是聽懂\nLearning English is not understanding\n👉是用得出來\nIt is using it\n———\n3️⃣你現在的選擇\nYour choice now\n👉就是你的未來\nis your future\n———\n🔥《老師控班一句》\n👉你現在做的每一件事\nEverything you do now\n👉都在決定\nis deciding\n👉你是變強\nwhether you grow\n👉還是變弱\nor become weaker 🔥\"\n\n──────────────────────────────────────────────────", "length": 1733}, {"id": 200, "date": "2026/04/10（五） 06:36", "author": "欣蓉", "title": "20條矯正策略（中英）", "category": "學習策略", "content": "2026/04/10（五） 06:36 - 欣蓉\n\n\"🧠《20條矯正策略（中英）》\n1️⃣只背不會用\n👉改：每天造3句\nFix: Make 3 sentences daily\n———\n2️⃣只看答案\n👉改：先自己做→再對\nFix: Try first, then check\n———\n3️⃣抄作業\n👉改：錯題重寫一次\nFix: Rewrite wrong answers\n———\n4️⃣滑手機\n👉改：上課手機收起\nFix: Put phone away\n———\n5️⃣只聽不說\n👉改：每堂課說1句\nFix: Speak 1 sentence\n———\n6️⃣不敢開口\n👉改：先小聲講\nFix: Speak softly first\n———\n7️⃣怕錯\n👉改：每天錯5次\nFix: Make 5 mistakes daily\n———\n8️⃣只做簡單題\n👉改：每天1題難題\nFix: Do 1 hard task\n———\n9️⃣沒有輸出\n👉改：寫＋說各1次\nFix: Write + speak\n———\n🔟依賴翻譯\n👉改：先猜意思\nFix: Guess meaning first\n———\n11️⃣臨時抱佛腳\n👉改：每天10分鐘\nFix: 10 mins daily\n———\n12️⃣不上課不補\n👉改：當天補回\nFix: Catch up same day\n———\n13️⃣不問問題\n👉改：每天問1題\nFix: Ask 1 question\n———\n14️⃣只看不做\n👉改：看完就練\nFix: Learn → practice\n———\n15️⃣不用工具\n👉改：至少用1個\nFix: Use 1 tool\n———\n16️⃣不合作\n👉改：固定1搭檔\nFix: Find 1 partner\n———\n17️⃣只要分數\n👉改：記錄能力\nFix: Track skills\n———\n18️⃣逃避困難\n👉改：先做最難\nFix: Do hardest first\n———\n19️⃣不複習\n👉改：睡前3分鐘\nFix: Review before bed\n———\n20️⃣沒習慣\n👉改：固定時間\nFix: Fixed study time\n———\n🔥《升級一句（關鍵）》\n👉不是你不會\nIt’s not you can’t\n👉是你沒做對\nYou didn’t do it right\n———\n💥《老師控班三句》\n👉你不用變聰明\nYou don’t need to be smarter\n👉你只要做對\nJust do the right thing\n———\n👉每天一點點\nA little every day\n👉就會拉開差距\nCreates big difference\n———\n👉能力不是教出來\nAbility is not taught\n👉是練出來\nIt is trained\n———\n🔥《最終洗腦一句》\n👉你現在的習慣\nYour habits now\n👉就是你的未來\nare your future 🔥\"\n\n──────────────────────────────────────────────────", "length": 1294}, {"id": 201, "date": "2026/04/11（六） 06:56", "author": "欣蓉", "title": "30題AI續寫題庫（直接用）", "category": "AI未來", "content": "2026/04/11（六） 06:56 - 欣蓉\n\n\"《30題AI續寫題庫（直接用）》\n👉格式統一：One day,… when suddenly…\n🔴基礎B2（1–10）\n1 One day, Tom was walking home when he heard a noise.\n2 One day, Lisa lost her bag at school.\n3 One day, a boy found a wallet on the road.\n4 One day, a girl forgot her homework.\n5 One day, it started to rain heavily after school.\n6 One day, a student was late for an exam.\n7 One day, a dog followed a boy home.\n8 One day, a girl fell down on the playground.\n9 One day, a boy couldn’t find his phone.\n10 One day, a student didn’t understand the lesson.\n👉任務（統一）\n情緒→動作→解決\n🔴進階B3（11–20）\n11 One day, Tom was alone at night when he heard footsteps behind him.\n12 One day, Lisa was waiting for her result when her phone rang.\n13 One day, a boy saw a child crying on the street.\n14 One day, a girl got lost in a forest.\n15 One day, a student failed an important test.\n16 One day, a boy argued with his best friend.\n17 One day, a girl saw her mother working late.\n18 One day, a student helped a stranger.\n19 One day, a boy saved a small animal.\n20 One day, a girl had to speak in front of the class.\n👉任務\n情緒→轉折→領悟\n🔴高分B3+（21–30）\n21 One day, a boy lost his dog and searched everywhere.\n22 One day, a girl found a letter from the past.\n23 One day, a student almost gave up studying.\n24 One day, a man helped someone in danger.\n25 One day, a child faced his biggest fear.\n26 One day, a girl made a difficult decision.\n27 One day, a boy realized his mistake.\n28 One day, a student changed his attitude.\n29 One day, a girl experienced a life lesson.\n30 One day, a boy understood the meaning of family.\n👉任務\n情緒→動作鏈→價值\n🔥《學生分級模板（弱→強）》\n🟢弱（保底10分）\n👉公式\nI felt…\nI did…\nI learned…\n📌例\nI felt scared.\nI ran away.\nI learned to be brave.\n🟡中（保底12–15分）\n👉公式\n情緒句＋動作鏈＋結尾\n📌模板\nA wave of fear swept over me.\nI ran forward, helped him, and smiled.\nI learned something important.\n🔴強（15分以上）\n👉公式\nV-ing＋動作鏈＋領悟＋金句\n📌模板\nA surge of fear swept over me, my heart beating wildly.\nI rushed forward, held him tightly, and burst into tears.\nIt dawned on me that love matters most.\nMany things faded, but this stayed clear.\"\n\n──────────────────────────────────────────────────", "length": 2109}, {"id": 202, "date": "2026/04/11（六） 08:47", "author": "欣蓉", "title": "學生錯誤大全（一次補強）", "category": "英文教學", "content": "2026/04/11（六） 08:47 - 欣蓉\n\n\"《學生錯誤大全（一次補強）》\n🔴錯誤1：只寫情緒（低分）\n❌I was very sad\n✅Tears filled my eyes\n👉重點：用畫面\n🔴錯誤2：沒有動作\n❌I felt scared\n✅I ran away,looked back,and hid\n👉重點：3動作\n🔴錯誤3：沒有結尾\n❌故事結束\n✅I learned something important\n🔴錯誤4：濫用very\n❌very very scared\n✅extremely scared / terrified\n🔴錯誤5：句子太短\n❌I ran.I cried.I stopped\n✅I ran forward,cried,and stopped\n🔴錯誤6：沒有連接\n❌He ran.He fell.He cried\n✅He ran forward,fell down,and burst into tears\n🔴錯誤7：中式英文\n❌My heart very pain\n✅My heart ached\n🔴錯誤8：沒有情緒變化\n❌從頭到尾一樣\n✅fear→relief→growth\n🔴錯誤9：沒有細節\n❌He was scared\n✅His heart beat wildly\n🔴錯誤10：沒有「領悟」\n❌結束\n✅It dawned on me that…\n🔥《續寫滿分範文（可背）》\n🔴滿分範文1（通用）\nA surge of fear swept over me,my heart beating wildly.I stood there,unable to move.Suddenly,I rushed forward,helped him up,and held him tightly,tears filling my eyes.It dawned on me that courage is not the absence of fear,but the choice to move forward.Many things faded from memory,but this moment stayed clear.\n🔴滿分範文2（成長型）\nA deep sense of sadness flooded over me.I lowered my head,thinking I had failed.However,I took a deep breath,tried again,and finally succeeded.It dawned on me that failure is not the end,but the beginning of growth.Many things faded,but this lesson remained clear in my mind.\n🔴滿分範文3（感動型）\nTears filled my eyes as I saw her smile.I walked towards her,hugged her tightly,and cried.It was at that moment that I realized how important love is.Many things faded away,but this memory stayed clear forever.\n🔥最強總結（給學生）\n👉續寫＝\n情緒＋3動作＋領悟\n👉不會寫？\n👉直接套\"\n\n──────────────────────────────────────────────────", "length": 1536}, {"id": 203, "date": "2026/04/11（六） 08:49", "author": "欣蓉", "title": "學測滿分套路（全題型）", "category": "英文解題", "content": "2026/04/11（六） 08:49 - 欣蓉\n\n\"🔥《學測滿分套路（全題型）》\n🧠一、核心總公式（先背）\n👉續寫滿分＝\n情緒＋動作鏈＋畫面＋領悟\n👉15分保底\n＝情緒句＋3動作＋1結尾\n👉18分以上\n＝再加👇\n✔V-ing\n✔身體反應\n✔金句\n🔴二、開頭套路（必用1句）\n①情緒爆發（最萬用）\nA wave/surge of + 情緒 + swept over sb\n📌例\nA surge of fear swept over him\n②無靈主語（高級）\nTime seemed to stop\nThe moment witnessed…\n③環境帶入（加分）\nThe wind blew fiercely\nThe room was silent\n👉開頭公式\n情緒＋環境＋卡住\n📌模板\nA wave of fear swept over him,the wind blowing fiercely,and he stood there,unable to move\n🔴三、中間套路（拿分關鍵）\n①動作鏈（一定要）\n👉A,B,and C\n📌例\nHe rushed forward,hugged her,and cried\n②情緒＋身體（加分）\n👉心跳\n👉眼淚\n👉手抖\n📌例\nHis heart beat wildly,tears filled his eyes\n③心理句（升級）\nIt occurred to him that…\n④非謂語（高分）\nV-ing\n📌例\nHolding his breath,he waited\n👉中間公式\n動作鏈＋身體反應＋心理\n🔴四、結尾套路（決勝）\n①領悟句（必備）\nIt dawned on sb that…\n②萬能句（保底）\nMany things faded,but this stayed clear\n③虛擬句（高分）\nHad it not been for this,…\n👉結尾公式\n領悟＋金句\n🔴五、全題型套用\n🟢1️⃣情緒型（最常考）\n👉套路\nfear→action→relief\n📌模板\nA wave of fear…\nHe ran,looked back,and hid\nHe finally felt relieved\n🟡2️⃣成長型（最穩拿分）\n👉套路\nfailure→努力→成功\n📌模板\nHe felt hopeless\nHe tried again,worked hard,and improved\nIt dawned on him that failure leads to growth\n🔵3️⃣助人型（高分）\n👉套路\n看到→幫助→感動\n📌模板\nHe saw someone in trouble\nHe rushed forward,helped him,and smiled\nHe realized kindness matters\n🟣4️⃣親情型（容易滿分）\n👉套路\n忽略→發現→珍惜\n📌模板\nHe didn’t care before\nHe saw his mother working\nHe hugged her and cried\nHe realized love matters\n🔴5️⃣冒險型（畫面感）\n👉套路\n危險→行動→安全\n📌模板\nA surge of fear…\nHe moved forward,fought,and survived\nHe learned to be brave\n⚫6️⃣選擇型（高思維）\n👉套路\n猶豫→決定→成長\n📌模板\nShe felt confused\nShe thought deeply,decided,and acted\nShe learned to trust herself\n🔴六、必備句型（直接背）\n👉情緒\nA wave of fear swept over me\n👉動作鏈\nI ran forward,helped him,and smiled\n👉身體\nMy heart beat wildly\n👉領悟\nIt dawned on me that…\n👉結尾\nMany things faded,but this stayed clear\n🔴七、扣分地雷（一定避開）\n❌沒有情緒\n❌沒有動作\n❌只有翻譯\n❌沒有結尾\n❌一直very\n🔥八、老師評分口訣\n👉看3件事\n✔有沒有情緒\n✔有沒有畫面\n✔有沒有成長\n🔥九、學生一頁記住\n👉開頭＝情緒爆\n👉中間＝像電影\n👉結尾＝人生句\n🔥最強一句（直接講）\n👉你不是不會寫\n👉你是不會「套公式」\"\n\n──────────────────────────────────────────────────", "length": 1930}, {"id": 204, "date": "2026/04/11（六） 10:34", "author": "欣蓉", "title": "2026/04/11（六） 10:34 - 欣蓉", "category": "學習策略", "content": "2026/04/11（六） 10:34 - 欣蓉\n\n「學生有產出，才叫教學」\n2026/04/12（日）\n\n──────────────────────────────────────────────────", "length": 104}, {"id": 205, "date": "2026/04/12（日） 08:09", "author": "欣蓉", "title": "2026/04/12（日） 08:09 - 欣蓉", "category": "學習策略", "content": "2026/04/12（日） 08:09 - 欣蓉\n\n\"、把班級當「系統」看\n👉四大核心變量（一定要抓）\n1️⃣激勵（為什麼要做）\n2️⃣約束（不做會怎樣）\n3️⃣結構（怎麼運作）\n4️⃣回饋（做了有沒有反應）\n👉一句\n班級亂＝這四個出問題\n———\n🔴三、快速診斷（直接用）\n看到問題👉立刻問👇\n👉這是👇\n✔人問題？還是系統問題？\n✔偶發？還是結構性？\n✔表象？還是底層？\n👉再問👇\n✔關鍵變量是什麼？\n✔哪個才是真瓶頸？\n———\n🔴四、常見班級問題→模型拆解\n1️⃣學生不交作業\n❌直覺：懶\n✅本質：\n👉變量\n✔回饋太慢\n✔沒有代價\n✔沒有成就感\n👉策略\n✔當天回饋（即時）\n✔小任務（降低門檻）\n✔排行榜（社會壓力）\n———\n2️⃣上課沒專心\n❌直覺：態度差\n✅本質：\n👉變量\n✔內容太難／太無聊\n✔沒有參與感\n✔沒有輸出\n👉策略\n✔每10分鐘有任務\n✔要學生「產出」\n✔分組競爭\n👉一句\n沒輸出＝一定分心\n———\n3️⃣班級很吵\n❌直覺：不守規矩\n✅本質：\n👉變量\n✔規則不清\n✔沒有一致執行\n✔沒有成本\n👉策略\n✔規則少但絕對執行\n✔違規→立即代價\n✔用群體壓力（全班連動）\n———\n4️⃣兩極化（強更強 弱更弱）\n❌直覺：能力差\n✅本質：\n👉變量\n✔任務難度不分層\n✔弱者沒有成功經驗\n👉策略\n✔分層任務（簡單→進階）\n✔讓弱者先贏一次\n✔強者給挑戰\n———\n5️⃣學生沒動機\n❌直覺：躺平\n✅本質：\n👉變量\n✔看不到回報\n✔目標太遠\n✔沒有即時成就\n👉策略\n✔短期回饋（每天）\n✔小成功設計\n✔可見進步（排行榜）\n———\n🔴五、用「高認知能力」帶班\n1️⃣分類能力（最關鍵）\n👉把所有問題分類\n✔激勵問題\n✔資訊問題\n✔回饋問題\n✔結構問題\n👉一句\n分類對＝解一半\n———\n2️⃣壓縮能力\n👉不要看10個問題\n👉只抓3個：\n✔最大瓶頸\n✔最大影響\n✔最容易改\n👉一句\n不是解全部\n👉是打關鍵點\n———\n3️⃣關係能力（高手）\n👉看到鏈條👇\n作業不交\n→沒回饋\n→沒成就感\n→更不想做\n→惡性循環\n👉策略\n👉打斷其中一段\n———\n🔴六、班導最重要能力（直接背）\n👉不是講很多\n👉是設計系統\n👉不是盯學生\n👉是設計環境\n👉不是一直罵\n👉是設計回饋\n———\n🔴七、班級三大核心設計（一定要做）\n1️⃣回饋系統\n✔每天有回饋\n✔做了就有反應\n✔看得到進步\n👉沒回饋＝系統死\n———\n2️⃣激勵系統\n✔排名／點數／獎勵\n✔團隊競爭\n✔可見成果\n👉沒激勵＝沒動力\n———\n3️⃣約束系統\n✔規則清楚\n✔違規有成本\n✔立即執行\n👉沒約束＝一定亂\n———\n🔴八、最常犯的錯（超重要）\n❌一直講道理\n❌一直怪學生\n❌一直換方法\n👉但不改系統\n👉結果\n👉永遠一樣\n———\n🔴九、班導升級三句話（貼牆）\n1️⃣問題不是人\n👉是系統\n2️⃣沒有回饋\n👉就沒有行為\n3️⃣改變不是說\n👉是設計\"\n2026/04/13（一）\n\n──────────────────────────────────────────────────", "length": 1255}, {"id": 206, "date": "2026/04/13（一） 08:04", "author": "欣蓉", "title": "2026/04/13（一） 08:04 - 欣蓉", "category": "學習策略", "content": "2026/04/13（一） 08:04 - 欣蓉\n\n\"🔥人生真正的自信與愉悅感：不是情緒，而是結構\n給國中生的超白話解析\n一、核心一句\n真正的自信，不是突然覺得自己很棒；\n是真正越來越看懂世界，也越來越看懂自己。\n二、什麼叫「自信不是情緒」？\n很多人以為自信是：\n今天心情好\n有人誇我\n我考得不錯\n我狀態很好\n但這些常常只是短暫感覺。\n真正穩的自信不是一下高、一下低，\n而是你慢慢知道：\n自己現在在哪裡\n自己哪裡強\n自己哪裡弱\n遇到問題要怎麼調整\n世界是怎麼運作的\n這種自信比較像：\n👉理解後的穩定感\n三、什麼叫「對世界和現實的持續理解與校準」？\n理解\n就是你看得越來越清楚。\n校準\n就是你發現自己想錯了，願意修正。\n例子\n你原本以為：\n我英文不好，因為我很笨\n後來你發現：\n不是笨，是單字量不夠、複習方法也錯了\n這就是從「情緒判斷」變成「現實校準」。\n再比如：\n我以為我做不到\n後來你發現：\n其實我不是做不到，是我每次都太晚開始\n這也是校準。\n四、所以真正的自信怎麼來？\n不是靠幻想\n不是一直對自己說：\n我很棒我很棒我很棒\n而是靠下面三件事\n看清現實\n接受問題\n一點一點調整\n這樣你會開始有一種感覺：\n我知道問題在哪\n所以我不怕了\n這才是真正的自信。\n五、那什麼叫「愉悅感不是無邊界自由」？\n很多人以為快樂就是：\n想做什麼就做什麼\n不想讀書就不要讀\n不想睡就不要睡\n不想被管\n完全自由\n但這種「沒邊界」的自由，常常最後變成：\n作息亂\n成績掉\n情緒更亂\n壓力更大\n六、真正的愉悅感從哪裡來？\n真正舒服的感覺，常常不是亂做，\n而是：\n👉在清楚規則裡，有選擇權。\n例如：\n你知道今天要先寫功課，再休息\n你知道什麼時候該玩，什麼時候該收\n你知道你可以選A或B，但不能整天亂掉\n這種「有邊界的自由」才會帶來真正輕鬆。\n七、生活例子\n沒邊界自由\n今天想滑手機就滑到半夜\n當下爽\n明天痛苦\n有邊界自由\n先完成該做的事\n再放心玩30分鐘\n玩得更安心，也不會內疚\n👉後者比較容易有真正的愉悅感。\n八、什麼叫「系統結構對齊」？\n這句話的意思是：\n你的生活不是亂的，\n而是慢慢對齊了。\n例如：\n目標和行動對齊\n作息和身體對齊\n想法和現實對齊\n自由和責任對齊\n一旦對齊，你就會比較穩。\n九、你一定要記住\n真正的自信＝看懂＋修正\n真正的快樂＝有邊界的自由\"\n\n──────────────────────────────────────────────────", "length": 1018}, {"id": 207, "date": "2026/04/13（一） 08:25", "author": "欣蓉", "title": "A4一頁總圖版：高結構表達×四大核心問題（貼教室）", "category": "思維框架", "content": "2026/04/13（一） 08:25 - 欣蓉\n\n\"🔥《A4一頁總圖版：高結構表達×四大核心問題（貼教室）》\n🎯核心一句\n表達不是在說話，是在建構認知空間\nExpression is not speaking; it is building a cognitive structure\n🔴一、什麼是高結構表達\n👉一句話\n高結構＝說的每一句，都有位置、有層次、有關係、能推進\n👉白話\n不是講很多\n不是講很強\n👉是「別人聽完，腦中變清楚」\n🔴二、低結構 vs 高結構（一眼對比）\n低結構\n情緒＋片段\n想到就說\n聽完就停\n爭對錯\n容易吵架\nLow structure\nemotion + fragments\nrandom speaking\nstops after listening\nargues right vs wrong\n高結構\n機制＋邏輯\n有順序輸出\n能往下推\n建模型\n不需要爭\nHigh structure\nmechanism + logic\nstructured output\ncan be extended\nbuilds models\n🔴三、四大核心問題（一定要背）\n1️⃣坐標問題（Position）\n👉你這句話在講什麼類型？\n事實 Fact\n經驗 Experience\n機制 Mechanism\n價值判斷 Judgment\n👉一句\n先分清在講什麼，不然全部混在一起\n2️⃣層級問題（Level）\n👉你在第幾層？\n描述層 Description（看到什麼）\n解釋層 Explanation（為什麼）\n規則層 Rule（背後規律）\n👉一句\n層級亂跳＝聽的人直接當機\n3️⃣關係問題（Relation）\n👉句子之間什麼關係？\n並列 Parallel\n遞進 Progression\n因果 Cause-effect\n轉折 Contrast\n👉一句\n沒關係＝一堆零件；有關係＝一台機器\n4️⃣可演繹性（Inference）\n👉聽完能不能往下推？\n不能👉死句\n可以👉有結構\n👉一句\n好表達＝聽完會自己長出下一句\n🔴四、為什麼高結構的人不愛吵架\n👉不是脾氣好\n👉是層級不同\n低結構\n👉在爭「你對我錯」\n高結構\n👉在看「你站哪一層、漏了什麼」\n👉一句\n結構一清楚，很多爭論自然消失\n🔴五、表達的真正終點\n低結構\n👉贏\n👉被認同\n👉證明自己對\n高結構\n👉讓對方看懂世界\n👉一句\n不是贏，是讓對方變清楚\n🔴六、最重要金句（貼牆版）\n會說話的人，在輸出句子\n高手，在輸出結構\nLow-level speakers output sentences\nHigh-level thinkers output structure\n不是讓別人聽到你\n是讓別人看懂世界\n一句收尾（超重要）\n👉\n表達的穿透力，不在語言本身，\n而在背後有沒有一個可以被走進去的結構\"\n\n──────────────────────────────────────────────────", "length": 1222}, {"id": 208, "date": "2026/04/16（四） 05:44", "author": "欣蓉", "title": "高中班導×英文老師｜結構密度→可直接用教學SOP", "category": "班導班務", "content": "2026/04/16（四） 05:44 - 欣蓉\n\n\"🔥《高中班導×英文老師｜結構密度→可直接用教學SOP》\n（繁體字｜極限壓縮｜可帶班×可貼牆×可直接做）\n———\n👉核心一句（給學生）\n不是讀很多\n👉是「會轉化才會贏」\nNot more input\n👉Better transformation wins\n———\n🔴①辨識（Signal vs Noise）→課堂做法（15）\n1️⃣每課只留1句核心句（Key Sentence）\n2️⃣先問：這句有用嗎？（Useful?）\n3️⃣只用課本＋老師整理（No雜訊）\n4️⃣句子拆：主詞/動詞/重點字\n5️⃣找關鍵字（Keyword抓）\n6️⃣一課只學3句（80/20）\n7️⃣標記可用句（★）\n8️⃣刪掉不考/不常用句\n9️⃣用中文先懂→再英文\n🔟每句都問：可不可以用？\n1️⃣1️⃣看範例句（Real use）\n1️⃣2️⃣找反例（什麼不能用）\n1️⃣3️⃣同句多場景（transfer）\n1️⃣4️⃣黑名單：不背難句\n1️⃣5️⃣最後只留「會用句」\n👉一句\n不是學很多句\n👉是留下「會用句」\n———\n🔴②快速更新（Update）→課堂做法（15）\n1️⃣每日3句（Daily 3 sentences）\n2️⃣錯的句子立即改\n3️⃣每週複習一次\n4️⃣建立「句型版本」\n5️⃣接受不會→再學\n6️⃣用AI幫改句\n7️⃣小量多次練習\n8️⃣句型替換練習\n9️⃣舊句→新用法\n🔟學新句型（每週1個）\n1️⃣1️⃣學完立刻說\n1️⃣2️⃣建立句型卡片\n1️⃣3️⃣課堂快速重複\n1️⃣4️⃣同學互改句\n1️⃣5️⃣接觸高手句（老師範例）\n👉一句\n不是記住\n👉是一直更新\n———\n🔴③快速校準（Feedback）→課堂做法（15）\n1️⃣每句都要說出口\n2️⃣老師即時糾錯\n3️⃣設KPI：今天說3句\n4️⃣記錄錯誤句\n5️⃣對標好學生句\n6️⃣A/B句型比較\n7️⃣當場修正\n8️⃣用現實情境驗證\n9️⃣每節課小測\n🔟預測→說→修正\n1️⃣1️⃣建立錯誤本\n1️⃣2️⃣每週看進步\n1️⃣3️⃣同儕回饋\n1️⃣4️⃣老師給第三方觀點\n1️⃣5️⃣長期追蹤（會不會用）\n👉一句\n不是做完\n👉是修正到會\n———\n🔴④轉化（Action）→課堂做法（15）\n1️⃣每句都要「自己說」\n2️⃣任務＝3句口說\n3️⃣建立SOP：看→改→說\n4️⃣降低難度（只3句）\n5️⃣設時間（5分鐘）\n6️⃣先完成再修\n7️⃣學生教學生\n8️⃣建立句型清單\n9️⃣設提醒（每天用）\n🔟抽象→具體句\n1️⃣1️⃣連結生活（我今天）\n1️⃣2️⃣建立使用情境\n1️⃣3️⃣固定開口時間\n1️⃣4️⃣環境設計（全班說）\n1️⃣5️⃣強制輸出（每人必說）\n👉一句\n英文不是背\n👉是「用出來」\n———\n🔥《High Agency班級經營版（直接用）》\n———\n🔴一、課堂結構（固定流程）\n1️⃣輸入（看句）\n2️⃣理解（拆句）\n3️⃣輸出（學生說）\n4️⃣回饋（立即修）\n👉一句\n一節課＝一定有產出\nEvery class = Output\n———\n🔴二、任務設計（超關鍵）\n👉每節課\n✔3句英文口說\n✔5分鐘完成\n✔每人都說\n👉一句\n少量×高頻×必做\n———\n🔴三、控班話術（直接用）\n👉開始\n今天不聽課\n👉要說英文\nToday = Speak\n👉卡住\n先說一句\nJust one sentence\n👉怕錯\n錯很好\n👉代表在學\nMistakes = learning\n👉不做\n你不是不會\n👉是還沒做\nNot done yet\n👉拖延\n現在開始\n👉不用完美\nStart now\n———\n🔴四、排行榜（動機系統）\n✔說句數\n✔正確率\n✔進步幅度\n👉一句\n讓努力被看見\nMake progress visible\n———\n🔴五、低動機學生（最重要）\n👉不要講道理\n👉給最小任務\n✔只說1句\n✔完成就好\n👉一句\n行動＞動機\n———\n🔴六、班級文化（洗腦牆）\n✔英文＝工具\n✔錯誤＝學習\n✔輸出＝能力\n👉一句\n會說的人\n👉才算會\n———\n🔥總結（老師版）\n你不是在教英文\n👉你在設計「輸出系統」\n———\n🔥最強收尾\n世界不缺會讀的人\n👉缺會用的人\"\n\n──────────────────────────────────────────────────", "length": 1778}, {"id": 209, "date": "2026/04/16（四） 09:16", "author": "欣蓉", "title": "2026/04/16（四） 09:16 - 欣蓉", "category": "學習策略", "content": "2026/04/16（四） 09:16 - 欣蓉\n\n\"消費 Spend｜資本 Capital\n看書很多 Read a lot｜做摘要輸出 Write summary & teach\n👉看10本 vs 教1本\n刷英文影片 Watch videos｜錄自己講解 Record yourself explaining\n👉看懂 vs 說出\ 部門資源爭奪（對方是平級同事）\n👉技巧：強化BATNA（替代方案）＋製造「合理」退路\n4️⃣場景：房東漲租（對方是個人業主）\n👉技巧：黑臉＋白臉（引入虛擬權威）\n5️⃣場景：客戶要求降價（對方是甲方採購）\n👉技巧：「如果…那麼…」條件化讓步\n6️⃣場景：專案延期追責（對方是乙方或協作方）\n👉技巧：聚焦利益而非立場＋給台階（面子）\n7️⃣場景：二手車／設備買賣（對方是個人或小商家）\n👉技巧：紅鯡魚策略（聲東擊西）\n8️⃣場景：團隊分工與責任邊界（對方同級或下屬）\n👉技巧：「獅子大開口」＋「勉為其難」\n9️⃣場景：挽回客戶／處理投訴（對方情緒激動）\n👉技巧：掌控節奏＋給台階（面子）\n🔥邏輯白話（一定要懂）\n👉談判3大底層\n1️⃣不是比誰對\n👉是比誰「有選擇」\n2️⃣不是比誰硬\n👉是比誰「有策略」\n3️⃣不是講道理\n👉是「設計局」\n🧠九大技巧＝九種人性槓桿\n👉錨定＝先定價格\n👉利益＞立場＝找雙贏\n👉BATNA＝有退路才敢談\n👉黑白臉＝壓力＋出口\n👉條件交換＝沒有免費讓步\n👉面子＝人要台階\n👉紅鯡魚＝轉移焦點\n👉開高收低＝先拉空間\n👉節奏控制＝誰急誰輸\n🎯經典例子（超好背）\n①面試談薪（錨定效應）\n👉錯誤\nHR：你期望薪資？\n你：都可以\n👉正確\n你：市場行情約5–6萬，我希望6萬\n👉先定高點\n②採購壓價（利益＞立場）\n👉錯誤\n你：太貴\n👉正確\n你：如果長期合作＋穩定訂單\n👉能否降價？\n👉把「價格」→變「合作價值」\n③資源爭奪（BATNA）\n👉核心\n👉沒有備案＝被吃死\n👉例\n「如果這個資源拿不到\n我會走B方案」\n👉你才有談判力\n④房東漲租（黑白臉）\n👉例\n你：我可以接受\n👉但我家人不同意\n👉創造「第三方壓力」\n⑤客戶砍價（條件交換）\n👉錯誤\n客戶：便宜一點\n你：好\n👉正確\n你：如果降價\n👉那要增加訂單量\n⑥專案延期（給台階）\n👉錯誤\n你：都是你害的\n👉正確\n你：我們一起把專案救回來\n👉給對方面子＋合作\n⑦二手交易（紅鯡魚）\n👉例\n你其實想壓價格\n👉但先挑小瑕疵\n👉轉移焦點\n👉最後談價\n⑧分工談判（開高收低）\n👉例\n你先講最理想分工\n👉再退一步\n👉讓對方覺得「你讓了」\n⑨客訴處理（節奏＋面子）\n👉例\n客戶爆氣\n👉你先慢\n👉讓他講完\n👉最後給解法＋台階\n🔥最強總結（直接背）\n👉沒有退路＝沒有談判\n👉No BATNA = No power\n👉先定錨＝先贏一半\n👉First anchor wins\n👉讓步一定要交換\n👉No free concession\n👉人要面子＞要道理\n👉Face > Logic\n👉誰急誰輸\n👉The one who rushes loses\n🚀一行最強句（洗腦用）\n👉談判不是說服\n👉是設計對方「願意同意」\n👉Negotiation is not persuasion\n👉It is designing agreement\"\n\n──────────────────────────────────────────────────", "length": 1433}, {"id": 212, "date": "2026/04/16（四） 09:45", "author": "欣蓉", "title": "高中英文老師＋班導｜能力→產品→變現 A4一頁策略圖", "category": "學習策略", "content": "2026/04/16（四） 09:45 - 欣蓉\n\n\"《高中英文老師＋班導｜能力→產品→變現 A4一頁策略圖》\n（繁體｜極限壓縮｜雙語B3-B4｜可直接帶班＋變現）\n🧠核心一句\n👉你不是在教英文\n👉你是在打造「學習系統＋輸出機器」\n👉You are not teaching English; you build a learning system\n🔴一、能力盤點（Teacher Skill Base）\n1️⃣語言教學（Teaching English）\n2️⃣課程設計（Curriculum design）\n3️⃣班級管理（Class management）\n4️⃣評量系統（Assessment design）\n5️⃣溝通說服（Parent/student communication）\n👉一句\n👉老師＝系統設計師（Teacher = system designer）\n🟡二、能力 → 產品（Skill → Product）\n🔧15個可直接做的產品\n1️⃣《高中雙語Google表單》\nBilingual quiz forms\n2️⃣《洗腦牆120句（中英）》\n1
